    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const dashboardApp = (function () {

            // ========================================================================================================
            // SHARED STATE MANAGER (Moved to top for global access within dashboardApp)
            // ========================================================================================================
            const StateManager = (() => {
                const state = { selectedPeriodIndex: null };
                const subscribers = {};
                return {
                    getState: (key) => key ? state[key] : state,
                    subscribe: (key, callback) => {
                        if (!subscribers[key]) subscribers[key] = [];
                        subscribers[key].push(callback);
                    },
                    setState: (key, data) => {
                        const currentState = state[key];
                        let hasChanged = false;
                        if (typeof currentState === 'object' && currentState !== null && typeof data === 'object' && data !== null) {
                            if (JSON.stringify(currentState) !== JSON.stringify(data)) hasChanged = true;
                        } else {
                            if (currentState !== data) hasChanged = true;
                        }
                        if (!hasChanged) return;
                        state[key] = data;
                        if (subscribers[key]) subscribers[key].forEach(callback => callback(data));
                    }
                };
            })();

            // ========================================================================================================
            // SECTION 1: CONFIGURATION (THE ONLY PART TO EDIT FOR A NEW DASHBOARD)
            // This section simulates `config.js`.
            // ========================================================================================================
            const CONFIGURATION = (() => {
                /**
                 * HOW TO USE THIS TEMPLATE:
                 * 1.  Update `dashboardTitle` with the title for your dashboard.
                 * 2.  Define your Key Performance Indicators (KPIs) in the `kpiConfig` array.
                 * 3.  Define your chart layout and configurations in the `layoutConfig` array.
                 * 4.  Update the `DATA_PROVIDER` section to connect to your live backend API.
                 * 5.  Ensure your data provider returns data objects with keys that match the `dataKey` properties defined here.
                 */
                const dashboardTitle = 'Production Efficiency & Quality';


                const kpiConfig = [
                    {
                        id: 'kpi-total-production',
                        dataKey: 'total_production_nop',
                        label: 'Total Production (NOP)',
                        isCurrency: false,
                        cssVar: '--glow-green',
                        secondaryMetrics: [{ icon: 'bi-layers', dataKey: 'units_produced', label: 'Impressions' }],
                        guide: { title: 'Total Production / NOP', definition: 'Net Operating Production (NOP) represents the total quantity of good units produced, excluding rejected or scrapped items.', interpretation: 'Indicates the overall output and efficiency of the production line.', calculation: 'Sum of good units produced.' },
                        drilldownConfig: {
                            dataKey: 'production_records',
                            reportName: 'Daily Production Efficiency Log',
                            columns: [
                                { key: 'machine_no', label: 'Machine No' },
                                { key: 'operator_name', label: 'Operator Name' },
                                { key: 'actual_crew_size', label: 'Actual Crew Size' },
                                { key: 'job_name', label: 'Job Name / Title' },
                                { key: 'client_customer', label: 'Client / Customer' },
                                { key: 'gross_impressions', label: 'Gross Impressions' },
                                { key: 'net_production_nop', label: 'Net Production (NOP)' },
                                { key: 'actual_nop_e', label: 'Actual NOP (E)' },
                                { key: 'impressions_per_hr', label: 'Impressions / Hr' },
                                { key: 'press_std_vs_act_mkr', label: 'Press Std vs Act MKR' },
                                { key: 'press_running_time', label: 'Press Running Time' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-ipqc-rejection',
                        dataKey: 'ipqc_rejection_pct',
                        label: 'IPQC Rejection %',
                        valueSuffix: '%',
                        cssVar: '--glow-orange',
                        invertGrowthColor: true,
                        secondaryMetrics: [
                            { icon: 'bi-shield-slash', dataKey: 'rejected_qty', label: 'Rejected Qty' },
                            { icon: 'bi-currency-rupee', dataKey: 'scrap_value', label: 'Scrap Value', format: 'currency_compact' }
                        ],
                        guide: {
                            title: 'IPQC Rejection Percentage',
                            definition: 'The percentage of units rejected during In-Process Quality Control (IPQC) checks out of the total units inspected.',
                            interpretation: 'A key indicator of production quality and stability. A lower percentage is desirable.',
                            calculation: '(Total Rejected Units / Total Inspected Units) * 100.'
                        },
                        drilldownConfig: {
                            dataKey: 'ipqc_rejection_details',
                            reportName: 'Defect Root Cause Analysis',
                            columns: [
                                { key: 'primary_defect_reason', label: 'Primary Defect Reason' },
                                { key: 'defect_severity', label: 'Defect Severity' },
                                { key: 'total_defect_count', label: 'Total Defect Count' },
                                { key: 'total_defect_pct', label: 'Total Defect %', format: 'percent' },
                                { key: 'responsible_department', label: 'Responsible Department' },
                                { key: 'machine_no', label: 'Machine No' },
                                { key: 'operator_name', label: 'Operator Name' },
                                { key: 'material_root_cause', label: 'Material Root Cause' },
                                { key: 'paper_gsm_type', label: 'Paper GSM / Type' },
                                { key: 'ink_series_batch', label: 'Ink Series / Batch' },
                                { key: 'paper_lot_no', label: 'Paper Lot No' },
                                { key: 'rejected_qty_lot', label: 'Rejected Qty (Lot)' },
                                { key: 'rejected_value', label: 'Rejected Value', format: 'currency' },
                                { key: 'estimated_rework_cost', label: 'Estimated Rework Cost', format: 'currency' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-wastage-cost-ratio',
                        dataKey: 'wastage_cost_ratio',
                        label: 'Wastage Actual vs. Allowance Ratio',
                        valueSuffix: '%',
                        cssVar: '--glow-lightblue',
                        invertGrowthColor: true,
                        secondaryMetrics: [
                            { icon: 'bi-exclamation-triangle', dataKey: 'actual_wastage_cost', label: 'Actual Wastage Value', format: 'currency_compact' },
                            { icon: 'bi-shield-check', dataKey: 'wastage_allowance', label: 'Allowed Wastage Value', format: 'currency_compact' }
                        ],
                        guide: {
                            title: 'Wastage Cost Ratio',
                            definition: 'The ratio of the actual cost of wasted materials against the budgeted allowance for wastage.',
                            interpretation: 'Measures cost control in the wastage process. A ratio over 100% indicates that wastage costs have exceeded the budget.',
                            calculation: '(Actual Wastage Cost / Wastage Allowance) * 100.'
                        },
                        drilldownConfig: {
                            dataKey: 'wastage_cost_details',
                            reportName: 'Material Yield & Variance Report',
                            columns: [
                                { key: 'job_name', label: 'Job Name' },
                                { key: 'so_pwo_no', label: 'SO / PWO No' },
                                { key: 'standard_bom_qty', label: 'Standard BOM Qty' },
                                { key: 'actual_consumed_qty', label: 'Actual Consumed Qty' },
                                { key: 'usage_variance_pct', label: 'Usage Variance %', format: 'percent' },
                                { key: 'press_spoilage', label: 'Press Spoilage' },
                                { key: 'binding_spoilage', label: 'Binding Spoilage' },
                                { key: 'mr_waste_sheets', label: 'M/R Waste Sheets' },
                                { key: 'total_scrap_kg', label: 'Total Scrap (KG)' },
                                { key: 'return_to_store_qty', label: 'Return to Store Qty' },
                                { key: 'floor_balance_wip', label: 'Floor Balance (WIP)' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-oddment-cost',
                        dataKey: 'oddment_cost',
                        label: 'Oddment Cost (INR)',
                        isCurrency: true,
                        currencySymbol: '₹', // Assuming INR
                        cssVar: '--glow-red',
                        invertGrowthColor: true,
                        secondaryMetrics: [
                            { icon: 'bi-hash', dataKey: 'oddment_count', label: 'oddment_count' }
                        ],
                        guide: {
                            title: 'Oddment Cost',
                            definition: 'The total cost associated with oddments—leftover or scrap material from the production process.',
                            interpretation: 'Measures material wastage efficiency. A lower cost indicates better material utilization and cost control.',
                            calculation: 'Sum of (Oddment Quantity * Material Cost) for all scrap materials.'
                        },
                        drilldownConfig: {
                            dataKey: 'oddment_cost_details',
                            reportName: 'Scrap & Non-Conformance Cost Report',
                            columns: [
                                { key: 'scrap_type', label: 'Scrap Type' },
                                { key: 'total_scrap_kg', label: 'Total Scrap (KG)' },
                                { key: 'scrap_pct', label: 'Scrap %', format: 'percent' },
                                { key: 'rejected_value', label: 'Rejected Value', format: 'currency' },
                                { key: 'recovery_value', label: 'Recovery Value (Scrap Sale)', format: 'currency' },
                                { key: 'disposal_status', label: 'Disposal Status' },
                                { key: 'jw_type', label: 'JW Type' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-amr-value',
                        dataKey: 'amr_value',
                        label: 'AMR Value (INR)',
                        isCurrency: true,
                        currencySymbol: '₹',
                        cssVar: '--glow-purple',
                        invertGrowthColor: true,
                        secondaryMetrics: [
                            { icon: 'bi-currency-rupee', dataKey: 'amr_value_amount', label: 'AMR Value', format: 'currency_compact' },
                            { icon: 'bi-file-earmark-text', dataKey: 'amr_raised_count', label: 'No. of AMR Raised' }
                        ],
                        guide: {
                            title: 'Aging Material Risk (AMR) Value',
                            definition: 'The financial value of raw materials or finished goods that have been in inventory for an extended period (e.g., >90 days), posing a risk of obsolescence.',
                            interpretation: 'Indicates potential losses from dead stock. A lower value is better for working capital.',
                            calculation: 'Sum of (Book Value of Aging Items).'
                        },
                        drilldownConfig: {
                            dataKey: 'amr_value_details',
                            reportName: 'Excess Material Indent Log',
                            columns: [
                                { key: 'pr_no', label: 'PR No' },
                                { key: 'department', label: 'Department' },
                                { key: 'requested_qty', label: 'Requested Qty' },
                                { key: 'required_by_date', label: 'Required By Date', format: 'date' },
                                { key: 'reason_for_shortage', label: 'Reason for Shortage' },
                                { key: 'stock_in_hand', label: 'Stock In Hand' },
                                { key: 'reprint_required', label: 'Reprint Required?' },
                                { key: 'recovery_status', label: 'Recovery Status' },
                                { key: 'status', label: 'Status / Present Status' },
                                { key: 'indent_balance', label: 'Indent Balance' }
                            ]
                        }
                    }
                ];

                const layoutConfig = [
                    {
                        type: 'chart', width: 'col-lg-4', config: {
                            id: 'OEE-by-machine-type', chartType: 'bar', title: 'Machine Group wise OEE (Average)',
                            dataKey: 'efficiency_details',
                            transformer: 'transformForAvgOEEByType',
                            options: {
                                scales: {
                                    y: {
                                        title: { display: true, text: 'Average OEE (%)' },
                                        ticks: { callback: (value) => `${value.toFixed(1)}%` }
                                    },
                                    x: {
                                        grid: { display: false },
                                        ticks: {
                                            autoSkip: false,  // Show all labels
                                            maxRotation: 45,   // Rotate labels diagonally
                                            minRotation: 45,   // Rotate labels diagonally
                                            font: { size: 10 },
                                            // Enable text wrapping by returning an array of strings
                                            callback: function (value) {
                                                const label = this.getLabelForValue(value);
                                                const maxCharsPerLine = 12; // Characters per line before wrapping
                                                const words = label.split(' ');
                                                const lines = [];
                                                let currentLine = '';

                                                words.forEach(word => {
                                                    const testLine = currentLine ? currentLine + ' ' + word : word;
                                                    if (testLine.length > maxCharsPerLine && currentLine) {
                                                        lines.push(currentLine);
                                                        currentLine = word;
                                                    } else {
                                                        currentLine = testLine;
                                                    }
                                                });
                                                if (currentLine) lines.push(currentLine);

                                                return lines; // Chart.js will display each array item on a new line
                                            }
                                        }
                                    }
                                },
                                plugins: { legend: { display: false } }
                            },
                            drilldownConfig: {
                                dataKey: 'machine_oee_details',
                                reportName: 'Machine Utilization & Speed Report',
                                columns: [
                                    { key: 'machine_no', label: 'Machine No' },
                                    { key: 'machine_group', label: 'Machine Group' },
                                    { key: 'press_running_time', label: 'Press Running Time' },
                                    { key: 'hseb_down_time', label: 'HSEB Down Time (Power Loss)' },
                                    { key: 'total_downtime_hours', label: 'Total Downtime Hours' },
                                    { key: 'target_input', label: 'Target Input' },
                                    { key: 'actual_input', label: 'Actual Input' },
                                    { key: 'impressions_per_hr', label: 'Impressions / Hr' },
                                    { key: 'press_std_vs_act_mkr', label: 'Press Std vs Act MKR' }
                                ]
                            }
                        }
                    },
                    {
                        type: 'chart', width: 'col-lg-4', config: {
                            id: 'top-nph-reasons',
                            chartType: 'pie', // MODIFIED
                            title: 'Top Reasons for NPH',
                            dataKey: 'downtime_events',
                            transformer: 'transformForTopN',
                            transformerConfig: {
                                n: 6,
                                categoryKey: 'reason',
                                valueKey: 'duration_hours',
                                datasetLabel: 'Total Hours',
                                // MODIFIED: Provide a color palette for the pie slices
                                backgroundColor: ['#0c98ba', '#06b6d4', '#325a88', '#087dba', '#14b8a6', '#f59e0b']
                            },
                            options: {
                                // REMOVED: indexAxis and scales, as they are not used by pie charts
                                plugins: {
                                    legend: {
                                        display: true,
                                        position: 'right', // Better for pie charts
                                        labels: {
                                            boxWidth: 20,
                                            padding: 20
                                        }
                                    },

                            'Web Offset': 8000, 'Corrugation': 5500, 'Corrugation Flexo Printer': 9000, 'Roto Gravure': 12000, 'Large Format': 7500

                        const aggregation = data.reduce((acc, item) => {

                            }]

                    },
                    transformForWeeklyMovingAverage: (data) => {
                        // 1. Group by Week
                        const weeklyTotals = {};
                        data.forEach(item => {
                            const date = new Date(item.date);
                            // Get ISO Week number
                            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
                            const dayNum = d.getUTCDay() || 7;
                            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
                            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
                            const yearWeek = `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;

                            weeklyTotals[yearWeek] = (weeklyTotals[yearWeek] || 0) + item.quantity;
                        });

                        const sortedWeeks = Object.keys(weeklyTotals).sort();
                        const weeklyValues = sortedWeeks.map(w => weeklyTotals[w]);

                        // 2. Calculate 13-Week Moving Average
                        const maPeriod = 13;
                        const maValues = weeklyValues.map((val, index, arr) => {
                            if (index < maPeriod - 1) return null; // Not enough data
                            const sum = arr.slice(index - maPeriod + 1, index + 1).reduce((a, b) => a + b, 0);
                            return sum / maPeriod;
                        });

                        // Filter out nulls (start period)
                        const labels = sortedWeeks.slice(maPeriod - 1);
                        const dataPoints = maValues.slice(maPeriod - 1);

                        return {
                            labels: labels,
                            datasets: [{
                                label: '13-Week Moving Average',
                                data: dataPoints,
                                borderColor: '#9C27B0', // Purple color
                                backgroundColor: 'rgba(156, 39, 176, 0.1)',

                    transformForRadar: (data) => {
                        const labels = ['Efficiency (Cycle Time)', 'Quality Score', 'Business Value'];
                        const colors = ['rgba(255, 99, 132, 0.4)', 'rgba(54, 162, 235, 0.4)', 'rgba(255, 206, 86, 0.4)', 'rgba(75, 192, 192, 0.4)', 'rgba(153, 102, 255, 0.4)', 'rgba(255, 159, 64, 0.4)'];

                        const metrics = {
                            cycleTime: data.map(v => v.avgCycleTime),
                            quality: data.map(v => v.avgQualityScore),
                            value: data.map(v => v.totalValue)
                        };

                        const minMax = {
                            cycleTime: { min: Math.min(...metrics.cycleTime), max: Math.max(...metrics.cycleTime) },
                            quality: { min: Math.min(...metrics.quality), max: Math.max(...metrics.quality) },
                            value: { min: Math.min(...metrics.value), max: Math.max(...metrics.value) }
                        };

                        const normalize = (val, min, max, invert = false) => {
                            if (max - min === 0) return 50; // Avoid division by zero
                            const normalized = ((val - min) / (max - min)) * 100;
                            return invert ? 100 - normalized : normalized;
                        };

                        const datasets = data.map((vendor, index) => ({
                            label: vendor.name,
                            data: [
                                normalize(vendor.avgCycleTime, minMax.cycleTime.min, minMax.cycleTime.max, true), // Lower is better
                                normalize(vendor.avgQualityScore, minMax.quality.min, minMax.quality.max),
                                normalize(vendor.totalValue, minMax.value.min, minMax.value.max)
                            ],
                            borderColor: colors[index % colors.length].replace('0.4', '1'),
                            backgroundColor: colors[index % colors.length],
                            pointBackgroundColor: colors[index % colors.length].replace('0.4', '1'),
                        }));

                        return { labels, datasets };
                    },

                    transformForTopN: (data, periodIndex, config) => {
                        const {
                            n = 5,
                            categoryKey,
                            valueKey,
                            datasetLabel = 'Value',
                            backgroundColor = '#26658C' // Added default color
                        } = config.transformerConfig;

                        if (!categoryKey || !valueKey) {
                            throw new Error(`'transformerConfig' for TopN must include 'categoryKey' and 'valueKey'.`);
                        }

                        const filteredData = periodIndex !== null ? data.filter(d => d.date.getMonth() === periodIndex) : data;

                        const totals = filteredData.reduce((acc, d) => {
                            const category = d[categoryKey];
                            const value = d[valueKey];
                            if (category !== undefined && typeof value === 'number') {
                                if (!acc[category]) {
                                    acc[category] = { total: 0, count: 0 };
                                }
                                acc[category].total += value;
                                acc[category].count += 1;
                            }
                            return acc;
                        }, {});

                        const topN = Object.entries(totals)
                            .sort(([, a], [, b]) => b.total - a.total)
                            .slice(0, n);

                        const labels = topN.map(([key]) => key);
                        const values = topN.map(([, val]) => val.total);
                        const counts = topN.map(([, val]) => val.count); // Extract counts

                        return {
                            labels,
                            datasets: [{
                                label: datasetLabel,
                                data: values,
                                backgroundColor: backgroundColor,

                            }]
                        };
                    },
                    // NEW TRANSFORMERS FOR MANUFACTURING DASHBOARD
                    transformForGantt: (data) => {
                        const machines = [...new Set(data.map(d => d.machine))].sort();
                        const jobTypes = [...new Set(data.map(d => d.job_type))];
                        const colors = ['#004c4c', '#008080', '#66b2b2', '#b2d8d8', '#006666'];

                        const machineTimeTracker = machines.reduce((acc, machine) => ({ ...acc, [machine]: 0 }), {});

                        const datasets = jobTypes.map((jobType, index) => ({
                            label: jobType,
                            data: machines.map(machine => {
                                const job = data.find(d => d.machine === machine && d.job_type === jobType);
                                if (!job) return null;

                                const startTime = machineTimeTracker[machine];
                                const endTime = startTime + job.duration_hours;
                                machineTimeTracker[machine] = endTime; // Next job starts after this one
                                return [startTime, endTime];
                            }),
                            backgroundColor: colors[index % colors.length],
                            barPercentage: 0.6
                        }));

                        const totalCapacity = 160; // Example capacity in hours
                        datasets.push({
                            label: 'Unutilized',
                            data: machines.map(machine => {
                                const utilizedTime = machineTimeTracker[machine];
                                return utilizedTime < totalCapacity ? [utilizedTime, totalCapacity] : null;
                            }),
                            backgroundColor: 'rgba(229, 231, 235, 0.7)'
                        });

                        return { labels: machines, datasets };
                    },
                    transformForWastageBreakdown: (data) => {
                        const aggregated = data.reduce((acc, d) => {
                            acc[d.reason] = (acc[d.reason] || 0) + d.wasted_units;
                            return acc;
                        }, {});
                        const labels = Object.keys(aggregated);
                        const values = Object.values(aggregated);
                        const colors = ['#6c757d', '#198754', '#339999', '#0dcaf0', '#4d7cba']; // Example colors
                        return {
                            labels,
                            datasets: [{
                                data: values,
                                backgroundColor: colors.slice(0, labels.length)
                            }]
                        };
                    }
                };

                                caption: col.label
                            };
                            // Translate custom formatting to DevExtreme format objects
                            switch (col.format) {
                                case 'currency':
                                    dxCol.dataType = 'number';
                                    dxCol.format = { type: 'currency', currency: 'USD', precision: 0 };
                                    break;
                                case 'date':
                                    dxCol.dataType = 'datetime';
                                    dxCol.format = 'dd/MM/yyyy HH:mm';
                                    break;
                                case 'percentage':
                                    dxCol.dataType = 'number';
                                    dxCol.format = { type: 'percent', precision: 2 };
                                    break;
                            }
                            return dxCol;
                        });

                        // Instantiate the DevExtreme DataGrid
                        $(gridContainer).dxDataGrid({
                            dataSource: dataRows,
                            columns: dxColumns,
                            showBorders: true,
                            rowAlternationEnabled: true,
                            hoverStateEnabled: true,
                            columnAutoWidth: true,
                            wordWrapEnabled: true,
                            searchPanel: { visible: true, width: 240, placeholder: "Search..." },
                            filterRow: { visible: true },
                            headerFilter: { visible: true },
                            groupPanel: { visible: true },
                            scrolling: { mode: "virtual" },
                            paging: { pageSize: 100 },
                            pager: { visible: true, showInfo: true },
                            loadPanel: { enabled: true },
                            columnFixing: { enabled: true }
                        });

                        modals.drilldownModal.show();
                    },
                    showPlaceholder(title, message) {
                        document.getElementById('drilldownModalLabel').textContent = `Details for ${title}`;
                        document.getElementById('drilldownModalBody').innerHTML = `<div class="p-3 text-center">${message}</div>`;
                        modals.drilldownModal.show();
                    }
                };

                // --- ADDED: New orchestrator function for all drilldown actions ---
                function initiateDrilldown(componentId, context = {}) {
                    const config = Utils.getComponentConfig(componentId);

                    if (config.drilldownTarget && !context.dataIndex) {
                        return initiateDrilldown(config.drilldownTarget);
                    }

                    const drilldownConfig = config?.drilldownConfig;
                    if (!drilldownConfig) {
                        return DrilldownService.showPlaceholder(config.label || config.title, `No drilldown configured.`);
                    }

                    const { dataKey, columns, filters, docFormConfig, filterMapping } = drilldownConfig;
                    let title = `Detailed View: ${config.label || config.title} `;
                    const rawData = StateManager.getState(dataKey);

                    if (!rawData) {
                        return DrilldownService.showPlaceholder(title, `No detailed data available.`);
                    }

                    let filteredData = [...rawData];

                    if (context.dataIndex !== undefined) {
                        const chart = chartInstances[componentId];
                        if (chart && chart.data.labels[context.dataIndex] !== undefined) {
                            const label = chart.data.labels[context.dataIndex];
                            title += ` (${label})`; // Add context to the title

                            if (filterMapping === 'date_month_short') {
                                filteredData = rawData.filter(item => item.date.toLocaleString('default', { month: 'short' }) === label);
                            } else if (filterMapping) {
                                filteredData = rawData.filter(item => item[filterMapping] === label);
                            }
                        }
                    }

                    DrilldownService.show(title, columns, filteredData, filters, docFormConfig);
                }

                const DocFormHandler = {
                    show(docId, config) {
                        const rawData = StateManager.getState(config.dataKey);
                        const data = rawData.find(item => item.id === docId);
                        if (!data) { alert(`Details for ${docId} not found.`); return; }
                        const bodyHtml = `<div class="row">${config.fields.map(field => `<div class="col-md-6 form-readonly-group"><label>${field.label}</label><input type="text" class="form-control" value="${Utils.formatMetric(data[field.key], field.format)}" readonly></div>`).join('')}</div>`;
                        document.getElementById('docFormModalLabel').textContent = `Details for: ${docId} `;
                        document.getElementById('docFormBody').innerHTML = bodyHtml;
                        modals.drilldownModal.classList.add('is-blurred');
                        modals.docFormModal.show();
                    }
                };


                const ExpandChartHandler = {
                    show(componentId) {
                        const originalChart = chartInstances[componentId];
                        const config = Utils.getComponentConfig(componentId);
                        if (!originalChart || !config) { alert('Cannot expand: chart instance not found.'); return; }

                        const ctx = document.getElementById('expandedChartCanvas').getContext('2d');
                        const chartData = JSON.parse(JSON.stringify(originalChart.data));

                        const originalOptions = originalChart.config.options;
                        const expansionOverrides = {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: true },
                                tooltip: {
                                    enabled: true,
                                    external: null
                                }
                            }
                        };

                        const finalOptions = Utils.deepMerge(JSON.parse(JSON.stringify(originalOptions)), expansionOverrides);

                        const isKpiCard = dashboardConfig.kpis.some(k => k.id === componentId);
                        if (isKpiCard) {
                            const kpiData = StateManager.getState('kpiData')[config.dataKey];
                            if (kpiData && kpiData.trend_labels) {
                                chartData.labels = kpiData.trend_labels;
                            }
                            chartData.datasets[0].label = config.label;

                            // START: MODIFICATION
                            // Dynamically set colors based on the source KPI's configured CSS variable
                            if (config.cssVar) {
                                const trendColor = getComputedStyle(document.documentElement).getPropertyValue(config.cssVar).trim();
                                const trendColorRGB = Utils.hexToRgb(trendColor);

                                if (trendColor && trendColorRGB) {
                                    chartData.datasets[0].borderColor = trendColor;
                                    chartData.datasets[0].backgroundColor = `rgba(${trendColorRGB}, 0.2)`;
                                    chartData.datasets[0].fill = true;
                                    chartData.datasets[0].tension = 0.3;
                                }
                            }
                            // END: MODIFICATION
                        }

                        document.getElementById('expandChartModalLabel').textContent = `Expanded View: ${config.label || config.title} `;

                        if (chartInstances['expandedChart']) chartInstances['expandedChart'].destroy();
                        chartInstances['expandedChart'] = new Chart(ctx, { type: originalChart.config.type, data: chartData, options: finalOptions });
                        modals.expandChartModal.show();
                    }
                };

                const GuideHandler = { show(kpiConfig) { if (!kpiConfig?.guide) { alert('No guide available for this KPI.'); return; } const { title, definition, interpretation, calculation } = kpiConfig.guide; document.getElementById('kpiGuideModalLabel').textContent = `Guide: ${title} `; document.getElementById('guide-definition').textContent = definition; document.getElementById('guide-interpretation').textContent = interpretation; document.getElementById('guide-calculation').textContent = calculation; modals.kpiGuideModal.show(); } };

                const InteractivityHandler = {
                    init() {
                        const mainContent = document.getElementById('main-dashboard-content');
                        const modalIds = ['drilldownModal', 'expandChartModal', 'kpiGuideModal', 'docFormModal'];

                        modalIds.forEach(id => {
                            const modalEl = document.getElementById(id);
                            if (modalEl) {
                                // Add blur when any modal opens
                                modalEl.addEventListener('show.bs.modal', () => {
                                    mainContent.classList.add('dashboard-blur');
                                });

                                // Remove blur only if NO other modals are currently open (handles stacked modals)
                                modalEl.addEventListener('hidden.bs.modal', () => {
                                    const isAnyModalOpen = modalIds.some(mid => {
                                        const m = document.getElementById(mid);
                                        // Bootstrap adds the 'show' class to visible modals
                                        return m && m.classList.contains('show');
                                    });

                                    if (!isAnyModalOpen) {
                                        mainContent.classList.remove('dashboard-blur');
                                    }
                                });
                            }
                        });
                        const menu = document.getElementById('customContextMenu');
                        const tooltipEl = document.getElementById('custom-tooltip');
                        const drilldownModalEl = document.getElementById('drilldownModal');
                        const hideMenu = () => menu.style.display = 'none';
                        const hideTooltip = () => { if (tooltipEl) { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; } };
                        document.addEventListener('click', hideMenu);
                        document.addEventListener('keydown', e => e.key === 'Escape' && hideMenu());
                        document.body.addEventListener('contextmenu', e => { const target = e.target.closest('.context-menu-target'); if (target) { e.preventDefault(); this.showContextMenu(e, target.dataset.componentId); } });
                        document.body.addEventListener('click', e => {
                            const target = e.target.closest('.kpi-card');
                            if (target) initiateDrilldown(target.dataset.componentId);
                        });
                        tooltipEl.addEventListener('mouseenter', () => clearTimeout(tooltipHideTimer));
                        tooltipEl.addEventListener('mouseleave', () => { tooltipHideTimer = setTimeout(hideTooltip, 300); });
                        document.getElementById('drilldownFilterControls').addEventListener('change', e => { if (e.target.name === 'drilldownFilter') { const filterValue = e.target.value; document.getElementById('drilldownTbody').querySelectorAll('tr').forEach(row => { row.style.display = (filterValue === 'all' || row.dataset.status === filterValue) ? '' : 'none'; }); } });

                        // --- FIX: Add delegated event listener for drilldown table rows ---
                        drilldownModalEl.addEventListener('click', e => {
                            const row = e.target.closest('tr[data-doc-id]');
                            const configStr = drilldownModalEl.querySelector('.modal-body').dataset.docFormConfig;
                            if (row && configStr) {
                                const config = JSON.parse(configStr);
                                DocFormHandler.show(row.dataset.docId, config);
                            }
                        });

                        drilldownModalEl.addEventListener('hidden.bs.modal', () => {
                            const modalBody = drilldownModalEl.querySelector('.modal-body');
                            if (modalBody.dataset.docFormConfig) {
                                delete modalBody.dataset.docFormConfig;
                            }
                        });

                        document.getElementById('docFormModal').addEventListener('hidden.bs.modal', () => modals.drilldownModal.classList.remove('is-blurred'));
                        document.getElementById('expandChartModal').addEventListener('hidden.bs.modal', () => {
                            if (chartInstances['expandedChart']) {
                                chartInstances['expandedChart'].destroy();
                                chartInstances['expandedChart'] = null;
                            }
                        });
                    },
                    showContextMenu(event, componentId) {
                        const config = Utils.getComponentConfig(componentId);
                        const menu = document.getElementById('customContextMenu');
                        const menuList = document.getElementById('contextMenuList');
                        const componentActions = config?.actions || dashboardConfig.contextMenu.actions.map(a => a.id);
                        let actions = dashboardConfig.contextMenu.actions.filter(a => componentActions.includes(a.id) || a.type === 'separator');
                        const renderItems = items => items.map(a => a.type === 'separator' ? '<li class="context-menu-separator"></li>' : `<li class="context-menu-item" data-action="${a.id}"><i class="bi ${a.icon}"></i><span>${a.label}</span>${a.submenu ? `<i class="bi bi-chevron-right"></i><ul class="context-menu-sublist">${renderItems(a.submenu)}</ul>` : ''}</li>`).join('');
                        menuList.innerHTML = renderItems(actions);
                        menu.querySelectorAll('.context-menu-item').forEach(item => { if (!item.querySelector('.context-menu-sublist')) item.addEventListener('click', () => this.handleContextMenuAction(item.dataset.action, componentId)); });
                        menu.style.visibility = 'hidden';
                        menu.style.display = 'block';

                        const { offsetWidth: menuW, offsetHeight: menuH } = menu;
                        const { clientX: mouseX, clientY: mouseY } = event;
                        const { innerWidth: viewportW, innerHeight: viewportH } = window;
                        const padding = 5; // A small buffer from the viewport edge
                        let finalLeft = mouseX;
                        if ((mouseX + menuW + padding) > viewportW) {
                            finalLeft = mouseX - menuW; // Flip to the left of the cursor
                        }
                        let finalTop = mouseY;
                        if ((mouseY + menuH + padding) > viewportH) {
                            finalTop = mouseY - menuH; // Flip above the cursor
                        }
                        menu.style.left = `${finalLeft + window.scrollX}px`;
                        menu.style.top = `${finalTop + window.scrollY}px`;
                        menu.style.visibility = 'visible';
                    },
                    handleContextMenuAction(action, componentId) {
                        const config = Utils.getComponentConfig(componentId);
                        switch (action) {
                            case 'drilldown': initiateDrilldown(componentId); break;
                            case 'refresh': initialDataFetch(); break;
                            case 'expand': ExpandChartHandler.show(componentId); break;
                            case 'guide': if (config.guide) GuideHandler.show(config); break;
                            case 'share': window.location.href = `mailto:? subject = Dashboard Insight: ${config.label || config.title}& body=Review data for ${config.label || config.title}.`; break;
                            case 'export-png': const chart = chartInstances[componentId]; if (chart) { const a = document.createElement('a'); a.href = chart.toBase64Image(); a.download = `${componentId}.png`; a.click(); } break;
                            default: alert(`Action '${action}' is not yet implemented.`);
                        }
                    },

                    customTooltip(context) {
                        const { chart, tooltip } = context;
                        const tooltipEl = document.getElementById('custom-tooltip');

                        // Clear any pending hide timer
                        clearTimeout(tooltipHideTimer);

                        // If Chart.js says hide the tooltip (opacity === 0), hide it after a delay
                        if (tooltip.opacity === 0) {
                            tooltipHideTimer = setTimeout(() => {
                                tooltipEl.style.opacity = 0;
                                tooltipEl.style.pointerEvents = 'none';
                            }, 300);
                            return; // Exit early - don't update tooltip content
                        }

                        // If we get here, Chart.js wants to show the tooltip (opacity > 0)
                        // Update tooltip content and make it visible
                        const titleEl = tooltipEl.querySelector('.tooltip-main-title');
                        const headerEl = tooltipEl.querySelector('.tooltip-header');
                        const valueEl = tooltipEl.querySelector('.tooltip-value');
                        const seriesTitleEl = tooltipEl.querySelector('.tooltip-title');
                        const deltaEl = tooltipEl.querySelector('.tooltip-delta');
                        const footerEl = tooltipEl.querySelector('.tooltip-footer');

                        // Reset common elements
                        headerEl.style.display = 'flex';
                        deltaEl.style.display = 'none';
                        footerEl.style.display = 'none';

                        // --- FIX: Changed chart.config.id to chart.canvas.id ---
                        if (chart.canvas.id.startsWith('pareto')) {
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            headerEl.style.display = 'none';
                            valueEl.textContent = '';
                            const footerContent = tooltip.dataPoints.map(dp => {
                                const isPercentage = dp.dataset.label.includes('%');
                                const value = isPercentage ? `${dp.raw.toFixed(1)}% ` : Utils.formatMetric(dp.raw);
                                return `<div class="footer-row"><span>${dp.dataset.label}</span><span>${value}</span></div>`;
                            }).join('');
                            footerEl.innerHTML = footerContent;
                            footerEl.style.display = 'flex';
                        } else { // Default handler for bar, line, doughnut, radar etc.
                            const dp = tooltip.dataPoints[0];
                            if (!dp) return;
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            seriesTitleEl.textContent = dp.dataset.label || '';
                            valueEl.textContent = Utils.formatMetric(dp.raw);
                            const prev = dp.dataIndex > 0 ? chart.data.datasets[dp.datasetIndex].data[dp.dataIndex - 1] : null;
                            if (prev !== null && prev !== 0 && typeof dp.raw === 'number') { const change = ((dp.raw - prev) / prev) * 100, isPos = change >= 0; deltaEl.className = `tooltip-delta ${isPos ? 'positive' : 'negative'}`; deltaEl.innerHTML = `<i class="bi ${isPos ? 'bi-arrow-up' : 'bi-arrow-down'}"></i> ${Math.abs(change).toFixed(1)}%`; deltaEl.style.display = 'flex'; }
                            const footerContent = chart.data.datasets.map((ds, i) => i !== dp.datasetIndex && ds.data[dp.dataIndex] !== undefined ? `<div class="footer-row"><span>${ds.label}</span><span>${Utils.formatMetric(ds.data[dp.dataIndex])}</span></div>` : null).filter(Boolean);
                            if (footerContent.length > 0) { footerEl.innerHTML = footerContent.join(''); footerEl.style.display = 'flex'; }
                        }

                        tooltipEl.querySelector('.drilldown-btn').onclick = () => initiateDrilldown(chart.canvas.id, { dataIndex: tooltip.dataPoints[0].dataIndex });
                        const canvasRect = chart.canvas.getBoundingClientRect();

                        // Show tooltip immediately (don't wait for transition)
                        tooltipEl.style.opacity = 1;
                        tooltipEl.style.pointerEvents = 'all';
                        tooltipEl.style.left = (canvasRect.left + window.scrollX + tooltip.caretX) + 'px';
                        tooltipEl.style.top = (canvasRect.top + window.scrollY + tooltip.caretY) + 'px';
                    }
                };

                const Utils = {
                    formatMetric(value, format, suffix = '') {
                        if (value === null || value === undefined) return 'N/A';

                        if (format === 'currency_compact') {
                            if (Math.abs(value) >= 10000000) { // Crore
                                return (value / 10000000).toFixed(2) + ' Cr';
                            }
                            if (Math.abs(value) >= 100000) { // Lakh
                                return (value / 100000).toFixed(2) + ' L';
                            }
                            if (Math.abs(value) >= 1000) { // Thousand
                                return (value / 1000).toFixed(1) + ' K';
                            }
                            return value.toLocaleString('en-US');
                        }

                        if (format === 'currency') return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(value);
                        if (format === 'date') return new Date(value).toLocaleString('en-GB');
                        if (typeof value === 'number') return value.toLocaleString('en-US');
                        return `${value}${suffix} `;
                    }, hexToRgb(hex) {
                        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
                        return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)} ` : null;
                    },
                    getComponentConfig: (id) => dashboardConfig.kpis.find(c => c.id === id) || dashboardConfig.layout.find(c => c.config.id === id)?.config,

                    // --- ADDED: Shared deepMerge utility ---
                    deepMerge(target, source) {
                        const isObject = (obj) => obj && typeof obj === 'object' && !Array.isArray(obj);
                        let output = { ...target };
                        if (isObject(target) && isObject(source)) {
                            Object.keys(source).forEach(key => {
                                if (isObject(source[key])) {
                                    if (key in target) {
                                        output[key] = this.deepMerge(target[key], source[key]);
                                    } else {
                                        Object.assign(output, { [key]: source[key] });
                                    }
                                } else {
                                    Object.assign(output, { [key]: source[key] });
                                }
                            });
                        }
                        return output;
                    }
                };

                const ConfigValidator = {
                    validate(config) {
                        if (!config.title) throw new Error("`title` is missing.");
                        if (!Array.isArray(config.kpis)) throw new Error("`kpis` must be an array.");
                        if (!Array.isArray(config.layout)) throw new Error("`layout` must be an array.");
                        config.kpis.forEach((kpi, i) => {
                            if (!kpi.id || !kpi.dataKey || !kpi.label) throw new Error(`KPI at index ${i} is missing required keys(id, dataKey, label).`);
                        });
                        config.layout.forEach((item, i) => {
                            if (!item.type || !item.width || !item.config) throw new Error(`Layout item at index ${i} is missing required keys(type, width, config).`);
                            const chartConfig = item.config;
                            if (chartConfig.drilldownConfig && !Array.isArray(chartConfig.drilldownConfig.columns)) {
                                throw new Error(`Drilldown config for chart '${chartConfig.id}' is missing a 'columns' array.`);
                            }
                            if (typeof chartConfig.transformer !== 'function' && !SharedTransformers[chartConfig.transformer]) {
                                throw new Error(`Transformer for chart '${chartConfig.id}' must be a function or a key in SharedTransformers.`);
                            }
                        });
                    }
                };

                return { init };
            })();

            // Initialize the application
            APP_CORE.init();
        })();
    </script>
</body>

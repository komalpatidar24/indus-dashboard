    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const dashboardApp = (function () {
            const Utils = {
                formatMetric(value, format, suffix = '') {
                    if (value === null || value === undefined) return 'N/A';
                    const currencyCode = 'INR';

                    if (format === 'currency_compact') {
                        if (Math.abs(value) >= 10000000) { // Crore
                            return `₹${(value / 10000000).toFixed(2)} Cr`;
                        }
                        if (Math.abs(value) >= 100000) { // Lakh
                            return `₹${(value / 100000).toFixed(2)} L`;
                        }
                        if (Math.abs(value) >= 1000) { // Thousand
                            return `₹${(value / 1000).toFixed(1)} K`;
                        }
                        return new Intl.NumberFormat('en-IN', { style: 'currency', currency: currencyCode, minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(value);
                    }

                    if (format === 'currency') return new Intl.NumberFormat('en-IN', { style: 'currency', currency: currencyCode, minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(value);
                    if (format === 'date') return new Date(value).toLocaleString('en-GB');
                    if (typeof value === 'number') return value.toLocaleString('en-IN');
                    return `${value}${suffix}`;
                },
                hexToRgb(hex) {
                    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
                    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
                },
                deepMerge(target, source) {
                    const isObject = (obj) => obj && typeof obj === 'object' && !Array.isArray(obj);
                    let output = { ...target };
                    if (isObject(target) && isObject(source)) {
                        Object.keys(source).forEach(key => {
                            if (isObject(source[key])) {
                                if (key in target) {
                                    output[key] = this.deepMerge(target[key], source[key]);
                                } else {
                                    Object.assign(output, { [key]: source[key] });
                                }
                            } else {
                                Object.assign(output, { [key]: source[key] });
                            }
                        });
                    }
                    return output;
                }
            };
            // ========================================================================================================
            // SECTION 1: CONFIGURATION (THE ONLY PART TO EDIT FOR A NEW DASHBOARD)
            // This section simulates `config.js`.
            // ========================================================================================================
            const CONFIGURATION = (() => {
                /**
                 * HOW TO USE THIS TEMPLATE:
                 * 1.  Update `dashboardTitle` with the title for your dashboard.
                 * 2.  Define your Key Performance Indicators (KPIs) in the `kpiConfig` array.
                 * 3.  Define your chart layout and configurations in the `layoutConfig` array.
                 * 4.  Update the `DATA_PROVIDER` section to connect to your live backend API.
                 * 5.  Ensure your data provider returns data objects with keys that match the `dataKey` properties defined here.
                 */
                const dashboardTitle = 'CRM & Sales Dashboard';

                const kpiConfig = [
                    {
                        id: 'kpi-new-prospects', dataKey: 'new_prospects', label: 'Active Prospects', cssVar: '--glow-blue',
                        secondaryMetrics: [
                            { icon: 'bi-fire', dataKey: 'hot_prospects', label: 'Hot' },
                            { icon: 'bi-thermometer-half', dataKey: 'warm_prospects', label: 'Warm' }
                        ],
                        guide: { title: 'Total prospects', definition: 'Total number of new potential customers acquired during the period.', interpretation: 'Measures the effectiveness of marketing and prospect generation activities.', calculation: 'Count of all new records created in the prospects module.' },
                        drilldownConfig: {
                            renderAs: 'grid',
                            dataKey: 'prospects_data',
                            columns: [
                                { dataField: 'ClientCode', caption: 'Code' },
                                { dataField: 'ClientName', caption: 'Client/Prospect Name' },
                                { dataField: 'CreatedDate', caption: 'Registration Date', dataType: 'date', format: 'dd-MMM-yyyy' },
                                { dataField: 'Region', caption: 'Region' },
                                { dataField: 'SalesExecutive', caption: 'Sales Executive' },
                                { dataField: 'AnnualTurnover', caption: 'Annual Turnover', dataType: 'number', customizeText: (cellInfo) => Utils.formatMetric(cellInfo.value, 'currency_compact') },
                                { dataField: 'ProspectShare', caption: 'Prospect Share %', customizeText: (cellInfo) => cellInfo.value + '%' },
                                { dataField: 'Status', caption: 'Status' },
                                { dataField: 'City', caption: 'City' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-prospect-to-client', dataKey: 'prospect_to_client_rate', label: 'Prospect-to-Client Rate', valueSuffix: '%', cssVar: '--glow-orange',
                        secondaryMetrics: [{ icon: 'bi-person-check', dataKey: 'total_prospects', label: 'Prospect' }, { icon: 'bi-person-plus', dataKey: 'client_old', label: 'Client Old' }, { icon: 'bi-person-arms-up', dataKey: 'client_new', label: 'Client New' }],
                        guide: { title: 'Prospect-to-Client Conversion Rate', definition: 'The percentage of qualified prospects that become paying customers.', interpretation: 'Measures the overall effectiveness of the sales and marketing funnel in acquiring new clients.', calculation: '(New Clients / Total Qualified prospects) * 100.' },
                        drilldownConfig: {
                            renderAs: 'grid',
                            dataKey: 'clients_data',
                            columns: [
                                { dataField: 'ClientCode', caption: 'Code' },
                                { dataField: 'ClientName', caption: 'Client Name' },
                                { dataField: 'CreatedDate', caption: 'Registration Date', dataType: 'date', format: 'dd-MMM-yyyy' },
                                { dataField: 'Region', caption: 'Region' },
                                { dataField: 'SalesExecutive', caption: 'Sales Executive' },
                                { dataField: 'AnnualTurnover', caption: 'Annual Turnover', dataType: 'number', customizeText: (cellInfo) => Utils.formatMetric(cellInfo.value, 'currency_compact') },
                                { dataField: 'Status', caption: 'Status' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-open-proposals', dataKey: 'open_proposal_value', label: 'Open Proposals', format: 'currency_compact', cssVar: '--glow-lightblue',
                        secondaryMetrics: [{ icon: 'bi-people', dataKey: 'lead_count', label: 'Lead Count' }, { icon: 'bi-file-earmark-text', dataKey: 'avg_proposal_value', label: 'Avg. Proposal', format: 'currency_compact' }],
                        guide: { title: 'Value of Open Proposals', definition: 'The total monetary value of all proposals currently in "Submitted" or "Negotiating" status.', interpretation: 'Represents the active, undecided new business in the sales pipeline.', calculation: 'Sum of "value" for all proposals not yet "Won" or "Lost".' },
                        drilldownConfig: {
                            renderAs: 'grid',
                            dataKey: 'proposals_data',
                            columns: [
                                { dataField: 'SENo', caption: 'Enquiry No.' },
                                { dataField: 'SEDate', caption: 'Enquiry Date', dataType: 'date', format: 'dd-MMM-yyyy' },
                                { dataField: 'ClientName', caption: 'Client Name' },
                                { dataField: 'JobName', caption: 'Job Description' },
                                { dataField: 'ProductCategory', caption: 'Category' },
                                { dataField: 'ScheduledDOD', caption: 'Scheduled DOD', dataType: 'date', format: 'dd-MMM-yyyy' },
                                { dataField: 'SalesCategory', caption: 'Sales Type' },
                                { dataField: 'ExpectedValue', caption: 'Est. Value', dataType: 'number', customizeText: (cellInfo) => Utils.formatMetric(cellInfo.value, 'currency_compact') },
                                { dataField: 'PostStatus', caption: 'Status' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-conversion-ratio', dataKey: 'conversion_ratio', label: 'Order Conversion Ratio', valueSuffix: '%', cssVar: '--glow-purple',
                        secondaryMetrics: [{ icon: 'bi-file-earmark-check', dataKey: 'converted_count', label: 'Converted' }, { icon: 'bi-cash-stack', dataKey: 'converted_value', label: 'Value', format: 'currency_compact' }],
                        guide: {
                            title: 'Proposal Conversion Ratio',
                            definition: 'The percentage of submitted proposals that are successfully converted into business ("Won").',
                            interpretation: 'Measures the effectiveness of the sales team in closing deals after the proposal stage.',
                            calculation: '(Total Won Proposals / Total Submitted Proposals) * 100.'
                        },
                        drilldownConfig: {
                            renderAs: 'grid',
                            dataKey: 'so_booking_data', // This must match the key in MockDataProvider
                            columns: [
                                { dataField: 'SalesOrderNo', caption: 'SO Number' },
                                { dataField: 'OrderDate', caption: 'Order Date', dataType: 'date', format: 'dd-MMM-yyyy' },
                                { dataField: 'ClientName', caption: 'Customer' },
                                { dataField: 'JobName', caption: 'Job Name' },
                                { dataField: 'OrderQty', caption: 'Order Qty', dataType: 'number', format: '#,##0' },
                                { dataField: 'Rate', caption: 'Unit Rate', dataType: 'number', customizeText: (cellInfo) => Utils.formatMetric(cellInfo.value, 'currency') },
                                { dataField: 'NetAmount', caption: 'Total Value (Net)', dataType: 'number', customizeText: (cellInfo) => Utils.formatMetric(cellInfo.value, 'currency_compact') },
                                { dataField: 'ExpectedDelDate', caption: 'Expected Delivery', dataType: 'date', format: 'dd-MMM-yyyy' },
                                { dataField: 'SalesRep', caption: 'Sales Rep' },
                                { dataField: 'IsBooked', caption: 'Booking Status' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-total-sales', dataKey: 'total_sales_value', label: 'Total Sales Value', format: 'currency_compact', cssVar: '--glow-green',
                        secondaryMetrics: [{ icon: 'bi-receipt', dataKey: 'order_count', label: 'Fresh Orders' }, { icon: 'bi-cash-coin', dataKey: 'billing_value', label: 'Billing Value', format: 'currency_compact' }],
                        guide: {
                            title: 'Total Sales Value',
                            definition: 'The total monetary value of all completed sales orders within the period.',
                            interpretation: 'Represents the total revenue generated from sales activities. It is a primary indicator of business performance.',
                            calculation: 'Sum of "value" for all records in the Sales Orders module.'
                        },
                        drilldownConfig: {
                            renderAs: 'grid',
                            dataKey: 'sales_orders',
                            columns: [
                                { dataField: 'BillNo', caption: 'Invoice No' },
                                { dataField: 'BillDate', caption: 'Invoice Date', dataType: 'date', format: 'dd-MMM-yyyy' },
                                { dataField: 'WTNo', caption: 'Work Ticket' },
                                { dataField: 'CustomerName', caption: 'Customer' },
                                { dataField: 'BilledQty', caption: 'Billed Qty', dataType: 'number', format: '#,##0' },
                                { dataField: 'SaleAmtExclFr', caption: 'Basic Amount', dataType: 'number', customizeText: (cellInfo) => Utils.formatMetric(cellInfo.value, 'currency_compact') },
                                { dataField: 'Freight', caption: 'Freight', dataType: 'number', customizeText: (cellInfo) => Utils.formatMetric(cellInfo.value, 'currency') },
                                { dataField: 'TotalAmtINR', caption: 'Total (INR)', dataType: 'number', customizeText: (cellInfo) => Utils.formatMetric(cellInfo.value, 'currency_compact') },
                                { dataField: 'ThroughputHr', caption: 'Throughput/Hr', dataType: 'number', customizeText: (cellInfo) => Utils.formatMetric(cellInfo.value, 'currency') },
                                { dataField: 'MachineNo', caption: 'Machine Used' }
                            ]
                        }
                    }
                ];

                const layoutConfig = [
                    {
                        type: 'chart', width: 'col-lg-4', config: {
                            id: 'funnel-chart', chartType: 'bar', title: 'Weekly Sales Funnel',
                            dataKey: 'sales_funnel_weekly_data',
                            transformer: (data, view = 'value') => {
                                const dataKey = view === 'value' ? 'value' : 'count';
                                const yAxisTitle = view === 'value' ? 'Value (INR)' : 'Count';
                                const yAxisFormatter = view === 'value'
                                    ? (value) => Utils.formatMetric(value, 'currency_compact').replace('₹', '')
                                    : (value) => Number.isInteger(value) ? value.toLocaleString('en-IN') : '';
                                const sortedWeeks = [...new Set(data.map(d => d.week))].sort();
                                const displayLabels = sortedWeeks.map((_, i) => i === sortedWeeks.length - 1 ? 'Current Week' : `Week ${i + 1}`);
                                const stages = ['Enquiry', 'Quotation', 'Order', 'Invoice'];
                                const stageColors = ['#003366', '#03A9F4', '#0C98BA', '#0DAD8D'];
                                return {
                                    type: 'bar',
                                    data: {
                                        labels: displayLabels,
                                        datasets: stages.map((stage, i) => ({
                                            label: stage,
                                            data: sortedWeeks.map(week => {
                                                const item = data.find(d => d.week === week && d.stage === stage);
                                                return item ? item[dataKey] : 0;
                                            }),
                                            backgroundColor: stageColors[i],
                                        }))
                                    },
                                    options: {
                                        plugins: { legend: { display: true, position: 'top' } },
                                        scales: {
                                            y: { stacked: true, title: { display: true, text: yAxisTitle }, ticks: { callback: yAxisFormatter } },
                                            x: { stacked: true, grid: { display: false } }
                                        }
                                    }
                                };
                            },
                            drilldownConfig: {
                                renderAs: 'grid',
                                dataKey: 'funnel_report_data',
                                filterMapping: 'Stage',
                                columns: [
                                    { dataField: 'DocNo', caption: 'Document Number' },
                                    { dataField: 'Date', caption: 'Date', dataType: 'date', format: 'dd-MMM-yyyy' },
                                    { dataField: 'CustomerName', caption: 'Customer Name' },
                                    { dataField: 'JobDescription', caption: 'Job Description' },
                                    { dataField: 'Category', caption: 'Product Category' },
                                    { dataField: 'Executive', caption: 'Sales Executive' },
                                    { dataField: 'Value', caption: 'Document Value', dataType: 'number', customizeText: (e) => Utils.formatMetric(e.value, 'currency_compact') }
                                ]
                            }
                        }
                    },
                    {
                        type: 'chart', width: 'col-lg-4', config: {

            const DATA_PROVIDER = (() => {

                const SharedTransformers = {
                    aggregateByStatus: (data, periodIndex) => { const filteredData = periodIndex !== null ? data.filter(d => d.date.getMonth() === periodIndex) : data; const statusCounts = filteredData.reduce((acc, d) => { acc[d.status] = (acc[d.status] || 0) + 1; return acc; }, {}); return { labels: Object.keys(statusCounts), datasets: [{ data: Object.values(statusCounts), backgroundColor: ['#03A9F4', '#003366', '#4CAF50', '#9E9E9E'] }] }; },

                    transformForPareto: (data) => {
                        const sortedData = [...data].sort((a, b) => b.count - a.count);
                        const labels = sortedData.map(d => d.reason);
                        const counts = sortedData.map(d => d.count);
                        const total = counts.reduce((sum, val) => sum + val, 0);
                        let cumulative = 0;
                        const cumulativePercentage = counts.map(count => {
                            cumulative += count;
                            return total > 0 ? (cumulative / total) * 100 : 0;
                        });
                        return {
                            labels,
                            datasets: [
                                { type: 'bar', label: 'Count', data: counts, backgroundColor: '#003366', yAxisID: 'y' },
                                { type: 'line', label: 'Cumulative %', data: cumulativePercentage, borderColor: '#EF4444', tension: 0.1, yAxisID: 'y1' }
                            ]
                        };
                    },
                    transformForRadar: (data) => {
                        const labels = ['Efficiency (Cycle Time)', 'Quality Score', 'Business Value'];
                        const colors = ['rgba(255, 99, 132, 0.4)', 'rgba(54, 162, 235, 0.4)', 'rgba(255, 206, 86, 0.4)', 'rgba(75, 192, 192, 0.4)', 'rgba(153, 102, 255, 0.4)', 'rgba(255, 159, 64, 0.4)'];

                        const metrics = {
                            cycleTime: data.map(v => v.avgCycleTime),
                            quality: data.map(v => v.avgQualityScore),
                            value: data.map(v => v.totalValue)
                        };

                        const minMax = {
                            cycleTime: { min: Math.min(...metrics.cycleTime), max: Math.max(...metrics.cycleTime) },
                            quality: { min: Math.min(...metrics.quality), max: Math.max(...metrics.quality) },
                            value: { min: Math.min(...metrics.value), max: Math.max(...metrics.value) }
                        };

                        const normalize = (val, min, max, invert = false) => {
                            if (max - min === 0) return 50; // Avoid division by zero
                            const normalized = ((val - min) / (max - min)) * 100;
                            return invert ? 100 - normalized : normalized;
                        };

                        const datasets = data.map((vendor, index) => ({
                            label: vendor.name,
                            data: [
                                normalize(vendor.avgCycleTime, minMax.cycleTime.min, minMax.cycleTime.max, true), // Lower is better
                                normalize(vendor.avgQualityScore, minMax.quality.min, minMax.quality.max),
                                normalize(vendor.totalValue, minMax.value.min, minMax.value.max)
                            ],
                            borderColor: colors[index % colors.length].replace('0.4', '1'),
                            backgroundColor: colors[index % colors.length],
                            pointBackgroundColor: colors[index % colors.length].replace('0.4', '1'),
                        }));

                        return { labels, datasets };
                    },
                    transformForTopN: (data, periodIndex, config) => {
                        // Read parameters from the chart's configuration
                        const { n = 5, categoryKey, valueKey, datasetLabel = 'Value', chartType = 'bar', backgroundColor: customBackgroundColor } = config.transformerConfig;

                        if (!categoryKey || !valueKey) {
                            throw new Error(`'transformerConfig' for TopN must include 'categoryKey' and 'valueKey'.`);
                        }

                        const filteredData = periodIndex !== null ? data.filter(d => d.date.getMonth() === periodIndex) : data;

                        const totals = filteredData.reduce((acc, d) => {
                            const category = d[categoryKey];
                            const value = d[valueKey];
                            if (category !== undefined && typeof value === 'number') {
                                acc[category] = (acc[category] || 0) + value;
                            }
                            return acc;
                        }, {});

                        const topN = Object.entries(totals)
                            .sort(([, a], [, b]) => b - a)
                            .slice(0, n);

                        const labels = topN.map(([key]) => key);

                        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));

                async function refreshDashboardData() {

                    ].filter(Boolean))];

                    const rawDataPromises = rawDataKeys.map(key => DataProvider.fetchRawData(key, filters));

                    const [kpiData] = await Promise.all([kpiDataPromise]);
                    StateManager.setState('kpiData', kpiData);
                    renderKpis();

                    const allRawData = await Promise.all(rawDataPromises);

                        StateManager.setState(rawDataKeys[index], data);
                    });

                    const trendColor = getComputedStyle(document.documentElement).getPropertyValue(colorVarName);
                    const trendColorRGB = Utils.hexToRgb(trendColor);

                    if (!trendColorRGB) {
                        console.error(`Invalid color format or CSS variable not found for: ${colorVarName}`);
                        return;
                    }

                    const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
                    gradient.addColorStop(0, `rgba(${trendColorRGB}, 0.3)`);
                    gradient.addColorStop(1, `rgba(${trendColorRGB}, 0)`);

                    if (chartInstances[id]) chartInstances[id].destroy();

                    chartInstances[id] = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.map(() => ''),
                            datasets: [{
                                data: data,
                                borderColor: trendColor,
                                borderWidth: 2,
                                fill: true,
                                backgroundColor: gradient,
                                tension: 0.4,
                                pointRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: { x: { display: false }, y: { display: false } },
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },
                            layout: {

                                        column: config.summaryValueColumn || "amount",
                                        summaryType: "avg",
                                        valueFormat: { type: 'currency', currency: 'INR', precision: 0 },
                                        displayFormat: "Avg: {0}"
                                    }
                                ],
                                groupItems: [
                                    {
                                        column: config.summaryValueColumn || "amount",
                                        summaryType: "sum",
                                        valueFormat: { type: 'currency', currency: 'INR', precision: 0 },
                                        displayFormat: "Group Total: {0}",
                                        alignByColumn: true
                                    }
                                ]
                            },

                            //  Events for extra control
                            onRowClick: (e) => config.onRowClick && config.onRowClick(e),
                            onCellPrepared: (e) => config.onCellPrepared && config.onCellPrepared(e)
                        });

                    }
                };

                const DrilldownService = {
                    show(title, config, dataRows) {
                        const { columns, filters, docFormConfig, renderAs } = config;
                        const filterControls = document.getElementById('drilldownFilterControls');
                        const modalBody = document.getElementById('drilldownModalBody');

                        document.getElementById('drilldownModalLabel').textContent = title;
                        modalBody.innerHTML = ''; // Clear previous content

                        if (docFormConfig) {
                            modalBody.dataset.docFormConfig = JSON.stringify(docFormConfig);
                        } else {
                            delete modalBody.dataset.docFormConfig;
                        }

                        if (filters) {
                            filterControls.innerHTML = filters.map(opt => `<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="drilldownFilter" id="filter_${opt.value}" value="${opt.value}" ${opt.default ? 'checked' : ''}><label class="form-check-label small" for="filter_${opt.value}">${opt.label}</label></div>`).join('');
                        } else {
                            filterControls.innerHTML = '';
                        }

                        if (renderAs === 'grid') {
                            const gridContainer = document.createElement('div');
                            gridContainer.style.height = '60vh'; // Ensure container has height
                            modalBody.appendChild(gridContainer);

                            $(gridContainer).dxDataGrid({
                                dataSource: dataRows,
                                columns: columns,
                                showBorders: true,
                                rowAlternationEnabled: true,
                                hoverStateEnabled: true,
                                filterRow: { visible: true },
                                headerFilter: { visible: true },
                                searchPanel: { visible: true },
                                groupPanel: { visible: true },
                                paging: { pageSize: 15 },
                                pager: { showPageSizeSelector: true, allowedPageSizes: [15, 30, 50], showInfo: true },
                                columnAutoWidth: true,
                                export: { enabled: true }
                            });
                        } else { // Default to HTML table
                            const headers = columns.map(c => `<th>${c.label}</th>`).join('');
                            const rows = dataRows.map(row => `<tr data-doc-id="${row.id}" data-status="${row.status}">${columns.map(col => `<td>${Utils.formatMetric(row[col.key], col.format)}</td>`).join('')}</tr>`).join('');
                            modalBody.innerHTML = `<div class="table-responsive"><table class="table table-hover"><thead id="drilldownThead"><tr>${headers}</tr></thead><tbody id="drilldownTbody">${rows}</tbody></table></div>`;
                        }

                        modals.drilldownModal.show();
                    },
                    showPlaceholder(title, message) { /* ... (no changes here) */ }
                };

                // Replace the existing initiateDrilldown function with this:
                function initiateDrilldown(componentId, context = {}) {
                    const config = Utils.getComponentConfig(componentId);

                    if (config.drilldownTarget && !context.dataIndex) {
                        return initiateDrilldown(config.drilldownTarget);
                    }

                    const drilldownConfig = config?.drilldownConfig;
                    if (!drilldownConfig) {
                        return DrilldownService.showPlaceholder(config.label || config.title, `No drilldown configured.`);
                    }

                    const { dataKey, filterMapping } = drilldownConfig;
                    let title = `Detailed View: ${config.label || config.title}`;
                    const rawData = StateManager.getState(dataKey);

                    if (!rawData || rawData.length === 0) {
                        return DrilldownService.showPlaceholder(title, `No detailed data available.`);
                    }

                    let filteredData = [...rawData];

                    // Handle Chart Segment Filtering
                    if (context.dataIndex !== undefined) {
                        const chart = chartInstances[componentId];
                        if (chart && chart.data.labels[context.dataIndex] !== undefined) {
                            const label = chart.data.labels[context.dataIndex];
                            title += ` (${label})`;

                            if (filterMapping) {
                                if (filterMapping === 'Week') {
                                    // INTELLIGENT WEEKLY FILTERING
                                    if (label === 'Current Week' || label === 'Current') {
                                        // Get the unique weeks and pick the last one (most recent)
                                        const uniqueWeeks = [...new Set(rawData.map(item => item.Week))].sort();
                                        const latestWeek = uniqueWeeks[uniqueWeeks.length - 1];
                                        filteredData = rawData.filter(item => item.Week === latestWeek);
                                    } else {
                                        // Map "Week 1", "Week 2" etc to the actual data
                                        const uniqueWeeks = [...new Set(rawData.map(item => item.Week))].sort();
                                        const weekIndex = parseInt(label.replace('Week ', '')) - 1;
                                        if (!isNaN(weekIndex) && uniqueWeeks[weekIndex]) {
                                            filteredData = rawData.filter(item => item.Week === uniqueWeeks[weekIndex]);
                                        }
                                    }
                                } else if (filterMapping === 'date_month_short') {
                                    filteredData = rawData.filter(item => new Date(item.date).toLocaleString('default', { month: 'short' }) === label);
                                } else {
                                    // Standard mapping (Stage, Sentiment, Reason, MachineID)
                                    filteredData = rawData.filter(item => String(item[filterMapping]).toLowerCase() === String(label).toLowerCase());
                                }
                            }
                        }
                    }

                    DrilldownService.show(title, drilldownConfig, filteredData);
                }

                // --- ADDED: New orchestrator function for all drilldown actions ---

                const DocFormHandler = {
                    show(docId, config) {
                        const rawData = StateManager.getState(config.dataKey);
                        const data = rawData.find(item => item.id === docId);
                        if (!data) { alert(`Details for ${docId} not found.`); return; }
                        const bodyHtml = `<div class="row">${config.fields.map(field => `<div class="col-md-6 form-readonly-group"><label>${field.label}</label><input type="text" class="form-control" value="${Utils.formatMetric(data[field.key], field.format)}" readonly></div>`).join('')}</div>`;
                        document.getElementById('docFormModalLabel').textContent = `Details for: ${docId}`;
                        document.getElementById('docFormBody').innerHTML = bodyHtml;
                        modals.drilldownModal.classList.add('is-blurred');
                        modals.docFormModal.show();
                    }
                };


                const ExpandChartHandler = {
                    show(componentId) {
                        const originalChart = chartInstances[componentId];
                        const config = Utils.getComponentConfig(componentId);
                        if (!originalChart || !config) { alert('Cannot expand: chart instance not found.'); return; }

                        const ctx = document.getElementById('expandedChartCanvas').getContext('2d');
                        const chartData = JSON.parse(JSON.stringify(originalChart.data));

                        const originalOptions = originalChart.config.options;
                        const expansionOverrides = {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: true },
                                tooltip: {
                                    enabled: true,
                                    external: null
                                }
                            }
                        };

                        const finalOptions = Utils.deepMerge(JSON.parse(JSON.stringify(originalOptions)), expansionOverrides);

                        const isKpiCard = dashboardConfig.kpis.some(k => k.id === componentId);
                        if (isKpiCard) {
                            const kpiData = StateManager.getState('kpiData')[config.dataKey];
                            if (kpiData && kpiData.trend_labels) {
                                chartData.labels = kpiData.trend_labels;
                            }
                            chartData.datasets[0].label = config.label;

                            // START: MODIFICATION
                            // Dynamically set colors based on the source KPI's configured CSS variable
                            if (config.cssVar) {
                                const trendColor = getComputedStyle(document.documentElement).getPropertyValue(config.cssVar).trim();
                                const trendColorRGB = Utils.hexToRgb(trendColor);

                                if (trendColor && trendColorRGB) {
                                    chartData.datasets[0].borderColor = trendColor;
                                    chartData.datasets[0].backgroundColor = `rgba(${trendColorRGB}, 0.2)`;
                                    chartData.datasets[0].fill = true;
                                    chartData.datasets[0].tension = 0.3;
                                }
                            }
                            // END: MODIFICATION
                        }

                        document.getElementById('expandChartModalLabel').textContent = `Expanded View: ${config.label || config.title}`;

                        if (chartInstances['expandedChart']) chartInstances['expandedChart'].destroy();
                        chartInstances['expandedChart'] = new Chart(ctx, { type: originalChart.config.type, data: chartData, options: finalOptions });
                        modals.expandChartModal.show();
                    }
                };

                const GuideHandler = { show(kpiConfig) { if (!kpiConfig?.guide) { alert('No guide available for this KPI.'); return; } const { title, definition, interpretation, calculation } = kpiConfig.guide; document.getElementById('kpiGuideModalLabel').textContent = `Guide: ${title}`; document.getElementById('guide-definition').textContent = definition; document.getElementById('guide-interpretation').textContent = interpretation; document.getElementById('guide-calculation').textContent = calculation; modals.kpiGuideModal.show(); } };

                const InteractivityHandler = {
                    init() {
                        const mainContent = document.getElementById('main-dashboard-content');
                        const modalIds = ['drilldownModal', 'expandChartModal', 'kpiGuideModal', 'docFormModal'];

                        modalIds.forEach(id => {
                            const modalEl = document.getElementById(id);
                            if (modalEl) {
                                // Add blur when any modal opens
                                modalEl.addEventListener('show.bs.modal', () => {
                                    mainContent.classList.add('dashboard-blur');
                                });

                                // Remove blur only if NO other modals are currently open (handles stacked modals)
                                modalEl.addEventListener('hidden.bs.modal', () => {
                                    const isAnyModalOpen = modalIds.some(mid => {
                                        const m = document.getElementById(mid);
                                        // Bootstrap adds the 'show' class to visible modals
                                        return m && m.classList.contains('show');
                                    });

                                    if (!isAnyModalOpen) {
                                        mainContent.classList.remove('dashboard-blur');
                                    }
                                });
                            }
                        });
                        const menu = document.getElementById('customContextMenu');
                        const tooltipEl = document.getElementById('custom-tooltip');
                        const drilldownModalEl = document.getElementById('drilldownModal');
                        const hideMenu = () => menu.style.display = 'none';
                        const hideTooltip = () => { if (tooltipEl) { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; } };
                        document.addEventListener('click', hideMenu);
                        document.addEventListener('keydown', e => e.key === 'Escape' && hideMenu());
                        document.body.addEventListener('contextmenu', e => { const target = e.target.closest('.context-menu-target'); if (target) { e.preventDefault(); this.showContextMenu(e, target.dataset.componentId); } });
                        document.body.addEventListener('click', e => {
                            const target = e.target.closest('.kpi-card');
                            if (target) initiateDrilldown(target.dataset.componentId);
                        });
                        tooltipEl.addEventListener('mouseenter', () => clearTimeout(tooltipHideTimer));
                        tooltipEl.addEventListener('mouseleave', () => { tooltipHideTimer = setTimeout(hideTooltip, 300); });
                        tooltipEl.querySelector('.drilldown-btn').addEventListener('click', (e) => {
                            const componentId = tooltipEl.dataset.componentId;
                            const dataIndex = tooltipEl.dataset.dataIndex;
                            if (componentId && dataIndex !== undefined) {
                                initiateDrilldown(componentId, { dataIndex: parseInt(dataIndex) });
                                // Hide tooltip after clicking
                                tooltipEl.style.opacity = 0;
                                tooltipEl.style.pointerEvents = 'none';
                            }
                        });
                        document.getElementById('drilldownFilterControls').addEventListener('change', e => { if (e.target.name === 'drilldownFilter') { const filterValue = e.target.value; document.getElementById('drilldownTbody').querySelectorAll('tr').forEach(row => { row.style.display = (filterValue === 'all' || row.dataset.status === filterValue) ? '' : 'none'; }); } });

                        // --- FIX: Add delegated event listener for drilldown table rows ---
                        drilldownModalEl.addEventListener('click', e => {
                            const row = e.target.closest('tr[data-doc-id]');
                            const configStr = drilldownModalEl.querySelector('.modal-body').dataset.docFormConfig;
                            if (row && configStr) {
                                const config = JSON.parse(configStr);
                                DocFormHandler.show(row.dataset.docId, config);
                            }
                        });

                        drilldownModalEl.addEventListener('hidden.bs.modal', () => {
                            const modalBody = drilldownModalEl.querySelector('.modal-body');
                            if (modalBody.dataset.docFormConfig) {
                                delete modalBody.dataset.docFormConfig;
                            }
                        });

                        document.getElementById('docFormModal').addEventListener('hidden.bs.modal', () => modals.drilldownModal.classList.remove('is-blurred'));

                        const salesToggle = document.getElementById('sales-view-toggle-actual-vs-target-chart');
                        if (salesToggle) {
                            salesToggle.addEventListener('change', (e) => {
                                StateManager.setState('salesChartView', e.target.value);
                            });
                        }

                        const funnelToggle = document.getElementById('funnel-view-toggle-funnel-chart');
                        if (funnelToggle) {
                            funnelToggle.addEventListener('change', (e) => {
                                StateManager.setState('funnelChartView', e.target.value);
                            });
                        }

                        const fgDelayToggle = document.getElementById('fg-delay-view-toggle-weekly-fg-delay-chart');
                        if (fgDelayToggle) {
                            fgDelayToggle.addEventListener('change', (e) => {
                                StateManager.setState('fgDelayChartView', e.target.value);
                            });
                        }

                        const agingToggle = document.getElementById('aging-view-toggle-aging-chart');
                        if (agingToggle) {
                            agingToggle.addEventListener('change', (e) => {
                                StateManager.setState('agingChartView', e.target.value);
                            });
                        }

                        document.getElementById('expandChartModal').addEventListener('hidden.bs.modal', () => {
                            if (chartInstances['expandedChart']) {
                                chartInstances['expandedChart'].destroy();
                                chartInstances['expandedChart'] = null;
                            }
                        });
                    },
                    showContextMenu(event, componentId) {
                        const config = Utils.getComponentConfig(componentId);
                        const menu = document.getElementById('customContextMenu');
                        const menuList = document.getElementById('contextMenuList');
                        const componentActions = config?.actions || dashboardConfig.contextMenu.actions.map(a => a.id);
                        let actions = dashboardConfig.contextMenu.actions.filter(a => componentActions.includes(a.id) || a.type === 'separator');
                        const renderItems = items => items.map(a => a.type === 'separator' ? '<li class="context-menu-separator"></li>' : `<li class="context-menu-item" data-action="${a.id}"><i class="bi ${a.icon}"></i><span>${a.label}</span>${a.submenu ? `<i class="bi bi-chevron-right"></i><ul class="context-menu-sublist">${renderItems(a.submenu)}</ul>` : ''}</li>`).join('');
                        menuList.innerHTML = renderItems(actions);
                        menu.querySelectorAll('.context-menu-item').forEach(item => { if (!item.querySelector('.context-menu-sublist')) item.addEventListener('click', () => this.handleContextMenuAction(item.dataset.action, componentId)); });
                        menu.style.visibility = 'hidden';
                        menu.style.display = 'block';

                        const { offsetWidth: menuW, offsetHeight: menuH } = menu;
                        const { clientX: mouseX, clientY: mouseY } = event;
                        const { innerWidth: viewportW, innerHeight: viewportH } = window;
                        const padding = 5; // A small buffer from the viewport edge
                        let finalLeft = mouseX;
                        if ((mouseX + menuW + padding) > viewportW) {
                            finalLeft = mouseX - menuW; // Flip to the left of the cursor
                        }
                        let finalTop = mouseY;
                        if ((mouseY + menuH + padding) > viewportH) {
                            finalTop = mouseY - menuH; // Flip above the cursor
                        }
                        menu.style.left = `${finalLeft + window.scrollX}px`;
                        menu.style.top = `${finalTop + window.scrollY}px`;
                        menu.style.visibility = 'visible';
                    },
                    handleContextMenuAction(action, componentId) {
                        const config = Utils.getComponentConfig(componentId);
                        switch (action) {
                            case 'drilldown': initiateDrilldown(componentId); break;
                            case 'refresh': refreshDashboardData(); break;
                            case 'expand': ExpandChartHandler.show(componentId); break;
                            case 'guide': if (config.guide) GuideHandler.show(config); break;
                            case 'share': window.location.href = `mailto:?subject=Dashboard Insight: ${config.label || config.title}&body=Review data for ${config.label || config.title}.`; break;
                            case 'export-png': const chart = chartInstances[componentId]; if (chart) { const a = document.createElement('a'); a.href = chart.toBase64Image(); a.download = `${componentId}.png`; a.click(); } break;
                            default: alert(`Action '${action}' is not yet implemented.`);
                        }
                    },

                    customTooltip(context) {
                        const { chart, tooltip } = context;
                        const tooltipEl = document.getElementById('custom-tooltip');
                        clearTimeout(tooltipHideTimer);
                        if (tooltip.opacity === 0) { tooltipHideTimer = setTimeout(() => { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; }, 300); return; }

                        const titleEl = tooltipEl.querySelector('.tooltip-main-title');
                        const headerEl = tooltipEl.querySelector('.tooltip-header');
                        const valueEl = tooltipEl.querySelector('.tooltip-value');
                        const seriesTitleEl = tooltipEl.querySelector('.tooltip-title');
                        const deltaEl = tooltipEl.querySelector('.tooltip-delta');
                        const footerEl = tooltipEl.querySelector('.tooltip-footer');

                        // Reset common elements
                        headerEl.style.display = 'flex';
                        deltaEl.style.display = 'none';
                        footerEl.style.display = 'none';

                        // --- FIX: Changed chart.config.id to chart.canvas.id ---
                        if (chart.canvas.id.startsWith('pareto')) {
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            headerEl.style.display = 'none';
                            valueEl.textContent = '';
                            const footerContent = tooltip.dataPoints.map(dp => {
                                const isPercentage = dp.dataset.label.includes('%');
                                const value = isPercentage ? `${dp.raw.toFixed(1)}%` : Utils.formatMetric(dp.raw);
                                return `<div class="footer-row"><span>${dp.dataset.label}</span><span>${value}</span></div>`;
                            }).join('');
                            footerEl.innerHTML = footerContent;
                            footerEl.style.display = 'flex';
                        } else { // Default handler for bar, line, doughnut, radar etc.
                            const dp = tooltip.dataPoints[0];
                            if (!dp) return;
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            seriesTitleEl.textContent = dp.dataset.label || '';
                            valueEl.textContent = Utils.formatMetric(dp.raw);
                            const prev = dp.dataIndex > 0 ? chart.data.datasets[dp.datasetIndex].data[dp.dataIndex - 1] : null;
                            if (prev !== null && prev !== 0 && typeof dp.raw === 'number') { const change = ((dp.raw - prev) / prev) * 100, isPos = change >= 0; deltaEl.className = `tooltip-delta ${isPos ? 'positive' : 'negative'}`; deltaEl.innerHTML = `<i class="bi ${isPos ? 'bi-arrow-up' : 'bi-arrow-down'}"></i> ${Math.abs(change).toFixed(1)}%`; deltaEl.style.display = 'flex'; }
                            const footerContent = chart.data.datasets.map((ds, i) => i !== dp.datasetIndex && ds.data[dp.dataIndex] !== undefined ? `<div class="footer-row"><span>${ds.label}</span><span>${Utils.formatMetric(ds.data[dp.dataIndex])}</span></div>` : null).filter(Boolean);
                            if (footerContent.length > 0) { footerEl.innerHTML = footerContent.join(''); footerEl.style.display = 'flex'; }
                        }

                        tooltipEl.dataset.componentId = chart.canvas.id;
                        tooltipEl.dataset.dataIndex = tooltip.dataPoints[0].dataIndex;
                        const canvasRect = chart.canvas.getBoundingClientRect();
                        tooltipEl.style.opacity = 1;
                        tooltipEl.style.pointerEvents = 'all';

                        tooltipEl.style.left = (canvasRect.left + window.scrollX + tooltip.caretX) + 'px';
                        tooltipEl.style.top = (canvasRect.top + window.scrollY + tooltip.caretY) + 'px';
                    }
                };

                const ConfigValidator = {
                    validate(config) {
                        if (!config.title) throw new Error("`title` is missing.");
                        if (!Array.isArray(config.kpis)) throw new Error("`kpis` must be an array.");
                        if (!Array.isArray(config.layout)) throw new Error("`layout` must be an array.");
                        config.kpis.forEach((kpi, i) => {
                            if (!kpi.id || !kpi.dataKey || !kpi.label) throw new Error(`KPI at index ${i} is missing required keys (id, dataKey, label).`);
                        });
                        config.layout.forEach((item, i) => {
                            if (!item.type || !item.width || !item.config) throw new Error(`Layout item at index ${i} is missing required keys (type, width, config).`);
                            const chartConfig = item.config;
                            if (chartConfig.drilldownConfig && !Array.isArray(chartConfig.drilldownConfig.columns)) {
                                throw new Error(`Drilldown config for chart '${chartConfig.id}' is missing a 'columns' array.`);
                            }
                            if (typeof chartConfig.transformer !== 'function' && !SharedTransformers[chartConfig.transformer]) {
                                throw new Error(`Transformer for chart '${chartConfig.id}' must be a function or a key in SharedTransformers.`);
                            }
                        });
                    }
                };

                return { init };
            })();

            // Initialize the application
            APP_CORE.init();
        })();
    </script>
</body>

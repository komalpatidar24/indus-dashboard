<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Template (v16.1)</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- jQuery (Required by DevExtreme) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- DevExtreme JS & CSS (Theme and Core) -->
    <script src="https://cdn3.devexpress.com/jslib/23.2.6/js/dx.all.js"></script>
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.2.6/css/dx.light.css">

    <!-- Dashboard Filters CSS -->
    <link rel="stylesheet" href="dashboard-filters.css">
    <!-- Chart.js & Datalabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>


</head>

<body>

    <div id="main-dashboard-content" class="container-fluid py-4 modal-body">
        <header class="dashboard-header pb-2 d-flex justify-content-between align-items-center border-bottom mb-3">
            <h3 id="dashboardTitle" class="mb-0">CRM & Sales Dashboard <span id="activeFiltersDisplay"
                    class="filter-display-container"></span></h3>

            <div class="d-flex align-items-center ms-auto">
                <!-- 1. Job/Value Toggle -->
                <!--<div class="btn-group otif-toggle-group me-2" id="jobValueToggle" role="group">
                    <input type="radio" class="btn-check" name="jobValueType" id="jobType" checked>
                    <label class="btn" for="jobType">Job</label>
                    <input type="radio" class="btn-check" name="jobValueType" id="valueType">
                    <label class="btn" for="valueType">Value</label>
                </div> -->

                <div class="vr me-2" style="opacity: 0.3;"></div>

                <!-- 2. Moving Average Dropdown -->
                <div class="btn-group me-2" id="ma-dropdown-container">
                    <button type="button" class="btn otif-ma-button active" id="maButton">
                        <span id="maButtonText">Loading...</span>
                    </button>
                    <button type="button" class="btn otif-ma-button dropdown-toggle dropdown-toggle-split active"
                        data-bs-toggle="dropdown">
                    </button>
                    <ul class="dropdown-menu otif-ma-dropdown-menu" id="maDropdownMenu" style="position: relative;">
                        <!-- Clear Button Removed -->
                        <li class="px-3 py-2">
                            <input type="text" class="form-control form-control-sm" id="maSearchInput"
                                placeholder="Search weeks...">
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item active" href="#" data-ma-type="full" data-ma-week="52">(last)
                                13-Week-MA</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <div id="maWeekOptions"></div>
                    </ul>
                </div>

                <div class="vr me-2" style="opacity: 0.3;"></div>

                <!-- 3. Time Filter Toggles -->
                <div class="btn-group otif-toggle-group me-2" id="timeFilterContainer">
                    <button type="button" class="btn" data-category="Day">Day</button>
                    <button type="button" class="btn" data-category="Week">Week</button>
                    <button type="button" class="btn" data-category="Month">Month</button>
                    <button type="button" class="btn" data-category="Quarter">Quarter</button>
                    <button type="button" class="btn" data-category="Year">Year</button>
                </div>

                <!-- 4. Filter Panel Toggle -->
                <button class="btn btn-link text-secondary me-1" type="button" id="toggle-filter-panel-btn"
                    title="Filters">
                    <i class="bi bi-filter fs-5"></i>
                </button>
            </div>
        </header>
        <section class="kpi-section mb-3">
            <div id="kpi-container" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-5 g-3"></div>
        </section>
        <section class="main-content-section">
            <div id="content-grid" class="row g-3"></div>
        </section>
    </div>

    <!-- MODALS -->
    <div class="modal fade" id="drilldownModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="drilldownModalLabel"></h5>
                    <div id="drilldownFilterControls"></div><button type="button" class="btn-close ms-2"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="drilldownModalBody"></div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="expandChartModal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="expandChartModalLabel"></h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body d-flex flex-column">
                    <div class="chart-canvas-container flex-grow-1"><canvas id="expandedChartCanvas"></canvas></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="kpiGuideModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="kpiGuideModalLabel"></h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row" id="kpiGuideContent">
                        <div class="col-md-4">
                            <h6><i class="bi bi-card-text"></i> Definition</h6>
                            <p id="guide-definition" class="small"></p>
                        </div>
                        <div class="col-md-4">
                            <h6><i class="bi bi-graph-up"></i> Interpretation</h6>
                            <p id="guide-interpretation" class="small"></p>
                        </div>
                        <div class="col-md-4">
                            <h6><i class="bi bi-calculator"></i> Calculation</h6>
                            <p id="guide-calculation" class="small"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="docFormModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="docFormModalLabel"></h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="docFormBody"></div>
            </div>
        </div>
    </div>

    <!-- UI ELEMENTS -->
    <div id="custom-tooltip" class="chart-tooltip">
        <div class="tooltip-main-title"></div>
        <div class="tooltip-main-content">
            <div class="tooltip-header"><span class="tooltip-title"></span><span class="tooltip-delta"></span></div>
            <div class="tooltip-value"></div>
        </div>
        <div class="tooltip-footer" style="display: none;"></div>
        <div class="tooltip-drilldown"><button type="button" class="drilldown-btn">View Details <i
                    class="bi bi-box-arrow-up-right"></i></button></div>
    </div>
    <div id="customContextMenu">
        <ul class="context-menu-list" id="contextMenuList"></ul>
    </div>
    <div id="filter-popup-panel" class="d-none">
        <div class="p-2 border-bottom position-relative text-center">
            <h6 class="otif-filter-panel-title mb-0 m-auto">Filters</h6>
            <button type="button" class="btn-close position-absolute end-0 top-50 translate-middle-y me-2"
                id="close-filter-panel-btn"></button>
        </div>
        <div class="flex-grow-1" style="overflow-y: auto;">
            <div class="p-2">
                <div class="filter-section" id="dropdown-filters-section"></div>
                <div class="filter-section">
                    <div id="calendar-container">
                        <div id="calendar-view">
                            <div class="calendar-header">
                                <button type="button" class="btn btn-today" id="today-btn">Today</button>
                                <div class="d-flex align-items-center">
                                    <button id="prev-month-btn" class="btn btn-icon" type="button"><i
                                            class="bi bi-chevron-left"></i></button>
                                    <div id="month-year-selector" class="month-year-selector-btn">
                                        <span id="month-year-display" class="month-year-text"></span>
                                    </div>
                                    <button id="next-month-btn" class="btn btn-icon" type="button"><i
                                            class="bi bi-chevron-right"></i></button>
                                </div>
                            </div>
                            <div class="calendar-grid day-names">
                                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                            </div>
                            <div id="calendar-grid" class="calendar-grid"></div>
                        </div>
                        <!-- Month/Year Picker Overlay (Hidden by default) -->
                        <div id="month-year-picker-overlay" class="d-none">
                            <div class="picker-header">
                                <span>Select Date</span>
                                <button type="button" class="btn btn-apply btn-sm" id="picker-done-btn">Done</button>
                            </div>
                            <div class="picker-body">
                                <div class="picker-column" id="picker-month-column">
                                    <div class="picker-column-header">Month</div>
                                    <!-- Months will be rendered by JS -->
                                </div>
                                <div class="picker-column" id="picker-year-column">
                                    <div class="picker-column-header">Year</div>
                                    <!-- Years will be rendered by JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="date-range-display" class="date-range-box">
                        <div class="date-range-item"><label>From</label><span id="selected-from-date">--</span></div>
                        <div class="date-range-item"><label>To</label><span id="selected-to-date">--</span></div>
                    </div>
                    <div class="p-2 d-flex gap-2">
                        <button type="button" class="btn btn-reset w-100" id="reset-filters-btn-new">Reset</button>
                        <button type="button" class="btn btn-apply w-100" id="apply-filters-btn-new">Apply</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard-filters.js"></script>
    <script>
        const dashboardApp = (function () {

            // ========================================================================================================
            // SECTION 1: CONFIGURATION (THE ONLY PART TO EDIT FOR A NEW DASHBOARD)
            // This section simulates `config.js`.
            // ========================================================================================================
            const CONFIGURATION = (() => {
                /**
                 * HOW TO USE THIS TEMPLATE:
                 * 1.  Update `dashboardTitle` with the title for your dashboard.
                 * 2.  Define your Key Performance Indicators (KPIs) in the `kpiConfig` array.
                 * 3.  Define your chart layout and configurations in the `layoutConfig` array.
                 * 4.  Update the `DATA_PROVIDER` section to connect to your live backend API.
                 * 5.  Ensure your data provider returns data objects with keys that match the `dataKey` properties defined here.
                 */
                const dashboardTitle = 'Purchase Dashboard';

                const kpiConfig = [
                    {
                        id: 'kpi-cycle-time', dataKey: 'cycle_time', label: 'Procure-to-Pay Cycle Time', valueSuffix: ' Days', cssVar: '--glow-blue', invertGrowthColor: true,
                        secondaryMetrics: [
                            { dataKey: 'indent_count', label: 'Indents Processed', icon: 'bi-file-earmark-text' },
                            { dataKey: 'invoice_count', label: 'Invoices Paid', icon: 'bi-receipt' }
                        ],
                        guide: { title: 'Procure-to-Pay Cycle Time', definition: 'The average time from creating a purchase requisition (indent) to issuing payment to the vendor.', interpretation: 'Measures the efficiency of the entire procurement process. A lower value is better.', calculation: 'Average of (Payment Date - Indent Date) for all completed cycles.' },
                        drilldownConfig: {
                            dataKey: 'purchase_orders',
                            columns: [
                                { key: 'id', label: 'PO Number' },
                                { key: 'date', label: 'Date', format: 'date' },
                                { key: 'vendor', label: 'Vendor' },
                                { key: 'value', label: 'Value', format: 'currency' },
                                { key: 'status', label: 'Status' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-bom-value', dataKey: 'bom_value', label: 'BOM (RM) Value', isCurrency: true, format: 'currency_compact', cssVar: '--glow-orange', invertGrowthColor: true,
                        secondaryMetrics: [
                            { dataKey: 'projection_based', label: 'Projection Based', icon: 'bi-graph-up-arrow', format: 'currency_compact' },
                            { dataKey: 'dic_based', label: 'DIC Based', icon: 'bi-calculator', format: 'currency_compact' },
                            { dataKey: 'job_specific', label: 'Job Specific', icon: 'bi-briefcase', format: 'currency_compact' }
                        ],
                        guide: { title: 'BOM Value', definition: 'The financial value of materials that must be purchased to fulfill new demand.', interpretation: 'Highlights the immediate purchasing budget required.', calculation: 'Sum of Projection + DIC Based + Job Specific requirements.' },
                        drilldownConfig: {
                            dataKey: 'stock_data',
                            columns: [
                                { key: 'item', label: 'Item SKU' },
                                { key: 'category', label: 'Category' },
                                { key: 'value', label: 'Stock Value', format: 'currency' },
                                { key: 'age_days', label: 'Age (Days)' },
                                { key: 'is_nmi', label: 'Is NMI?' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-rejection', dataKey: 'rejection_rate', label: 'Average Rejection Rate', valueSuffix: '%', cssVar: '--glow-purple', invertGrowthColor: true,
                        secondaryMetrics: [
                            { dataKey: 'qty_rejected', label: 'Qty Rejected', icon: 'bi-x-circle' },
                            { dataKey: 'qty_received', label: 'Qty Received', icon: 'bi-truck' }
                        ],
                        guide: { title: 'Average Rejection Rate %', definition: 'The percentage of total quantity received from suppliers that was rejected due to quality issues.', interpretation: 'Measures supplier quality and the cost of poor quality.', calculation: '(Total Quantity Rejected / Total Quantity Received) * 100.' },
                        drilldownConfig: {
                            dataKey: 'purchase_orders', // Assumes rejection data would be linked to POs
                            columns: [
                                { key: 'id', label: 'PO Number' },
                                { key: 'vendor', label: 'Vendor' },
                                { key: 'category', label: 'Category' },
                                { key: 'status', label: 'Status' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-budget', dataKey: 'capex_utilization', label: 'Capex Budget Utilization %', valueSuffix: '%', cssVar: '--glow-lightblue',
                        secondaryMetrics: [
                            { dataKey: 'budgeted_value', label: 'Budget', icon: 'bi-archive', format: 'currency_compact' },
                            { dataKey: 'utilized_value', label: 'Utilized', icon: 'bi-cash-coin', format: 'currency_compact' }
                        ],
                        guide: { title: 'Capex Budget Utilization %', definition: 'The percentage of the approved capital expenditure budget that has been spent.', interpretation: 'Tracks spending against plan. Unbudgeted spend highlights out-of-scope procurement.', calculation: '(Actual Capex Spend / Approved Capex Budget) * 100.' },
                        drilldownConfig: {
                            dataKey: 'purchase_orders',
                            columns: [
                                { key: 'id', label: 'PO Number' },
                                { key: 'date', label: 'Date', format: 'date' },
                                { key: 'vendor', label: 'Vendor' },
                                { key: 'category', label: 'Category' },
                                { key: 'value', label: 'PO Value', format: 'currency' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-unbudgeted', dataKey: 'unbudgeted_value', label: 'Unbudgeted Capex Value', isCurrency: true, format: 'currency_compact', cssVar: '--glow-green', invertGrowthColor: true,
                        secondaryMetrics: [
                            { dataKey: 'unbudgeted_po_count', label: 'Unbudgeted POs', icon: 'bi-cash-question-circle' }
                        ],
                        guide: { title: 'Unbudgeted Purchase Value', definition: 'The total value of all purchase orders created without a pre-approved budget line item.', interpretation: 'Measures unplanned spending and potential budget overruns. A lower value indicates better financial planning and control.', calculation: 'Sum of (PO Value) for all POs where Budgeted = False.' },
                        drilldownConfig: {
                            dataKey: 'purchase_orders', // In a real scenario, this would be filtered
                            columns: [
                                { key: 'id', label: 'PO Number' },
                                { key: 'date', label: 'Date', format: 'date' },
                                { key: 'vendor', label: 'Vendor' },
                                { key: 'value', label: 'Value', format: 'currency' }
                            ]
                        }
                    }

                ];

                const layoutConfig = [
                    // --- ROW 1: 3 CHARTS (col-lg-4 each) ---
                    {
                        type: 'chart', width: 'col-lg-4', config: {
                            id: 'procurement-funnel', chartType: 'bar', title: 'Procurement Funnel',
                            dataKey: 'procurement_funnel',
                            dropdownConfig: {
                                id: 'funnelCategory',
                                options: ['All', 'Paper', 'Binding Material', 'Production Consumables', 'Maintenance Services', 'Capex']
                            },
                            drilldownConfig: {
                                dataKey: 'funnel_details',
                                filterMapping: 'stage',
                                columns: [
                                    { key: 'doc_id', label: 'Document ID' },
                                    { key: 'date', label: 'Date', format: 'date' },
                                    { key: 'category', label: 'Item Category' },
                                    { key: 'requestor', label: 'Requestor Name' },
                                    { key: 'vendor', label: 'Vendor Name' },
                                    { key: 'value', label: 'Value (INR)', format: 'currency' },
                                    { key: 'aging', label: 'Aging (Days)' },
                                    { key: 'expected_date', label: 'Expected Delivery', format: 'date' }
                                ]
                            },
                            transformer: (data, periodIndex, config, state) => {
                                const selectedCat = state ? state['funnelCategory'] : 'All';
                                // Filter data if a category is selected (Mock logic: in real app, data might be pre-filtered or we filter here)
                                // Since 'procurement_funnel' mock data is just stage-aggregated, we'd need detailed data to filter accurately.
                                // For this template, we'll simulate the filter effect by adjusting values.

                                let displayData = data;
                                if (selectedCat && selectedCat !== 'All') {
                                    // Simulation: Reduce values for specific categories
                                    const ratio = 0.3 + (selectedCat.length % 5) / 10;
                                    displayData = data.map(d => ({
                                        ...d,
                                        value: Math.round(d.value * ratio),
                                        count: Math.round(d.count * ratio)
                                    }));
                                }

                                return {
                                    labels: displayData.map(d => d.stage),
                                    datasets: [
                                        {
                                            label: 'Value (INR)',
                                            data: displayData.map(d => d.value),
                                            backgroundColor: '#025043',
                                            order: 2,
                                            yAxisID: 'y'
                                        },
                                        {
                                            type: 'line',
                                            label: 'No. of POs',
                                            data: displayData.map(d => d.count),
                                            borderColor: '#FF9800',
                                            backgroundColor: '#FF9800',
                                            borderWidth: 2,
                                            pointRadius: 4,
                                            order: 1,
                                            yAxisID: 'y1'
                                        }
                                    ]
                                };
                            },
                            options: {
                                indexAxis: 'x', // Vertical bars
                                onClick: (e, elements, chart) => {
                                    if (elements.length > 0) {
                                        const index = elements[0].index;
                                        initiateDrilldown(chart.canvas.id, { dataIndex: index });
                                    }
                                },
                                scales: {
                                    y: {
                                        type: 'linear',
                                        display: true,
                                        position: 'left',
                                        title: { display: true, text: 'Value (INR)' },
                                        grid: { display: false },
                                        ticks: {
                                            callback: function (value) {
                                                if (Math.abs(value) >= 10000000) return (value / 10000000).toFixed(2) + ' Cr';
                                                if (Math.abs(value) >= 100000) return (value / 100000).toFixed(2) + ' L';
                                                return new Intl.NumberFormat('en-IN').format(value);
                                            }
                                        }
                                    },
                                    y1: {
                                        type: 'linear',
                                        display: true,
                                        position: 'right',
                                        title: { display: true, text: 'No. of POs' },
                                        grid: { drawOnChartArea: false }, // only want the grid lines for one axis to show up
                                    },
                                    x: {
                                        title: { display: true, text: 'Procurement Stage' }
                                    }
                                },
                                plugins: {
                                    tooltip: {
                                        mode: 'index',
                                        intersect: false,
                                        callbacks: {
                                            label: function (context) {
                                                let label = context.dataset.label || '';
                                                if (label) {
                                                    label += ': ';
                                                }
                                                if (context.dataset.yAxisID === 'y') {
                                                    return label + new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0 }).format(context.raw);
                                                }
                                                return label + context.raw;
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    },
                    {
                        type: 'chart', width: 'col-lg-4', config: { // <-- MODIFIED
                            id: 'cycle-time-trend-chart', chartType: 'line', title: 'Procurement Cycle Time Trend (Days)',
                            dataKey: 'cycle_time_trend',
                            drilldownConfig: {
                                dataKey: 'cycle_time_details', // New data key for detailed transactional data
                                filterMapping: 'date_month_short', // Filters the list based on the month clicked
                                columns: [
                                    { key: 'doc_id', label: 'PO Number' },
                                    { key: 'category', label: 'Category' },
                                    { key: 'vendor', label: 'Vendor Name' },
                                    { key: 'date', label: 'PO Date', format: 'date' },
                                    { key: 'delivery_date', label: 'Delivery Date', format: 'date' },
                                    { key: 'actual_lead', label: 'Actual Lead Time', valueSuffix: ' Days' },
                                    { key: 'target_lead', label: 'Target Lead Time', valueSuffix: ' Days' },
                                    { key: 'deviation', label: 'Deviation (+/- Days)', valueSuffix: ' Days' },
                                    { key: 'status', label: 'Overdue Status' }
                                ]
                            },
                            dropdownConfig: {
                                id: 'cycleTimeCategory',
                                options: ['All', 'Paper', 'Binding Material', 'Production Consumable', 'Maintenance Services', 'CapEx']
                            },
                            transformer: (data, periodIndex, config, state) => {
                                const selectedCat = state ? state['cycleTimeCategory'] : null;
                                let displayData = data;
                                // Mock filtering effect: randomize data slightly based on category to show interaction
                                if (selectedCat && selectedCat !== 'All') {
                                    // Deterministic pseudo-random based on category length to keep it consistent per category
                                    const seed = selectedCat.length;
                                    displayData = data.map(d => ({
                                        ...d,
                                        avg_days: d.avg_days + (Math.sin(d.avg_days * seed) * 2)
                                    }));
                                }

                                return {
                                    labels: displayData.map(d => d.month),
                                    datasets: [{
                                        label: 'Avg Cycle Time',
                                        data: displayData.map(d => d.avg_days),
                                        borderColor: '#003366',
                                        backgroundColor: 'rgba(0, 51, 102, 0.2)',
                                        fill: true,
                                        tension: 0.3
                                    }]
                                };
                            },
                            options: {
                                scales: {
                                    y: { beginAtZero: false, title: { display: true, text: 'Avg. Cycle Time (Days)' } },
                                    x: { title: { display: true, text: 'Month' } }
                                }
                            }
                        }
                    },
                    {
                        type: 'chart', width: 'col-lg-4', config: { // <-- MODIFIED
                            id: 'spend-category-chart', chartType: 'pie', title: 'Spend by Category',
                            dataKey: 'purchase_orders',
                            drilldownConfig: {
                                dataKey: 'spend_details', // New data key for detailed transactional spend
                                filterMapping: 'category', // Filters by the category label on the pie slice
                                columns: [
                                    { key: 'vendor', label: 'Vendor Name' },
                                    { key: 'description', label: 'Item Description' },
                                    { key: 'value', label: 'Total Spend (INR)', format: 'currency' },

                            value: { min: Math.min(...metrics.value), max: Math.max(...metrics.value) }
                        };

                            if (!subscribers[key]) subscribers[key] = [];

                        },
                        setState: (key, data) => {
                            const currentState = state[key];
                            let hasChanged = false;
                            if (typeof currentState === 'object' && currentState !== null && typeof data === 'object' && data !== null) {
                                if (JSON.stringify(currentState) !== JSON.stringify(data)) hasChanged = true;
                            } else {
                                if (currentState !== data) hasChanged = true;

                async function initialDataFetch() {

                function renderSparkline(id, data, colorVarName) {
                    const ctx = document.getElementById(`sparkline-${id}`)?.getContext('2d');
                    if (!ctx) return;

                    const trendColor = getComputedStyle(document.documentElement).getPropertyValue(colorVarName).trim();
                    const trendColorRGB = Utils.hexToRgb(trendColor);

                    if (!trendColorRGB) {
                        console.error(`Invalid color format or CSS variable not found for: ${colorVarName}`);
                        return;
                    }

                    const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
                    // MODIFIED: Implemented a 3-stop gradient for a darker top that fades out.
                    gradient.addColorStop(0, `rgba(${trendColorRGB}, 0.45)`);  // Darker start color near the line
                    gradient.addColorStop(0.4, `rgba(${trendColorRGB}, 0.1)`);   // Fade significantly by 40% height
                    gradient.addColorStop(1, `rgba(${trendColorRGB}, 0)`);      // Fully transparent at the bottom

                    if (chartInstances[id]) chartInstances[id].destroy();

                    chartInstances[id] = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.map(() => ''),
                            datasets: [{
                                data: data,
                                borderColor: trendColor,
                                borderWidth: 2,
                                fill: true,
                                backgroundColor: gradient,
                                tension: 0.4,
                                pointRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: { x: { display: false }, y: { display: false } },
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },

                const ChartHandler = {

                            if (!ctx) throw new Error(`Canvas with id '${config.id}' not found.`);
                            const rawData = StateManager.getState(config.dataKey);
                            if (!rawData) { return; }
                            const periodIndex = StateManager.getState('selectedPeriodIndex');
                            let transformer;
                            if (typeof config.transformer === 'function') {
                                transformer = config.transformer;
                            } else if (typeof config.transformer === 'string' && SharedTransformers[config.transformer]) {
                                transformer = SharedTransformers[config.transformer];
                            } else {
                                throw new Error(`Transformer '${config.transformer}' is not a valid function or a key in SharedTransformers.`);

                            const data = transformer(rawData, periodIndex, config, StateManager.getState());
                            if (chartInstances[config.id]) chartInstances[config.id].destroy();

                                finalOptions.onHover = (event, elements, chart) => { const centerText = chart.config.options.plugins.centerText; if (elements.length > 0) { const index = elements[0].index; centerText.text = Utils.formatMetric(chart.data.datasets[0].data[index]); centerText.label = chart.data.labels[index]; } else { centerText.text = Utils.formatMetric(total); centerText.label = 'Total'; } chart.update('none'); };
                                if (config.drilldownTarget) { finalOptions.onClick = () => DrilldownHandler.show(config.drilldownTarget); }

                const DrilldownService = {

                // --- ADDED: New orchestrator function for all drilldown actions ---
                function initiateDrilldown(componentId, context = {}) {
                    const config = Utils.getComponentConfig(componentId);

                    if (!config) return;

                    if (config.drilldownTarget && !context.dataIndex) {
                        return initiateDrilldown(config.drilldownTarget);
                    }

                    const drilldownConfig = config.drilldownConfig;
                    const titleBase = config.label || config.title || "Details";

                    if (!drilldownConfig) {
                        return DrilldownService.showPlaceholder(titleBase, `No drilldown configured.`);
                    }

                    const { dataKey, columns, filters, docFormConfig, filterMapping } = drilldownConfig;
                    let title = `Detailed View: ${titleBase}`;
                    const rawData = StateManager.getState(dataKey);

                    if (!rawData) {
                        return DrilldownService.showPlaceholder(title, `No detailed data available.`);
                    }

                    let filteredData = [...rawData];

                    // Check if we are filtering by a specific chart element (Tooltip Click)
                    if (context.dataIndex !== undefined) {
                        const chart = chartInstances[componentId];
                        if (chart && chart.data.labels[context.dataIndex] !== undefined) {
                            // Trim the label to remove any hidden spaces
                            const label = String(chart.data.labels[context.dataIndex]).trim();
                            title += ` (${label})`;

                            if (filterMapping === 'date_month_short') {
                                filteredData = rawData.filter(item => {
                                    const d = new Date(item.date);
                                    // Use a more robust check for month matching
                                    const itemMonth = d.toLocaleString('en-US', { month: 'short' }).replace('.', '');
                                    const targetMonth = label.replace('.', '');
                                    return itemMonth.toLowerCase() === targetMonth.toLowerCase();
                                });
                            } else if (filterMapping) {
                                // Case-insensitive and trimmed comparison for categories
                                filteredData = rawData.filter(item => {
                                    const val = String(item[filterMapping] || "").trim();
                                    return val.toLowerCase() === label.toLowerCase();
                                });
                            }
                        }
                    }

                    DrilldownService.show(title, columns, filteredData, filters, docFormConfig);
                }

                const DocFormHandler = {
                    show(docId, config) {

                        const bodyHtml = `<div class="row">${config.fields.map(field => `<div class="col-md-6 form-readonly-group"><label>${field.label}</label><input type="text" class="form-control" value="${Utils.formatMetric(data[field.key], field.format)}" readonly></div>`).join('')}</div>`;

                const ExpandChartHandler = {

                        const ctx = document.getElementById('expandedChartCanvas').getContext('2d');
                        const chartData = JSON.parse(JSON.stringify(originalChart.data));

                        const originalOptions = originalChart.config.options;
                        const expansionOverrides = {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: true },
                                tooltip: {
                                    enabled: true,
                                    external: null
                                }
                            }
                        };

                        const finalOptions = Utils.deepMerge(JSON.parse(JSON.stringify(originalOptions)), expansionOverrides);

                        const isKpiCard = dashboardConfig.kpis.some(k => k.id === componentId);
                        if (isKpiCard) {
                            const kpiData = StateManager.getState('kpiData')[config.dataKey];
                            if (kpiData && kpiData.trend_labels) {
                                chartData.labels = kpiData.trend_labels;
                            }
                            chartData.datasets[0].label = config.label;

                            // START: MODIFICATION
                            // Dynamically set colors based on the source KPI's configured CSS variable
                            if (config.cssVar) {
                                const trendColor = getComputedStyle(document.documentElement).getPropertyValue(config.cssVar).trim();
                                const trendColorRGB = Utils.hexToRgb(trendColor);

                                if (trendColor && trendColorRGB) {
                                    chartData.datasets[0].borderColor = trendColor;
                                    chartData.datasets[0].backgroundColor = `rgba(${trendColorRGB}, 0.2)`;
                                    chartData.datasets[0].fill = true;
                                    chartData.datasets[0].tension = 0.3;
                                }
                            }
                        }

                        document.getElementById('expandChartModalLabel').textContent = `Expanded View: ${config.label || config.title}`;

                        if (chartInstances['expandedChart']) chartInstances['expandedChart'].destroy();
                        chartInstances['expandedChart'] = new Chart(ctx, { type: originalChart.config.type, data: chartData, options: finalOptions });
                        modals.expandChartModal.show();
                    }
                };

                const GuideHandler = { show(kpiConfig) { if (!kpiConfig?.guide) { alert('No guide available for this KPI.'); return; } const { title, definition, interpretation, calculation } = kpiConfig.guide; document.getElementById('kpiGuideModalLabel').textContent = `Guide: ${title}`; document.getElementById('guide-definition').textContent = definition; document.getElementById('guide-interpretation').textContent = interpretation; document.getElementById('guide-calculation').textContent = calculation; modals.kpiGuideModal.show(); } };

                const InteractivityHandler = {
                    init() {
                        const mainContent = document.getElementById('main-dashboard-content');
                        const modalIds = ['drilldownModal', 'expandChartModal', 'kpiGuideModal', 'docFormModal'];

                        modalIds.forEach(id => {
                            const modalEl = document.getElementById(id);
                            if (modalEl) {
                                // Add blur when any modal opens
                                modalEl.addEventListener('show.bs.modal', () => {
                                    mainContent.classList.add('dashboard-blur');
                                });

                                // Remove blur only if NO other modals are currently open (handles stacked modals)
                                modalEl.addEventListener('hidden.bs.modal', () => {
                                    const isAnyModalOpen = modalIds.some(mid => {
                                        const m = document.getElementById(mid);
                                        // Bootstrap adds the 'show' class to visible modals
                                        return m && m.classList.contains('show');
                                    });

                                    if (!isAnyModalOpen) {
                                        mainContent.classList.remove('dashboard-blur');
                                    }
                                });
                            }
                        });
                        const menu = document.getElementById('customContextMenu');
                        const tooltipEl = document.getElementById('custom-tooltip');
                        const drilldownModalEl = document.getElementById('drilldownModal');
                        const hideMenu = () => menu.style.display = 'none';
                        const hideTooltip = () => { if (tooltipEl) { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; } };
                        document.addEventListener('click', hideMenu);
                        document.addEventListener('keydown', e => e.key === 'Escape' && hideMenu());
                        document.body.addEventListener('contextmenu', e => { const target = e.target.closest('.context-menu-target'); if (target) { e.preventDefault(); this.showContextMenu(e, target.dataset.componentId); } });
                        document.body.addEventListener('click', e => {
                            const target = e.target.closest('.kpi-card');
                            if (target) initiateDrilldown(target.dataset.componentId);
                        });
                        tooltipEl.addEventListener('mouseenter', () => clearTimeout(tooltipHideTimer));
                        tooltipEl.addEventListener('mouseleave', () => { tooltipHideTimer = setTimeout(hideTooltip, 300); });
                        document.getElementById('drilldownFilterControls').addEventListener('change', e => { if (e.target.name === 'drilldownFilter') { const filterValue = e.target.value; document.getElementById('drilldownTbody').querySelectorAll('tr').forEach(row => { row.style.display = (filterValue === 'all' || row.dataset.status === filterValue) ? '' : 'none'; }); } });

                        drilldownModalEl.addEventListener('click', e => {
                            const row = e.target.closest('tr[data-doc-id]');
                            const configStr = drilldownModalEl.querySelector('.modal-body').dataset.docFormConfig;
                            if (row && configStr) {
                                const config = JSON.parse(configStr);
                                DocFormHandler.show(row.dataset.docId, config);
                            }
                        });

                        drilldownModalEl.addEventListener('hidden.bs.modal', () => {
                            const modalBody = drilldownModalEl.querySelector('.modal-body');
                            if (modalBody.dataset.docFormConfig) {
                                delete modalBody.dataset.docFormConfig;
                            }
                        });

                        document.getElementById('docFormModal').addEventListener('hidden.bs.modal', () => modals.drilldownModal.classList.remove('is-blurred'));
                        document.getElementById('expandChartModal').addEventListener('hidden.bs.modal', () => {
                            if (chartInstances['expandedChart']) {
                                chartInstances['expandedChart'].destroy();
                                chartInstances['expandedChart'] = null;
                            }
                        });
                    },
                    showContextMenu(event, componentId) {
                        const config = Utils.getComponentConfig(componentId);
                        const menu = document.getElementById('customContextMenu');
                        const menuList = document.getElementById('contextMenuList');
                        const componentActions = config?.actions || dashboardConfig.contextMenu.actions.map(a => a.id);
                        let actions = dashboardConfig.contextMenu.actions.filter(a => componentActions.includes(a.id) || a.type === 'separator');
                        const renderItems = items => items.map(a => a.type === 'separator' ? '<li class="context-menu-separator"></li>' : `<li class="context-menu-item" data-action="${a.id}"><i class="bi ${a.icon}"></i><span>${a.label}</span>${a.submenu ? `<i class="bi bi-chevron-right"></i><ul class="context-menu-sublist">${renderItems(a.submenu)}</ul>` : ''}</li>`).join('');
                        menuList.innerHTML = renderItems(actions);
                        menu.querySelectorAll('.context-menu-item').forEach(item => { if (!item.querySelector('.context-menu-sublist')) item.addEventListener('click', () => this.handleContextMenuAction(item.dataset.action, componentId)); });
                        menu.style.visibility = 'hidden';
                        menu.style.display = 'block';

                        const { offsetWidth: menuW, offsetHeight: menuH } = menu;
                        const { clientX: mouseX, clientY: mouseY } = event;
                        const { innerWidth: viewportW, innerHeight: viewportH } = window;
                        const padding = 5; // A small buffer from the viewport edge
                        let finalLeft = mouseX;
                        if ((mouseX + menuW + padding) > viewportW) {
                            finalLeft = mouseX - menuW; // Flip to the left of the cursor
                        }
                        let finalTop = mouseY;
                        if ((mouseY + menuH + padding) > viewportH) {
                            finalTop = mouseY - menuH; // Flip above the cursor
                        }
                        menu.style.left = `${finalLeft + window.scrollX}px`;
                        menu.style.top = `${finalTop + window.scrollY}px`;
                        menu.style.visibility = 'visible';
                    },
                    handleContextMenuAction(action, componentId) {
                        const config = Utils.getComponentConfig(componentId);
                        switch (action) {
                            case 'drilldown': initiateDrilldown(componentId); break;
                            case 'refresh': initialDataFetch(); break;
                            case 'expand': ExpandChartHandler.show(componentId); break;
                            case 'guide': if (config.guide) GuideHandler.show(config); break;
                            case 'share': window.location.href = `mailto:?subject=Dashboard Insight: ${config.label || config.title}&body=Review data for ${config.label || config.title}.`; break;
                            case 'export-png': const chart = chartInstances[componentId]; if (chart) { const a = document.createElement('a'); a.href = chart.toBase64Image(); a.download = `${componentId}.png`; a.click(); } break;
                            default: alert(`Action '${action}' is not yet implemented.`);
                        }
                    },

                    customTooltip(context) {
                        const { chart, tooltip } = context;
                        const tooltipEl = document.getElementById('custom-tooltip');
                        clearTimeout(tooltipHideTimer);
                        if (tooltip.opacity === 0) { tooltipHideTimer = setTimeout(() => { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; }, 300); return; }

                        const titleEl = tooltipEl.querySelector('.tooltip-main-title');
                        const headerEl = tooltipEl.querySelector('.tooltip-header');
                        const valueEl = tooltipEl.querySelector('.tooltip-value');
                        const seriesTitleEl = tooltipEl.querySelector('.tooltip-title');
                        const deltaEl = tooltipEl.querySelector('.tooltip-delta');
                        const footerEl = tooltipEl.querySelector('.tooltip-footer');

                        // Reset common elements
                        headerEl.style.display = 'flex';
                        deltaEl.style.display = 'none';
                        footerEl.style.display = 'none';

                        if (chart.canvas.id.startsWith('pareto')) {
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            headerEl.style.display = 'none';
                            valueEl.textContent = '';
                            const footerContent = tooltip.dataPoints.map(dp => {
                                const isPercentage = dp.dataset.label.includes('%');
                                const value = isPercentage ? `${dp.raw.toFixed(1)}%` : Utils.formatMetric(dp.raw);
                                return `<div class="footer-row"><span>${dp.dataset.label}</span><span>${value}</span></div>`;
                            }).join('');
                            footerEl.innerHTML = footerContent;
                            footerEl.style.display = 'flex';
                        } else { // Default handler for bar, line, doughnut, radar etc.
                            const dp = tooltip.dataPoints[0];
                            if (!dp) return;
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            seriesTitleEl.textContent = dp.dataset.label || '';
                            valueEl.textContent = Utils.formatMetric(dp.raw);
                            const prev = dp.dataIndex > 0 ? chart.data.datasets[dp.datasetIndex].data[dp.dataIndex - 1] : null;
                            if (prev !== null && prev !== 0 && typeof dp.raw === 'number') { const change = ((dp.raw - prev) / prev) * 100, isPos = change >= 0; deltaEl.className = `tooltip-delta ${isPos ? 'positive' : 'negative'}`; deltaEl.innerHTML = `<i class="bi ${isPos ? 'bi-arrow-up' : 'bi-arrow-down'}"></i> ${Math.abs(change).toFixed(1)}%`; deltaEl.style.display = 'flex'; }
                            const footerContent = chart.data.datasets.map((ds, i) => i !== dp.datasetIndex && ds.data[dp.dataIndex] !== undefined ? `<div class="footer-row"><span>${ds.label}</span><span>${Utils.formatMetric(ds.data[dp.dataIndex])}</span></div>` : null).filter(Boolean);
                            if (footerContent.length > 0) { footerEl.innerHTML = footerContent.join(''); footerEl.style.display = 'flex'; }
                        }

                        tooltipEl.querySelector('.drilldown-btn').onclick = () => initiateDrilldown(chart.canvas.id, { dataIndex: tooltip.dataPoints[0].dataIndex });
                        const canvasRect = chart.canvas.getBoundingClientRect();
                        tooltipEl.style.opacity = 1;
                        tooltipEl.style.pointerEvents = 'all';
                        tooltipEl.style.left = (canvasRect.left + window.scrollX + tooltip.caretX) + 'px';
                        tooltipEl.style.top = (canvasRect.top + window.scrollY + tooltip.caretY) + 'px';
                    }
                };

                const Utils = {
                    formatMetric(value, format, suffix = '') {
                        if (value === null || value === undefined) return 'N/A';

                        if (format === 'currency_compact') {
                            if (Math.abs(value) >= 10000000) { // Crore
                                return (value / 10000000).toFixed(2) + ' Cr';
                            }
                            if (Math.abs(value) >= 100000) { // Lakh
                                return (value / 100000).toFixed(2) + ' L';
                            }
                            if (Math.abs(value) >= 1000) { // Thousand
                                return (value / 1000).toFixed(1) + ' K';
                            }
                            return new Intl.NumberFormat('en-IN').format(value);
                        }

                        if (format === 'currency') {
                            return new Intl.NumberFormat('en-IN', {
                                style: 'currency',
                                currency: 'INR',
                                minimumFractionDigits: 0,
                                maximumFractionDigits: 0
                            }).format(value);
                        }
                        if (format === 'date') return new Date(value).toLocaleString('en-GB');
                        if (typeof value === 'number') return value.toLocaleString('en-US');
                        return `${value}${suffix}`;
                    }, hexToRgb(hex) {
                        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
                        return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
                    },
                    getComponentConfig: (id) => dashboardConfig.kpis.find(c => c.id === id) || dashboardConfig.layout.find(c => c.config.id === id)?.config,
                    // --- ADDED: Shared deepMerge utility ---
                    deepMerge(target, source) {
                        const isObject = (obj) => obj && typeof obj === 'object' && !Array.isArray(obj);
                        let output = { ...target };
                        if (isObject(target) && isObject(source)) {
                            Object.keys(source).forEach(key => {
                                if (isObject(source[key])) {
                                    if (key in target) {
                                        output[key] = this.deepMerge(target[key], source[key]);
                                    } else {
                                        Object.assign(output, { [key]: source[key] });
                                    }
                                } else {
                                    Object.assign(output, { [key]: source[key] });
                                }
                            });
                        }
                        return output;
                    }
                };

                const ConfigValidator = {
                    validate(config) {
                        if (!config.title) throw new Error("`title` is missing.");
                        if (!Array.isArray(config.kpis)) throw new Error("`kpis` must be an array.");
                        if (!Array.isArray(config.layout)) throw new Error("`layout` must be an array.");
                        config.kpis.forEach((kpi, i) => {
                            if (!kpi.id || !kpi.dataKey || !kpi.label) throw new Error(`KPI at index ${i} is missing required keys (id, dataKey, label).`);
                        });
                        config.layout.forEach((item, i) => {
                            if (!item.type || !item.width || !item.config) throw new Error(`Layout item at index ${i} is missing required keys (type, width, config).`);
                            const chartConfig = item.config;
                            if (chartConfig.drilldownConfig && !Array.isArray(chartConfig.drilldownConfig.columns)) {
                                throw new Error(`Drilldown config for chart '${chartConfig.id}' is missing a 'columns' array.`);
                            }
                            if (typeof chartConfig.transformer !== 'function' && !SharedTransformers[chartConfig.transformer]) {
                                throw new Error(`Transformer for chart '${chartConfig.id}' must be a function or a key in SharedTransformers.`);
                            }
                        });
                    }
                };

                return { init };
            })();
            // Initialize the application
            APP_CORE.init();
        })();
    </script>
</body>

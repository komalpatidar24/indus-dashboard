    <script>

        const dashboardApp = (function () {

            const Utils = {
                formatMetric(value, format, suffix = '') {
                    if (value === null || value === undefined) return 'N/A';

                    if (format === 'currency_compact') {
                        if (Math.abs(value) >= 10000000) { // Crore
                            return (value / 10000000).toFixed(2) + ' Cr';
                        }
                        if (Math.abs(value) >= 100000) { // Lakh
                            return (value / 100000).toFixed(2) + ' L';
                        }
                        if (Math.abs(value) >= 1000) { // Thousand
                            return (value / 1000).toFixed(1) + ' K';
                        }
                        return value.toLocaleString('en-US');
                    }

                    if (format === 'currency') return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(value);
                    if (format === 'date') return new Date(value).toLocaleString('en-GB');
                    if (typeof value === 'number') return value.toLocaleString('en-US');
                    return `${value}${suffix}`;
                }, hexToRgb(hex) {
                    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
                    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
                },
                getComponentConfig: (id, dashboardConfig) => dashboardConfig.kpis.find(c => c.id === id) || dashboardConfig.layout.find(c => c.config.id === id)?.config,

                // --- ADDED: Shared deepMerge utility ---
                deepMerge(target, source) {
                    const isObject = (obj) => obj && typeof obj === 'object' && !Array.isArray(obj);
                    let output = { ...target };
                    if (isObject(target) && isObject(source)) {
                        Object.keys(source).forEach(key => {
                            if (isObject(source[key])) {
                                if (key in target) {
                                    output[key] = this.deepMerge(target[key], source[key]);
                                } else {
                                    Object.assign(output, { [key]: source[key] });
                                }
                            } else {
                                Object.assign(output, { [key]: source[key] });
                            }
                        });
                    }
                    return output;
                }
            };
            // ========================================================================================================
            // SECTION 1: CONFIGURATION (THE ONLY PART TO EDIT FOR A NEW DASHBOARD)
            // This section simulates `config.js`.
            // ========================================================================================================
            const CONFIGURATION = (() => {
                /**
                 * HOW TO USE THIS TEMPLATE:
                 * 1.  Update `dashboardTitle` with the title for your dashboard.
                 * 2.  Define your Key Performance Indicators (KPIs) in the `kpiConfig` array.
                 * 3.  Define your chart layout and configurations in the `layoutConfig` array.
                 * 4.  Update the `DATA_PROVIDER` section to connect to your live backend API.
                 * 5.  Ensure your data provider returns data objects with keys that match the `dataKey` properties defined here.
                 */
                const kpiConfig = [
                    {
                        id: 'kpi-inventory-value',
                        dataKey: 'total_inventory_value',
                        label: 'Total Inventory Value (₹)',
                        format: 'currency_compact',
                        cssVar: '--glow-green',
                        secondaryMetrics: [
                            // --- START: ADDED METRIC ---
                            { icon: 'bi-rulers', dataKey: 'rm_paper_mt', label: 'RM (MT)', format: 'number' },
                            // --- END: ADDED METRIC ---
                            { icon: 'bi-box-seam', dataKey: 'raw_material_value', label: 'Other RM', format: 'currency_compact' },
                            { icon: 'bi-boxes', dataKey: 'finished_goods_value', label: 'Consumables', format: 'currency_compact' }
                        ],
                        guide: { title: 'Total Inventory Value', definition: 'The total monetary value of all inventory items, including raw materials, work-in-progress, and finished goods.', interpretation: 'Indicates the capital tied up in inventory. A high value may suggest overstocking, while a low value could risk stockouts.', calculation: 'Sum of (Item Quantity * Item Cost) for all items.' },
                        drilldownConfig: {
                            dataKey: 'inventory_details',
                            columns: [
                                { key: 'item_id', label: 'Item ID' }, { key: 'category', label: 'Category' }, { key: 'location', label: 'Location' }, { key: 'quantity', label: 'Quantity' }, { key: 'value', label: 'Value (₹)', format: 'currency' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-slow-non-moving',
                        dataKey: 'slow_non_moving_pct',
                        label: 'Slow & Non-Moving Stock %',
                        valueSuffix: '%',
                        cssVar: '--glow-orange',
                        invertGrowthColor: true,
                        secondaryMetrics: [
                            { icon: 'bi-hourglass-split', dataKey: 'slow_moving_value', label: 'Slow', format: 'currency_compact' },
                            { icon: 'bi-hourglass-bottom', dataKey: 'non_moving_value', label: 'Non-moving', format: 'currency_compact' }
                        ],
                        guide: { title: 'Slow & Non-Moving Stock %', definition: 'The percentage of total inventory value that has not been used or sold for an extended period. Slow-moving is 2-6 months; Non-moving is over 6 months.', interpretation: 'A high percentage indicates poor inventory turnover, obsolescence risk, and tied-up capital.', calculation: '((Value of Slow + Non-Moving Stock) / Total Inventory Value) * 100.' },
                        drilldownConfig: {
                            dataKey: 'slow_moving_stock_details',
                            columns: [
                                { key: 'item_id', label: 'Item ID' }, { key: 'last_moved_date', label: 'Last Moved', format: 'date' }, { key: 'age_in_days', label: 'Age (Days)' }, { key: 'value', label: 'Value (₹)', format: 'currency' }, { key: 'status', label: 'Status' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-dead-stock',
                        dataKey: 'dead_stock_pct',
                        label: 'Dead Stock %',
                        valueSuffix: '%',
                        cssVar: '--glow-lightblue',
                        invertGrowthColor: true,
                        secondaryMetrics: [
                            { icon: 'bi-trash', dataKey: 'expired_stock_value', label: 'Expired Value', format: 'currency_compact' },
                            { icon: 'bi-calendar-x', dataKey: 'expired_skus', label: 'Expired SKUs' }
                        ],
                        guide: { title: 'Dead/Expired Stock %', definition: 'The percentage of total inventory value that is unsellable due to expiration or obsolescence.', interpretation: 'Represents a direct financial loss and inefficient inventory management. A key metric to minimize.', calculation: '(Value of Expired Stock / Total Inventory Value) * 100.' },
                        drilldownConfig: {
                            dataKey: 'expired_stock_details',
                            columns: [
                                { key: 'item_id', label: 'Item ID' }, { key: 'expiry_date', label: 'Expiry Date', format: 'date' }, { key: 'days_past_expiry', label: 'Days Expired' }, { key: 'value', label: 'Value (₹)', format: 'currency' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-grn-delayed',
                        dataKey: 'grn_delayed_pct',
                        label: 'GRN Delayed Clearance %',
                        valueSuffix: '%',
                        cssVar: '--glow-red',
                        invertGrowthColor: true,
                        secondaryMetrics: [
                            { icon: 'bi-file-earmark-text', dataKey: 'delayed_grn_count', label: 'Delayed GRNs' },
                            { icon: 'bi-clock-history', dataKey: 'avg_delay_days', label: 'Avg Delay (Days)' }
                        ],
                        guide: { title: 'GRN Delayed Clearance %', definition: 'The percentage of Goods Receipt Notes (GRNs) that are not processed and cleared within the standard timeframe (e.g., 48 hours).', interpretation: 'Indicates inefficiencies in the receiving and quality inspection process, which can delay payments and stock availability.', calculation: '(Number of Delayed GRNs / Total Number of GRNs) * 100.' },
                        drilldownConfig: {
                            dataKey: 'grn_records',
                            columns: [
                                { key: 'grn_id', label: 'GRN ID' }, { key: 'vendor', label: 'Vendor' }, { key: 'status', label: 'Status' }, { key: 'delay_days', label: 'Delay (Days)' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-interunit-transfer',
                        dataKey: 'interunit_transfer_volume',
                        label: 'Inter-Unit Transfer Volume',
                        isCurrency: false,
                        cssVar: '--glow-purple',
                        secondaryMetrics: [
                            { icon: 'bi-truck', dataKey: 'transfer_count', label: 'Transfers' },
                            { icon: 'bi-geo-alt', dataKey: 'unique_routes', label: 'Routes' }
                        ],
                        guide: { title: 'Inter-Unit Transfer Volume', definition: 'The total quantity of items transferred between different business units, warehouses, or locations.', interpretation: 'Measures the internal movement of stock. High volume may indicate efficient load balancing or, conversely, poor initial stock allocation.', calculation: 'Sum of quantities for all completed interunit transfers.' },
                        drilldownConfig: {
                            dataKey: 'interunit_transfer_records',
                            columns: [
                                { key: 'transfer_id', label: 'Transfer ID' }, { key: 'from_unit', label: 'From' }, { key: 'to_unit', label: 'To' }, { key: 'item_name', label: 'Item' }, { key: 'quantity', label: 'Quantity' }
                            ]
                        }
                    }
                ];

                const layoutConfig = [
                    {
                        type: 'dx-widget', width: 'col-lg-4',
                        config: {
                            id: 'po-to-grn-funnel',
                            widgetType: 'dxFunnel',
                            title: 'PO to GRN Funnel',
                            dataKey: 'po_to_grn_funnel_data',
                            hasFilter: true,
                            filterOptions: [
                                { value: 'all', label: 'All Categories' },
                                { value: 'paper_reel', label: 'Paper + Reel' },
                                { value: 'plates', label: 'Plates' },
                                { value: 'inks', label: 'Inks' },
                                { value: 'requirement_consumables', label: 'Consumables' },
                                { value: 'binding_material', label: 'Binding Material' },
                                { value: 'packing_material', label: 'Packing Material' },
                                { value: 'stock_item', label: 'Stock Item' }
                            ],
                            drilldownConfig: {
                                dataKey: 'funnel_drilldown_details',
                                filterMapping: 'stage',
                                columns: [
                                    { key: 'po_no', label: 'PO Number' },
                                    { key: 'po_date', label: 'PO Date', format: 'date' },
                                    { key: 'vendor', label: 'Vendor Name' },
                                    { key: 'item', label: 'Item Description' },
                                    { key: 'ordered_qty', label: 'Ordered Quantity' },
                                    { key: 'inward_qty', label: 'Inwarded Quantity' },
                                    { key: 'qc_status', label: 'QC Status' },
                                    { key: 'weight', label: 'Weight (MT)', valueSuffix: ' MT' },
                                    { key: 'tech_name', label: 'QC Lab Tech Name' },
                                    { key: 'release_date', label: 'Expected Release Date', format: 'date' },
                                    { key: 'grn_no', label: 'GRN Number' },
                                    { key: 'lead_time', label: 'Lead Time', valueSuffix: ' Days' }
                                ]
                            },
                            transformer: (data) => data,
                            options: {
                                dataSource: [],
                                argumentField: 'stage',
                                valueField: 'count',
                                palette: ['#023859', '#26658C', '#54ACBF', '#A7EBF2'], // Reverted to 4 stages palette
                                tooltip: { enabled: true, format: "fixedPoint" },
                                item: { border: { visible: true } },
                                label: {
                                    visible: true,
                                    position: "inside",
                                    backgroundColor: "none",
                                    font: { color: "#ffffff" },
                                    customizeText: function (arg) {
                                        // Format: "1,250 PO ₹12.5 Cr" (count before stage, value after)
                                        const count = arg.value.toLocaleString('en-US'); // arg.value now refers to the 'value' field
                                        const stageName = arg.item.argument;
                                        const value = arg.item.data.value; // Access the original value from data object

                                        // Format currency value
                                        let formattedValue = '';
                                        if (value === null || value === undefined) {
                                            formattedValue = 'N/A';
                                        } else if (Math.abs(value) >= 10000000) { // Crore
                                            formattedValue = '₹' + (value / 10000000).toFixed(2) + ' Cr';
                                        } else if (Math.abs(value) >= 100000) { // Lakh
                                            formattedValue = '₹' + (value / 100000).toFixed(2) + ' L';
                                        } else if (Math.abs(value) >= 1000) { // Thousand
                                            formattedValue = '₹' + (value / 1000).toFixed(1) + ' K';
                                        } else {
                                            formattedValue = '₹' + value.toLocaleString('en-US');
                                        }

                                        return count + ' ' + stageName + ' ' + formattedValue;
                                    }
                                },
                                title: { text: "Purchase Order Process Flow", horizontalAlignment: 'left', font: { size: 14, color: '#6c757d' } }
                            }
                        }
                    },
                    {
                        type: 'chart', width: 'col-lg-4',
                        config: {
                            id: 'inventory-by-category',
                            chartType: 'pie',
                            title: 'Inventory Value by Category',
                            dataKey: 'inventory_by_category',
                            transformer: (data) => ({
                                labels: data.map(d => d.category),
                                datasets: [{
                                    data: data.map(d => d.value),
                                    backgroundColor: ['#023859', '#26658C', '#54ACBF', '#A7EBF2', '#004c4c', '#008080', '#66b2b2', '#b3cde0', '#6497b1']
                                }]
                            }),
                            options: {
                                plugins: {
                                    legend: { position: 'right' },
                                    centerText: { display: false },
                                    datalabels: {

                            }
                            // Subscribe to category filter changes for charts

                                StateManager.subscribe(`${item.config.id}_category_filter`, () => ChartHandler.render(item.config));

                            // Subscribe to toggle changes for charts

                };
                function renderKpis() {

                        const data = kpiData[config.dataKey];

                        const container = document.getElementById(`shell-${config.id}`);

                        const isGood = config.invertGrowthColor ? !isPositiveGrowth : isPositiveGrowth;

                        // --- LOGIC CORRECTION & ENHANCEMENT ---

                    </div>
                    <div class="kpi-secondary-metrics">
                        ${config.secondaryMetrics.map(sm => `<div class="metric-item"><i class="bi ${sm.icon}"></i><span>${sm.label ? sm.label + ': ' : ''}${Utils.formatMetric(data[sm.dataKey], sm.format)}</span></div>`).join('')}
                    </div>

                function renderSparkline(id, data, colorVarName) {
                    const ctx = document.getElementById(`sparkline-${id}`)?.getContext('2d');
                    if (!ctx) return;

                    const trendColor = getComputedStyle(document.documentElement).getPropertyValue(colorVarName).trim();
                    const trendColorRGB = Utils.hexToRgb(trendColor);

                    if (!trendColorRGB) {
                        console.error(`Invalid color format or CSS variable not found for: ${colorVarName}`);
                        return;
                    }

                    const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
                    // MODIFIED: Implemented a 3-stop gradient for a darker top that fades out.
                    gradient.addColorStop(0, `rgba(${trendColorRGB}, 0.45)`);  // Darker start color near the line
                    gradient.addColorStop(0.4, `rgba(${trendColorRGB}, 0.1)`);   // Fade significantly by 40% height
                    gradient.addColorStop(1, `rgba(${trendColorRGB}, 0)`);      // Fully transparent at the bottom

                    if (chartInstances[id]) chartInstances[id].destroy();

                    chartInstances[id] = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.map(() => ''),
                            datasets: [{
                                data: data,
                                borderColor: trendColor,
                                borderWidth: 2,
                                fill: true,
                                backgroundColor: gradient,
                                tension: 0.4,
                                pointRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: { x: { display: false }, y: { display: false } },
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },
                            layout: {
                                padding: 0
                            }
                        }
                    });
                }
                const ChartHandler = {
                    render(config) {
                        const container = document.getElementById(`container-${config.id}`);
                        if (!container) return; // Exit if container not found
                        const canvasContainer = container.querySelector('.chart-canvas-container');
                        const feedbackEl = canvasContainer.querySelector('.chart-feedback-overlay');
                        try {
                            const ctx = canvasContainer.querySelector('canvas')?.getContext('2d');
                            if (!ctx) throw new Error(`Canvas with id '${config.id}' not found.`);
                            const rawData = StateManager.getState(config.dataKey);
                            if (!rawData) { return; }
                            const periodIndex = StateManager.getState('selectedPeriodIndex');

                            // Get filter value if hasFilter is enabled
                            let filterValue = null;
                            if (config.hasFilter) {
                                filterValue = StateManager.getState(`${config.id}_category_filter`) || (config.filterOptions?.[0]?.value || null);
                            }
                            // Get toggle value if hasToggle is enabled
                            let toggleValue = null;
                            if (config.hasToggle) {
                                toggleValue = StateManager.getState(`${config.id}_toggle`) || (config.toggleOptions?.[0]?.value || null);
                            }

                            let transformer;
                            if (typeof config.transformer === 'function') {
                                transformer = config.transformer;
                            } else if (typeof config.transformer === 'string' && SharedTransformers[config.transformer]) {
                                transformer = SharedTransformers[config.transformer];
                            } else {
                                throw new Error(`Transformer '${config.transformer}' is not a valid function or a key in SharedTransformers.`);
                            }
                            // Pass filter and toggle values to transformer
                            const data = transformer(rawData, filterValue || periodIndex, { ...config, toggleValue });
                            if (chartInstances[config.id]) chartInstances[config.id].destroy();

                            let finalOptions = ChartDefaults.getChartOptions(config);

                            // MODIFICATION START: Dynamically add onClick for drilldown
                            if (config.drilldownConfig) {
                                finalOptions.onClick = (e, elements) => {
                                    if (elements.length > 0) {
                                        const dataIndex = elements[0].index;
                                        initiateDrilldown(config.id, { dataIndex });
                                    }
                                };
                            } else if (config.onClickAction && ActionRegistry[config.onClickAction]) {
                                finalOptions.onClick = ActionRegistry[config.onClickAction];
                            }
                            // MODIFICATION END

                            if (config.chartType === 'doughnut') {
                                const total = data.datasets[0].data.reduce((a, b) => a + b, 0);
                                if (finalOptions.plugins.centerText) {
                                    finalOptions.plugins.centerText.text = Utils.formatMetric(total, 'currency_compact');
                                }
                                finalOptions.onHover = (event, elements, chart) => {
                                    const centerText = chart.config.options.plugins.centerText;
                                    if (elements.length > 0) {
                                        const index = elements[0].index;
                                        centerText.text = Utils.formatMetric(chart.data.datasets[0].data[index], 'currency_compact');
                                        centerText.label = chart.data.labels[index];
                                    } else {
                                        centerText.text = Utils.formatMetric(total, 'currency_compact');
                                        centerText.label = 'Total Value';
                                    }
                                    chart.update('none');
                                };
                            }
                            if (feedbackEl) feedbackEl.remove();
                            chartInstances[config.id] = new Chart(ctx, { type: config.chartType, data, options: finalOptions });
                        } catch (error) {
                            console.error(`Failed to render chart '${config.id}':`, error);
                            this.renderErrorState(canvasContainer, error);
                        }
                    },
                    renderErrorState(container, error) {
                        container.innerHTML = `<div class="chart-feedback-overlay"><i class="bi bi-exclamation-triangle-fill"></i><strong>Chart Failed to Load</strong><small class="mt-1">${error.message}</small></div>`;
                    }

                const DrilldownService = {
                    show(title, columns, dataRows, filters, docFormConfig) {
                        const filterControls = document.getElementById('drilldownFilterControls');
                        const modalBody = document.getElementById('drilldownModalBody');

                        if (docFormConfig) {
                            modalBody.dataset.docFormConfig = JSON.stringify(docFormConfig);

                            delete modalBody.dataset.docFormConfig;
                        }

                        if (filters) {
                            filterControls.innerHTML = filters.map(opt => `<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="drilldownFilter" id="filter_${opt.value}" value="${opt.value}" ${opt.default ? 'checked' : ''}><label class="form-check-label small" for="filter_${opt.value}">${opt.label}</label></div>`).join('');
                        } else {
                            filterControls.innerHTML = '';
                        }

                        const headers = columns.map(c => `<th>${c.label}</th>`).join('');
                        const rows = dataRows.map(row => `<tr data-doc-id="${row.id}" data-status="${row.status}">${columns.map(col => `<td>${Utils.formatMetric(row[col.key], col.format)}</td>`).join('')}</tr>`).join('');

                        document.getElementById('drilldownModalLabel').textContent = title;
                        modalBody.innerHTML = `<div class="table-responsive"><table class="table table-hover"><thead id="drilldownThead"><tr>${headers}</tr></thead><tbody id="drilldownTbody">${rows}</tbody></table></div>`;
                        modals.drilldownModal.show();
                    },
                    showPlaceholder(title, message) {
                        document.getElementById('drilldownModalLabel').textContent = `Details for ${title}`;
                        document.getElementById('drilldownModalBody').innerHTML = `<p class="p-3">${message}</p>`;
                        modals.drilldownModal.show();
                    }
                };

                // --- ADDED: New orchestrator function for all drilldown actions ---
                function initiateDrilldown(componentId, context = {}) {
                    const config = Utils.getComponentConfig(componentId, dashboardConfig);

                    // 1. Handle redirection if the component has a specific drilldown target
                    if (config.drilldownTarget && !context.dataIndex && !context.customLabel) {
                        return initiateDrilldown(config.drilldownTarget);
                    }

                    const drilldownConfig = config?.drilldownConfig;
                    if (!drilldownConfig) {
                        return DrilldownService.showPlaceholder(config.label || config.title, `No drilldown configured.`);
                    }

                    const { dataKey, columns, filters, docFormConfig, filterMapping, filterPredicate } = drilldownConfig;
                    let title = `Detailed View: ${config.label || config.title}`;
                    const rawData = StateManager.getState(dataKey);

                    if (!rawData || !Array.isArray(rawData)) {
                        return DrilldownService.showPlaceholder(title, `No detailed data available for key: ${dataKey}`);
                    }

                    let filteredData = [...rawData];

                    // 2. Apply general predicates if defined
                    if (filterPredicate && typeof filterPredicate === 'function') {
                        filteredData = rawData.filter(filterPredicate);
                    }

                    // 3. Extract label from context (Handles Funnel, Tooltip clicks, and Context Menu)
                    let label = context.customLabel;

                    if (context.dataIndex !== undefined) {
                        const chart = chartInstances[componentId];
                        if (chart && chart.data.labels && chart.data.labels[context.dataIndex] !== undefined) {
                            label = chart.data.labels[context.dataIndex];
                        }
                    }

                    // 4. Robust Filtering (SOLVES THE "EMPTY DATA" PROBLEM)
                    // Inside initiateDrilldown function...

                    // Inside initiateDrilldown function...

                    // Inside initiateDrilldown function, find the filter logic and update it:
                    // Find this inside the initiateDrilldown function
                    if (label && filterMapping) {
                        const targetLabel = String(label).trim().toLowerCase();
                        title += ` (${label})`;

                        filteredData = rawData.filter(item => {
                            // Standard matching (Category, Warehouse, etc.)
                            const itemValue = item[filterMapping];
                            if (itemValue !== undefined && itemValue !== null) {
                                if (String(itemValue).trim().toLowerCase() === targetLabel) return true;
                            }

                            // SPECIAL CASE: For Top Transfers where the label is "From - To"
                            // If the direct mapping failed, we check if from_unit and to_unit are inside the label
                            if (item.from_unit && item.to_unit) {
                                const combinedRoute = `${item.from_unit} - ${item.to_unit}`.toLowerCase();
                                if (combinedRoute === targetLabel) return true;
                            }

                            return false;
                        });
                    }
                    // 5. Show the report
                    DrilldownService.show(title, columns, filteredData, filters, docFormConfig);
                }

                const DocFormHandler = {

                const ExpandChartHandler = {

                        const isKpiCard = dashboardConfig.kpis.some(k => k.id === componentId);
                        if (isKpiCard) {

                const GuideHandler = { show(kpiConfig) { if (!kpiConfig?.guide) { alert('No guide available for this KPI.'); return; } const { title, definition, interpretation, calculation } = kpiConfig.guide; document.getElementById('kpiGuideModalLabel').textContent = `Guide: ${title}`; document.getElementById('guide-definition').textContent = definition; document.getElementById('guide-interpretation').textContent = interpretation; document.getElementById('guide-calculation').textContent = calculation; modals.kpiGuideModal.show(); } };

                const InteractivityHandler = {
                    init() {
                        const mainContent = document.getElementById('main-dashboard-content');
                        const modalIds = ['drilldownModal', 'expandChartModal', 'kpiGuideModal', 'docFormModal'];

                        modalIds.forEach(id => {
                            const modalEl = document.getElementById(id);
                            if (modalEl) {
                                // Add blur when any modal opens
                                modalEl.addEventListener('show.bs.modal', () => {
                                    mainContent.classList.add('dashboard-blur');
                                });
                                const menu = document.getElementById('customContextMenu');
                                const hideMenu = () => menu.style.display = 'none';

                                document.addEventListener('click', hideMenu);
                                document.addEventListener('keydown', e => e.key === 'Escape' && hideMenu());

                                document.body.addEventListener('contextmenu', e => {
                                    const target = e.target.closest('.context-menu-target');
                                    if (target) {
                                        e.preventDefault();
                                        this.showContextMenu(e, target.dataset.componentId);
                                    }
                                });

                                // Remove blur only if NO other modals are currently open (handles stacked modals)
                                modalEl.addEventListener('hidden.bs.modal', () => {
                                    const isAnyModalOpen = modalIds.some(mid => {
                                        const m = document.getElementById(mid);
                                        // Bootstrap adds the 'show' class to visible modals
                                        return m && m.classList.contains('show');
                                    });

                                    if (!isAnyModalOpen) {
                                        mainContent.classList.remove('dashboard-blur');
                                    }
                                });
                            }
                        });
                        const menu = document.getElementById('customContextMenu');
                        const tooltipEl = document.getElementById('custom-tooltip');
                        const drilldownModalEl = document.getElementById('drilldownModal');
                        const hideMenu = () => menu.style.display = 'none';
                        const hideTooltip = () => { if (tooltipEl) { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; } };
                        document.addEventListener('click', hideMenu);
                        document.addEventListener('keydown', e => e.key === 'Escape' && hideMenu());
                        document.body.addEventListener('contextmenu', e => { const target = e.target.closest('.context-menu-target'); if (target) { e.preventDefault(); this.showContextMenu(e, target.dataset.componentId); } });
                        document.body.addEventListener('click', e => {
                            const target = e.target.closest('.kpi-card');
                            if (target) initiateDrilldown(target.dataset.componentId);
                        });
                        tooltipEl.addEventListener('mouseenter', () => clearTimeout(tooltipHideTimer));
                        tooltipEl.addEventListener('mouseleave', () => { tooltipHideTimer = setTimeout(hideTooltip, 300); });
                        document.getElementById('drilldownFilterControls').addEventListener('change', e => { if (e.target.name === 'drilldownFilter') { const filterValue = e.target.value; document.getElementById('drilldownTbody').querySelectorAll('tr').forEach(row => { row.style.display = (filterValue === 'all' || row.dataset.status === filterValue) ? '' : 'none'; }); } });

                        // --- FIX: Add delegated event listener for drilldown table rows ---
                        drilldownModalEl.addEventListener('click', e => {
                            const row = e.target.closest('tr[data-doc-id]');
                            const configStr = drilldownModalEl.querySelector('.modal-body').dataset.docFormConfig;
                            if (row && configStr) {
                                const config = JSON.parse(configStr);
                                DocFormHandler.show(row.dataset.docId, config);
                            }
                        });

                        drilldownModalEl.addEventListener('hidden.bs.modal', () => {
                            const modalBody = drilldownModalEl.querySelector('.modal-body');
                            if (modalBody.dataset.docFormConfig) {
                                delete modalBody.dataset.docFormConfig;
                            }
                        });

                        document.getElementById('docFormModal').addEventListener('hidden.bs.modal', () => modals.drilldownModal.classList.remove('is-blurred'));
                        document.getElementById('expandChartModal').addEventListener('hidden.bs.modal', () => {
                            if (chartInstances['expandedChart']) {
                                chartInstances['expandedChart'].destroy();
                                chartInstances['expandedChart'] = null;
                            }
                        });
                    },
                    showContextMenu(event, componentId) {
                        const menu = document.getElementById('customContextMenu');
                        const menuList = document.getElementById('contextMenuList');
                        const actions = dashboardConfig.contextMenu.actions;

                        // This helper function handles submenus (the arrows) and separators
                        const renderItems = (items) => items.map(a =>
                            a.type === 'separator' ? '<li class="context-menu-separator"></li>' :
                                `<li class="context-menu-item" data-action="${a.id}">
            <i class="bi ${a.icon}"></i>
            <span>${a.label}</span>
            ${a.submenu ? `<i class="bi bi-chevron-right ms-auto"></i><ul class="context-menu-sublist">${renderItems(a.submenu)}</ul>` : ''}
        </li>`
                        ).join('');

                        menuList.innerHTML = renderItems(actions);

                        // Add click listeners (ignoring items that just open submenus)
                        menu.querySelectorAll('.context-menu-item').forEach(item => {
                            if (!item.querySelector('.context-menu-sublist')) {
                                item.addEventListener('click', () => this.handleContextMenuAction(item.dataset.action, componentId));
                            }
                        });

                        menu.style.display = 'block';
                        const { offsetWidth: menuW, offsetHeight: menuH } = menu;
                        let left = event.clientX, top = event.clientY;

                        if (left + menuW > window.innerWidth) left -= menuW;
                        if (top + menuH > window.innerHeight) top -= menuH;

                        menu.style.left = `${left + window.scrollX}px`;
                        menu.style.top = `${top + window.scrollY}px`;
                    },
                    handleContextMenuAction(action, componentId) {
                        const config = Utils.getComponentConfig(componentId, dashboardConfig);
                        switch (action) {
                            case 'drilldown': initiateDrilldown(componentId); break;
                            case 'expand': ExpandChartHandler.show(componentId); break;
                            case 'guide': if (config.guide) GuideHandler.show(config); break;
                            case 'refresh': location.reload(); break;
                            case 'share':
                                const subject = encodeURIComponent(`Dashboard Insight: ${config.label || config.title}`);
                                window.location.href = `mailto:?subject=${subject}&body=Check out the latest data for ${config.label || config.title}.`;
                                break;
                            case 'ai-insight':
                                alert("AI Insight: Generating automated analysis for " + (config.label || config.title) + "...");
                                break;
                            case 'export-png':
                                const chart = chartInstances[componentId];
                                if (chart) {
                                    const a = document.createElement('a');
                                    a.href = chart.toBase64Image();
                                    a.download = `${componentId}.png`;
                                    a.click();
                                }
                                break;
                        }
                    },

                    customTooltip(context) {
                        const { chart, tooltip } = context;
                        const tooltipEl = document.getElementById('custom-tooltip');
                        clearTimeout(tooltipHideTimer);
                        if (tooltip.opacity === 0) { tooltipHideTimer = setTimeout(() => { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; }, 300); return; }

                        const titleEl = tooltipEl.querySelector('.tooltip-main-title');
                        const headerEl = tooltipEl.querySelector('.tooltip-header');
                        const valueEl = tooltipEl.querySelector('.tooltip-value');
                        const seriesTitleEl = tooltipEl.querySelector('.tooltip-title');
                        const deltaEl = tooltipEl.querySelector('.tooltip-delta');
                        const footerEl = tooltipEl.querySelector('.tooltip-footer');

                        // Reset common elements
                        headerEl.style.display = 'flex';
                        deltaEl.style.display = 'none';
                        footerEl.style.display = 'none';

                        // --- FIX: Changed chart.config.id to chart.canvas.id ---
                        if (chart.canvas.id.startsWith('pareto')) {
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            headerEl.style.display = 'none';
                            valueEl.textContent = '';
                            const footerContent = tooltip.dataPoints.map(dp => {
                                const isPercentage = dp.dataset.label.includes('%');
                                const value = isPercentage ? `${dp.raw.toFixed(1)}%` : Utils.formatMetric(dp.raw);
                                return `<div class="footer-row"><span>${dp.dataset.label}</span><span>${value}</span></div>`;
                            }).join('');
                            footerEl.innerHTML = footerContent;
                            footerEl.style.display = 'flex';
                        } else { // Default handler for bar, line, doughnut, radar etc.
                            const dp = tooltip.dataPoints[0];
                            if (!dp) return;
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            seriesTitleEl.textContent = dp.dataset.label || '';
                            valueEl.textContent = Utils.formatMetric(dp.raw);
                            const prev = dp.dataIndex > 0 ? chart.data.datasets[dp.datasetIndex].data[dp.dataIndex - 1] : null;
                            if (prev !== null && prev !== 0 && typeof dp.raw === 'number') { const change = ((dp.raw - prev) / prev) * 100, isPos = change >= 0; deltaEl.className = `tooltip-delta ${isPos ? 'positive' : 'negative'}`; deltaEl.innerHTML = `<i class="bi ${isPos ? 'bi-arrow-up' : 'bi-arrow-down'}"></i> ${Math.abs(change).toFixed(1)}%`; deltaEl.style.display = 'flex'; }
                            const footerContent = chart.data.datasets.map((ds, i) => i !== dp.datasetIndex && ds.data[dp.dataIndex] !== undefined ? `<div class="footer-row"><span>${ds.label}</span><span>${Utils.formatMetric(ds.data[dp.dataIndex])}</span></div>` : null).filter(Boolean);
                            if (footerContent.length > 0) { footerEl.innerHTML = footerContent.join(''); footerEl.style.display = 'flex'; }
                        }

                        tooltipEl.querySelector('.drilldown-btn').onclick = () => initiateDrilldown(chart.canvas.id, { dataIndex: tooltip.dataPoints[0].dataIndex });
                        const canvasRect = chart.canvas.getBoundingClientRect();
                        tooltipEl.style.opacity = 1;
                        tooltipEl.style.pointerEvents = 'all';
                        tooltipEl.style.left = (canvasRect.left + window.scrollX + tooltip.caretX) + 'px';
                        tooltipEl.style.top = (canvasRect.top + window.scrollY + tooltip.caretY) + 'px';
                    }
                };

                const ConfigValidator = {
                    validate(config) {
                        if (!config.title) throw new Error("`title` is missing.");
                        if (!Array.isArray(config.kpis)) throw new Error("`kpis` must be an array.");
                        if (!Array.isArray(config.layout)) throw new Error("`layout` must be an array.");
                        config.kpis.forEach((kpi, i) => {
                            if (!kpi.id || !kpi.dataKey || !kpi.label) throw new Error(`KPI at index ${i} is missing required keys (id, dataKey, label).`);
                        });
                        config.layout.forEach((item, i) => {
                            if (!item.type || !item.width || !item.config) throw new Error(`Layout item at index ${i} is missing required keys (type, width, config).`);
                            const chartConfig = item.config;
                            if (chartConfig.drilldownConfig && !Array.isArray(chartConfig.drilldownConfig.columns)) {
                                throw new Error(`Drilldown config for chart '${chartConfig.id}' is missing a 'columns' array.`);
                            }
                            // MODIFICATION START: Only validate transformer for items of type 'chart'.
                            if (item.type === 'chart') {
                                if (typeof chartConfig.transformer !== 'function' && !SharedTransformers[chartConfig.transformer]) {
                                    throw new Error(`Transformer for chart '${chartConfig.id}' must be a function or a key in SharedTransformers.`);
                                }
                            }
                            // MODIFICATION END
                        });
                    }
                };

                return { init };
            })();

            // Initialize the application
            APP_CORE.init();

            // Initialize Dashboard Filters
            if (typeof DashboardFilters !== 'undefined') {
                DashboardFilters.init({
                    container: '#main-dashboard-content',

                    // Moving Average Configuration
                    movingAverage: {
                        enabled: true,
                        period: 13,
                        maxWeeks: 52,
                        lineColor: '#03A9F4',
                        lineDash: [5, 5],
                        buttonTextSelector: '#maButtonText',
                        weekOptionsContainer: '#maWeekOptions',
                        dropdownSelector: '#ma-dropdown-container',
                        onWeekChange: function (week) {
                            console.log('MA Week changed to:', week);
                            // Add your chart update logic here if needed
                        }
                    },

                    // Time Period Filters
                    timeFilters: {
                        enabled: true,
                        categories: ['Day', 'Week', 'Month', 'Quarter', 'Year'],
                        defaultSelection: 'Week',
                        containerSelector: '#timeFilterContainer'
                    },

                    // Custom Dropdown Filters
                    customFilters: {
                        enabled: true,
                        filters: [
                            {
                                id: 'productionUnit',
                                label: 'Production Unit',
                                dataSource: [
                                    'Faridabad – DTA',
                                    'Faridabad – EOU',
                                    'C-35 Noida',
                                    'HCBF',
                                    'Thomson Press (ISD)'
                                ],
                                type: 'select',
                                width: 6
                            },
                            {
                                id: 'purchaseCategory',
                                label: 'Purchase Category',
                                dataSource: [
                                    'Domestic',
                                    'Import'
                                ],
                                type: 'select',
                                width: 6
                            }
                        ]
                    },

                    // Filter Panel Configuration
                    filterPanel: {
                        enabled: true,
                        panelSelector: '#filter-popup-panel',
                        toggleButtonSelector: '#toggle-filter-panel-btn',
                        closeButtonSelector: '#close-filter-panel-btn',
                        applyButtonSelector: '#apply-filters-btn-new',
                        resetButtonSelector: '#reset-filters-btn-new'
                    },

                    // Calendar Configuration
                    calendar: {
                        enabled: true,
                        containerSelector: '#calendar-container',
                        gridSelector: '#calendar-grid',
                        prevButtonSelector: '#prev-month-btn',
                        nextButtonSelector: '#next-month-btn',
                        todayButtonSelector: '#today-btn',
                        monthYearDisplaySelector: '#month-year-display',
                        fromDateSelector: '#selected-from-date',
                        toDateSelector: '#selected-to-date'
                    },

                    // Callback when filters change
                    onFilterChange: function (filters) {
                        console.log('Filters changed:', filters);
                        // Add your filter logic here
                        // filters.timeSelection - selected time periods
                        // filters.startDate / filters.endDate - selected date range
                        // filters.customFilters - custom filter values
                    }
                });

                console.log('✅ Dashboard Filters initialized successfully');
            } else {
                console.warn('⚠️ DashboardFilters not found - filters may not work');
            }
        })();
    </script>
</body>

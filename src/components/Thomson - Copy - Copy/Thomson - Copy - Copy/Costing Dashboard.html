<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- jQuery (Required by DevExtreme) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- DevExtreme JS & CSS (Theme and Core) -->
    <script src="https://cdn3.devexpress.com/jslib/23.2.6/js/dx.all.js"></script>
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.2.6/css/dx.light.css">
    <link rel="stylesheet" href="common_styles.css">
    <!-- Chart.js & Datalabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

    <style>
        /* =========================================
1. GLOBAL VARIABLES & THEME
========================================= */
        :root {
            --app-primary-color: #003366;
            --app-primary-rgb: 0, 51, 102;
            --light-gray: #f8f9fa;
            --border-color: #e9ecef;
            --text-color-default: #344767;
            --bs-primary: var(--app-primary-color);
            --bs-primary-rgb: var(--app-primary-rgb);

            /* Glow Colors */
            --glow-green: #4CAF50;
            --glow-blue: #003366;
            --glow-lightblue: #03A9F4;
            --glow-orange: #FF9800;
            --glow-purple: #9C27B0;
            --glow-red: #f44336;
            --glow-gray: #9E9E9E;

            /* Chart Grid Colors */
            --chart-grid-color: #E5E7EB;
        }

        /* =========================================
2. BASE STYLES & TYPOGRAPHY
========================================= */
        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #1F2937;
            font-size: 0.9rem;
            overflow-x: hidden;
            /* Prevents horizontal scrolling globally */
        }

        .dashboard-header h3 {
            color: #003366;
            font-weight: 700;
            font-size: 1.5rem;
        }

        /* =========================================
3. KPI CARD COMPONENT
========================================= */
        .kpi-card {
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 0.75rem;
            box-shadow: 0 4px 15px rgba(0, 43, 92, 0.07);
            color: #374151;
            cursor: pointer;
            height: 100%;
            overflow: hidden;
            position: relative;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            z-index: 1;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 43, 92, 0.12);
        }

        .kpi-card .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 0.75rem;
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 0.5rem;
        }

        .kpi-title-container {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #6B7280;
        }

        .kpi-title-container i {
            font-size: 1rem;
        }

        .kpi-title {
            font-size: inherit;
            font-weight: inherit;
            text-transform: inherit;
            color: inherit;
        }

        .kpi-body {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-grow: 1;
            width: 100%;
            margin-top: 0.5rem;
        }

        .kpi-footer {
            width: calc(100% + 1.5rem);
            height: 50px;
            margin: 0.75rem -0.75rem -0.75rem -0.75rem;
            border-bottom-left-radius: 0.75rem;
            border-bottom-right-radius: 0.75rem;
            overflow: hidden;
        }

        /* KPI Metrics */
        .kpi-primary-metrics {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .kpi-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: #111827;
        }

        .kpi-previous-value {
            font-size: 0.65rem;
            font-weight: 500;
            color: #6B7280;
            opacity: 0.8;
        }

        .kpi-growth {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 50rem;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .kpi-growth.positive {
            color: #10B981;
        }

        .kpi-growth.negative {
            color: #EF4444;
        }

        .kpi-secondary-metrics {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 0.9rem;
            gap: 0.25rem;
            padding-left: 1rem;
        }

        .kpi-secondary-metrics .metric-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.55rem;
            font-weight: 500;
            color: #374151;
        }

        .kpi-chart-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* =========================================
4. CONTENT WRAPPERS & CHARTS
========================================= */
        .content-wrapper {
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 0.75rem;
            padding: 0.1rem;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .content-title {
            font-size: 0.95rem;
            margin: 0.75rem 0.5rem 0.5rem 1rem !important;
            white-space: normal !important;
            /* Enable wrapping */
            line-height: 1.2;
            flex: 1;
            min-width: 0;
            /* Allows flex-item to shrink/wrap correctly */
        }

        .content-header {
            padding: 0.75rem 1rem 0rem 1rem;
        }

        .chart-canvas-container {
            position: relative;
            flex-grow: 1;
            height: 220px;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chart-feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.8);
            color: #64748B;
            text-align: center;
            padding: 1rem;
            z-index: 10;
        }

        .chart-feedback-overlay i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        /* Chart Tooltips */
        .chart-tooltip {
            background-color: #002a55;
            color: #E5E7EB;
            border-radius: 0.6rem;
            padding: 0.75rem 1rem;
            font-family: 'Inter', sans-serif;
            width: 220px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            border: 1px solid #374151;
            transform: translate(-50%, calc(-100% - 15px));
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transition: opacity 0.2s ease;
        }

        .chart-tooltip .tooltip-main-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 0.25rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #374151;
            line-height: 1.3;
            word-wrap: break-word;
        }

        .chart-tooltip .tooltip-main-content {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }

        .chart-tooltip .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-tooltip .tooltip-title {
            font-size: 0.8rem;
            font-weight: 500;
            color: #9CA3AF;
        }

        .chart-tooltip .tooltip-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #FFFFFF;
        }

        .chart-tooltip .tooltip-delta {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
        }

        .chart-tooltip .tooltip-delta.positive {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10B981;
        }

        .chart-tooltip .tooltip-delta.negative {
            background-color: rgba(239, 68, 68, 0.1);
            color: #EF4444;
        }

        .chart-tooltip .tooltip-footer {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding-top: 0.25rem;
            border-top: 1px solid #374151;
            margin-top: 0.25rem;
        }

        .chart-tooltip .footer-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }

        .chart-tooltip .footer-row span:first-child {
            color: #9CA3AF;
        }

        .chart-tooltip .footer-row span:last-child {
            font-weight: 500;
            color: #E5E7EB;
        }

        .chart-tooltip .drilldown-btn {
            background: none;
            border: none;
            color: #60A5FA;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.25rem 0;
            margin-top: 0.25rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        /* =========================================
5. UI CONTROLS (Context Menu, Tables, Forms)
========================================= */
        /* Context Menu */
        #customContextMenu {
            position: absolute;
            z-index: 1056;
            display: none;
            width: 260px;
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 5px 20px rgba(0, 43, 92, 0.15);
            padding: 0.5rem 0;
            border: 1px solid #e9ecef;
            font-size: 0.9rem;
            transform: translateZ(0);
        }

        .context-menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .context-menu-item {
            display: flex;
            align-items: center;
            padding: 0.3rem 0.8rem;
            cursor: pointer;
            color: #344767;
            transition: background-color 0.2s ease;
            gap: 0.85rem;
            position: relative;
        }

        .context-menu-item:hover {
            background-color: #f0f2f5;
            color: #003366;
        }

        .context-menu-item:hover>i {
            color: #003366;
        }

        .context-menu-item i {
            font-size: 1rem;
            width: 20px;
            text-align: center;
            color: #6c757d;
        }

        .context-menu-separator {
            height: 1px;
            background-color: #e9ecef;
            margin: 0.3rem 0;
        }

        .context-menu-item .bi-chevron-right {
            font-size: 0.8rem;
            margin-left: auto;
        }

        .context-menu-sublist {
            display: none;
            position: absolute;
            left: 100%;
            top: -0.5rem;
            list-style: none;
            padding: 0.5rem 0;
            margin: 0;
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 5px 15px rgba(0, 43, 92, 0.12);
            border: 1px solid #e9ecef;
            min-width: 180px;
        }

        .context-menu-item:hover .context-menu-sublist {
            display: block;
        }

        /* Tables & Drilldown */
        #drilldownFilterControls {
            margin-left: auto;
            z-index: 100;
        }

        #drilldownTbody tr {
            cursor: pointer;
        }

        .table-hover>tbody>tr:hover {
            background-color: #E0F7FA;
            color: #1F2937;
        }

        /* Forms */
        .form-readonly-group {
            margin-bottom: 1rem;
        }

        .form-readonly-group label {
            font-size: 0.8rem;
            color: #6B7280;
            margin-bottom: 0.25rem;
        }

        .form-readonly-group .form-control[readonly] {
            background-color: #F3F4F6;
            opacity: 1;
            border-color: #D1D5DB;
        }

        /* Modals */
        #kpiGuideContent h6 {
            margin-bottom: 0.75rem;
            color: #003366;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #drilldownModal.is-blurred .modal-dialog {
            filter: blur(4px);
            transition: filter 0.2s ease;
            pointer-events: none;
        }

        .modal-backdrop {
            background-color: rgba(255, 255, 255, 0.3) !important;
        }

        /* Blur effect for background when modal is open */
        .dashboard-blur {
            filter: blur(6px);
            transition: filter 0.3s ease-in-out;
            pointer-events: none;
        }

        /* =========================================
6. DASHBOARD SPECIFIC MODULES
========================================= */

        /* --- Pre-Press Specifics (Calendar & OTIF) --- */
        .otif-toggle-group {
            display: inline-flex;
            background-color: #f8f9fa;
            border-radius: 50px;
            padding: 0px;
            overflow: hidden;
            z-index: 100;
        }

        .otif-toggle-group .btn {
            border-radius: 50px !important;
            border: none;
            font-weight: 500;
            font-size: 0.75rem;
            padding: 0.4rem 0.85rem;
            color: var(--text-color-default);
            background-color: transparent;
            transition: all 0.2s ease-in-out;
        }

        .otif-toggle-group .btn.active {
            background-color: var(--app-primary-color) !important;
            color: #fff;
            box-shadow: none;
        }

        .otif-toggle-group input[type="radio"]:checked+.btn {
            background-color: var(--app-primary-color) !important;
            color: #fff;
            box-shadow: none;
        }

        #main-dashboard-content.content-blur {
            filter: blur(4px);
            pointer-events: none;
            transition: filter 0.2s ease-in-out;
        }

        #filter-popup-panel {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 340px;
            height: calc(100vh - 2rem);
            max-height: 700px;
            z-index: 1050;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            border: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
            opacity: 1;
            transform: scale(1);
        }

        #filter-popup-panel.d-none {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .otif-filter-panel-title {
            font-weight: 600;
            color: var(--app-primary-color);
        }

        .filter-section {
            margin-bottom: 0.75rem;
        }

        .filter-group .form-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #6c757d;
            margin-bottom: 0.2rem;
            white-space: nowrap;
        }

        /* Calendar Styles */
        #calendar-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 0.5rem;
            border: 1px solid #e9ecef;
            position: relative;
            overflow: hidden;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .btn-today {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
        }

        .btn-icon {
            background: none;
            border: none;
        }

        .month-year-selector-btn {
            cursor: pointer;
            font-weight: 600;
            padding: 0 0.5rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }

        .calendar-grid span {
            font-size: 0.75rem;
            padding: 0.3rem 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day-names span {
            color: #6c757d;
            font-weight: 500;
        }

        #calendar-grid .day {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #calendar-grid .day:not(.disabled):hover {
            background-color: #e0f7fa;
        }

        #calendar-grid .day.selected {
            background-color: var(--app-primary-color);
            color: #fff;
        }

        #calendar-grid .day.in-range {
            background-color: rgba(var(--app-primary-rgb), 0.1);
            border-radius: 0;
        }

        #calendar-grid .day.start-date {
            background-color: var(--app-primary-color);
            color: #fff;
            border-top-left-radius: 50%;
            border-bottom-left-radius: 50%;
        }

        #calendar-grid .day.end-date {
            background-color: var(--app-primary-color);
            color: #fff;
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
        }

        #calendar-grid .day.disabled {
            color: #adb5bd;
            cursor: not-allowed;
        }

        #calendar-grid .day.today {
            font-weight: 700;
            border: 1px solid var(--app-primary-color);
        }

        .date-range-box {
            display: flex;
            justify-content: space-between;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 0.5rem;
            margin-top: 0.5rem;
        }

        .date-range-item {
            flex: 1;
            text-align: center;
        }

        .date-range-item label {
            display: block;
            font-size: 0.7rem;
            color: #6c757d;
        }

        .date-range-item span {
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Dropdown Popup */
        .newdropdown-popup {
            position: absolute;
            z-index: 1100;
            width: 280px;
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .newdropdown-popup__header {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .newdropdown-popup__title {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--app-primary-color);
        }

        .newdropdown-popup__title .form-check-input {
            margin-right: 0.5rem;
        }

        .newdropdown-popup__search {
            padding: 0.5rem 0.75rem;
        }

        .newdropdown-popup__search .form-control {
            font-size: 0.8rem;
        }

        .newdropdown-popup__list {
            max-height: 200px;
            overflow-y: auto;
            padding: 0 0.75rem;
        }

        .newdropdown-popup__list .form-check {
            padding-top: 0.4rem;
            padding-bottom: 0.4rem;
        }

        .newdropdown-popup__footer {
            padding: 0.75rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
        }

        .newdropdown-popup__footer .btn {
            width: 100%;
            font-size: 0.8rem;
        }

        #timeFilterContainer .btn.filtered {
            background-color: #e0e7ff !important;
            color: #3730a3;
            font-weight: 600;
        }

        /* --- Maintenance, RMQC, Costing, CAPA (Toggles) --- */
        /* Custom Toggle Button Styling */
        #pmTypeToggle .btn-check:not(:checked)+.btn-outline-primary,
        #sopViewToggle .btn-check:not(:checked)+.btn-outline-primary,
        #funnelTypeToggle .btn-check:not(:checked)+.btn-outline-primary {
            background-color: #f8f9fa;
            border-color: #dee2e6;
            color: #344767;
            box-shadow: none;
        }

        #pmTypeToggle .btn-check:not(:checked)+.btn-outline-primary:hover,
        #sopViewToggle .btn-check:not(:checked)+.btn-outline-primary:hover,
        #funnelTypeToggle .btn-check:not(:checked)+.btn-outline-primary:hover {
            background-color: #e9ecef;
            border-color: #ced4da;
            color: var(--app-primary-color);
        }

        #pmTypeToggle .btn-check:checked+.btn-outline-primary,
        #sopViewToggle .btn-check:checked+.btn-outline-primary,
        #funnelTypeToggle .btn-check:checked+.btn-outline-primary {
            background-color: var(--app-primary-color);
            border-color: var(--app-primary-color);
            color: #ffffff;
            box-shadow: none;
        }

        #pmTypeToggle .btn-check:checked+.btn-outline-primary:hover,
        #sopViewToggle .btn-check:checked+.btn-outline-primary:hover,
        #funnelTypeToggle .btn-check:checked+.btn-outline-primary:hover {
            background-color: var(--app-primary-color);
            border-color: var(--app-primary-color);
            color: #ffffff;
        }

        /* --- Sales/CRM Specifics --- */
        .dashboard-toggle-group .btn-outline-primary {
            --bs-btn-color: #003366;
            --bs-btn-border-color: #003366;
            --bs-btn-hover-bg: #003366;
            --bs-btn-hover-border-color: #003366;
            --bs-btn-active-bg: #003366;
            --bs-btn-active-border-color: #003366;
            --bs-btn-active-color: #FFFFFF;
        }

        .dashboard-toggle-group {
            flex-shrink: 0 !important;
            /* Prevents the buttons from being squeezed */
            margin-top: 0.75rem;
            margin-right: 0.75rem;
        }

        .dashboard-toggle-group .btn {
            padding: 0.3rem 0.6rem !important;
            font-size: 0.7rem !important;
        }

        .content-title {
            flex-shrink: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 10px !important;
        }

        .btn-custom-xs {
            padding: 0.3rem 0.5rem !important;
            font-size: 0.8rem !important;
            line-height: 1.2 !important;
            border-radius: 0.3rem;
            min-height: 0;
        }

        .chart-controls .btn {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-color: #D1D5DB;
        }
    </style>
</head>

<body>

    <div class="container-fluid py-4">
        <header class="dashboard-header pb-2 d-flex justify-content-between align-items-center">
            <h3 id="dashboardTitle" class="mb-0"></h3>
        </header>
        <section class="kpi-section mb-3">
            <div id="kpi-container" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-5 g-3"></div>
        </section>

                    if (format === 'compact_number') {
                        if (Math.abs(value) >= 10000000) return `${(value / 10000000).toFixed(2)} Cr`;
                        if (Math.abs(value) >= 100000) return `${(value / 100000).toFixed(2)} L`;
                        if (Math.abs(value) >= 1000) return `${(value / 1000).toFixed(1)} K`;
                        return value.toLocaleString('en-IN');
                    }

                    if (format === 'currency') return new Intl.NumberFormat('en-IN', { style: 'currency', currency: currencyCode, minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(value);
                    if (format === 'percent') return `${value.toFixed(1)}%`;
                    if (format === 'date') return new Date(value).toLocaleString('en-GB');
                    if (typeof value === 'number') return value.toLocaleString('en-IN');
                    return `${value}${suffix}`;
                },
                hexToRgb(hex) {
                    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
                    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
                },
                deepMerge(target, source) {
                    const isObject = (obj) => obj && typeof obj === 'object' && !Array.isArray(obj);
                    let output = { ...target };
                    if (isObject(target) && isObject(source)) {
                        Object.keys(source).forEach(key => {
                            if (isObject(source[key])) {
                                if (key in target) {
                                    output[key] = this.deepMerge(target[key], source[key]);
                                } else {
                                    Object.assign(output, { [key]: source[key] });
                                }
                            } else {
                                Object.assign(output, { [key]: source[key] });
                            }
                        });

            // ===================================  =====================================================================

            const DATA_PROVIDER = (() => {

                const SharedTransformers = {
                    aggregateByStatus: (data, periodIndex) => {
                        const filteredData = periodIndex !== null ? data.filter(d => d.date.getMonth() === periodIndex) : data; const statusCounts = filteredData.reduce((acc, d) => { acc[d.status] = (acc[d.status] || 0) + 1; return acc; }, {});

                            labels: Object.keys(statusCounts), datasets: [{
                                data: Object.values(statusCounts),

                        };

                    transformForPareto: (data) => {
                        const sortedData = [...data].sort((a, b) => b.count - a.count);
                        const labels = sortedData.map(d => d.reason); const counts = sortedData.map(d => d.count); const total = counts.reduce((sum, val) => sum + val, 0); let cumulative = 0; const cumulativePercentage = counts.map(count => { cumulative += count; return total > 0 ? (cumulative / total) * 100 : 0; }); return {
                            labels, datasets: [{
                                type: 'bar', label: 'Loss Value', data: counts,
                                backgroundColor: '#003366', yAxisID: 'y'
                            },
                            { type: 'line', label: 'Cumulative %', data: cumulativePercentage, borderColor: '#EF4444', tension: 0.1, yAxisID: 'y1' }]
                        };
                    },

                    transformForTopN: (data, periodIndex, config) => {
                        const { n = 5, categoryKey, valueKey, datasetLabel = 'Value', chartType = 'bar', backgroundColor: customBackgroundColor } = config.transformerConfig;
                        if (!categoryKey || !valueKey) { throw new Error(`'transformerConfig' for TopN must include 'categoryKey' and 'valueKey'.`); }
                        const filteredData = periodIndex !== null ? data.filter(d => d.date.getMonth() === periodIndex) : data;
                        const totals = filteredData.reduce((acc, d) => {
                            const category = d[categoryKey];
                            const value = d[valueKey]; if (category !== undefined && typeof value === 'number') { acc[category] = (acc[category] || 0) + value; } return acc;
                        }, {});
                        const topN = Object.entries(totals).sort(([, a], [, b]) => b - a).slice(0, n); const labels = topN.map(([key]) => key);
                        const values = topN.map(([, val]) => val); const backgroundColor = customBackgroundColor || (chartType === 'line' ? 'rgba(16, 185, 129, 0.2)' : '#003366');
                        const borderColor = chartType === 'line' ? '#10B981' : undefined;
                        return { labels, datasets: [{ label: datasetLabel, data: values, backgroundColor: backgroundColor, borderColor: borderColor, fill: chartType === 'line', tension: 0.3 }] };
                    },
                    // 1. Transformer for Color View (SF 1+2c, 4c, WEB)
                    transformSalesCategory: (data) => ({

                        setState: (key, data) => {
                            const currentState = state[key];
                            let hasChanged = false;
                            if (typeof currentState === 'object' && currentState !== null && typeof data === 'object' && data !== null) {
                                if (JSON.stringify(currentState) !== JSON.stringify(data)) hasChanged = true;
                            } else {
                                if (currentState !== data) hasChanged = true;
                            }

                        }

                            }

                        // Cleanup for non-cartesian charts
                        if (['doughnut', 'pie', 'polarArea'].includes(config.chartType)) {
                            delete baseOptions.scales;
                            delete baseOptions.interaction;
                        }

                        return Utils.deepMerge(baseOptions, config.options || {});
                    }
                };
                const ActionRegistry = {
                    setPeriodIndex: (e, elements, chart) => {
                        if (elements.length > 0) {
                            const newIndex = elements[0].index;
                            StateManager.setState('selectedPeriodIndex', newIndex);
                            chart.setActiveElements([{ datasetIndex: 0, index: newIndex }]);
                            chart.update();
                        }
                    }
                };

                async function init() {
                    try {
                        ConfigValidator.validate(dashboardConfig);
                    } catch (error) {
                        console.error("Dashboard Configuration Error:", error.message);
                        document.body.innerHTML = `<div class="alert alert-danger m-4" role="alert"><strong>Configuration Error:</strong> ${error.message}</div>`;
                        return;
                    }

                    Chart.register(ChartDataLabels);
                    Chart.defaults.plugins.datalabels.display = false;
                    const centerTextPlugin = { id: 'centerText', afterDraw: (chart) => { const { centerText } = chart.config.options.plugins; if (centerText?.display) { const { ctx, chartArea: { top, left, width, height } } = chart; ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; const centerX = left + width / 2, valueY = top + height / 2 - 10, labelY = valueY + 22; ctx.font = `700 ${centerText.fontSize || '24px'} Inter`; ctx.fillStyle = centerText.color || '#212529'; ctx.fillText(centerText.text, centerX, valueY); if (centerText.label) { ctx.font = `500 1rem Inter`; ctx.fillStyle = '#6B7280'; ctx.fillText(centerText.label, centerX, labelY); } ctx.restore(); } } };
                    Chart.register(centerTextPlugin);

                    document.title = dashboardConfig.title;
                    document.getElementById('dashboardTitle').textContent = dashboardConfig.title;
                    ['drilldownModal', 'expandChartModal', 'kpiGuideModal', 'docFormModal'].forEach(id => { modals[id] = new bootstrap.Modal(document.getElementById(id)); });
                    FilterHandler.init();
                    renderLayoutShells();
                    InteractivityHandler.init();
                    setupSubscriptions();

                    await refreshDashboardData();
                }

                async function refreshDashboardData() {
                    const filters = StateManager.getState('filters');

                    const kpiDataPromise = DataProvider.fetchKpiData(filters);
                    const rawDataKeys = [...new Set([
                        ...dashboardConfig.kpis.map(kpi => kpi.drilldownConfig?.dataKey),
                        ...dashboardConfig.layout.map(item => item.config.dataKey),
                        ...dashboardConfig.layout.map(item => item.config.drilldownConfig?.dataKey), // <--- ADDED THIS LINE
                        ...(dashboardConfig.grid ? [dashboardConfig.grid.dataKey] : [])
                    ].filter(Boolean))];

                    const rawDataPromises = rawDataKeys.map(key => DataProvider.fetchRawData(key, filters));

                    const [kpiData] = await Promise.all([kpiDataPromise]);
                    StateManager.setState('kpiData', kpiData);
                    renderKpis();

                    const allRawData = await Promise.all(rawDataPromises);
                    allRawData.forEach((data, index) => {
                        StateManager.setState(rawDataKeys[index], data);
                    });
                }

                function setupSubscriptions() {
                    StateManager.subscribe('filters', refreshDashboardData);

                    dashboardConfig.layout.forEach(item => {
                        if (item.type === 'chart') {
                            StateManager.subscribe(item.config.dataKey, () => ChartHandler.render(item.config));
                            if (item.config.isPeriodSensitive) {
                                StateManager.subscribe('selectedPeriodIndex', () => ChartHandler.render(item.config));
                            }
                        }
                    });

                    if (dashboardConfig.grid) {
                        StateManager.subscribe(dashboardConfig.grid.dataKey, () => GridHandler.render(dashboardConfig.grid));
                    }
                }

                function renderLayoutShells() {
                    document.getElementById('kpi-container').innerHTML = dashboardConfig.kpis.map(c => `<div class="col" id="shell-${c.id}"></div>`).join('');
                    const loadingSpinner = `<div class="chart-feedback-overlay"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>`;

                    document.getElementById('content-grid').innerHTML = dashboardConfig.layout.map(item => {
                        // CHANGE: Added 'btn-custom-xs' to the label class list below
                        const toggleHtml = item.config.views ? `
            <div class="btn-group btn-group-sm dashboard-toggle-group ms-auto me-2" role="group">
                ${item.config.views.map((v, i) => `
                    <input type="radio" class="btn-check view-toggle" name="toggle-${item.config.id}" id="btn-${item.config.id}-${v.id}" autocomplete="off" data-component-id="${item.config.id}" data-view-index="${i}" ${i === 0 ? 'checked' : ''}>
                    <label class="btn btn-outline-primary btn-custom-xs" for="btn-${item.config.id}-${v.id}">${v.label}</label>
                `).join('')}
            </div>` : '';

                        return `<div class="${item.width}" id="container-${item.config.id}">
            <div class="content-wrapper context-menu-target" data-component-id="${item.config.id}">
                <div class="chart-header mt-2 mb-0">
                    <h3 class="content-title mt-0">${item.config.title}</h3>
                    ${toggleHtml}
                </div>
                <div class="chart-canvas-container">${loadingSpinner}<canvas id="${item.config.id}"></canvas></div>
            </div>
        </div>`;
                    }).join('');

                    setupViewToggles();
                }
                // 2. Add this new function to handle toggle clicks
                function setupViewToggles() {
                    document.querySelectorAll('.view-toggle').forEach(toggle => {
                        toggle.addEventListener('change', (e) => {
                            const componentId = e.target.dataset.componentId;
                            const viewIndex = e.target.dataset.viewIndex;
                            const config = Utils.getComponentConfig(componentId);
                            const selectedView = config.views[viewIndex];

                            // Update Config
                            config.dataKey = selectedView.dataKey;
                            config.transformer = selectedView.transformer;

                            // Check if data exists, if not fetch it (handling lazy loading)
                            const rawData = StateManager.getState(config.dataKey);
                            if (rawData) {
                                ChartHandler.render(config);
                            } else {
                                DataProvider.fetchRawData(config.dataKey).then(data => {
                                    StateManager.setState(config.dataKey, data);
                                    ChartHandler.render(config);
                                });
                            }
                        });
                    });
                }
                function renderKpis() {
                    const { kpiData } = StateManager.getState();
                    if (!kpiData) return;
                    dashboardConfig.kpis.forEach(config => {
                        const data = kpiData[config.dataKey];
                        if (!data) return;
                        const growth = data.previous > 0 ? ((data.current - data.previous) / data.previous) * 100 : 0;
                        const container = document.getElementById(`shell-${config.id}`);

                        const isPositiveGrowth = growth >= 0;
                        const isGood = config.invertGrowthColor ? !isPositiveGrowth : isPositiveGrowth;

                        container.innerHTML = `<div class="card kpi-card context-menu-target" data-component-id="${config.id}">
                    <div class="card-body">
                        <div class="kpi-header">
                            <div class="kpi-title-container">
                                ${config.mainIcon ? `<i class="bi ${config.mainIcon}"></i>` : ''}
                                <span class="kpi-title">${config.label}</span>
                            </div>
                            <div class="kpi-growth ${isGood ? 'positive' : 'negative'}">
                                <i class="bi ${isPositiveGrowth ? 'bi-arrow-up-short' : 'bi-arrow-down-short'}"></i> ${Math.abs(growth).toFixed(1)}%
                            </div>
                        </div>

                        <div class="kpi-body">
                            <div class="kpi-primary-metrics">
                                <span class="kpi-value">${Utils.formatMetric(data.current, config.isCurrency ? 'currency_compact' : (config.valueSuffix === '%' ? 'percent' : 'number'), config.valueSuffix)}</span>
                                <span class="kpi-previous-value">Prev: ${Utils.formatMetric(data.previous, config.isCurrency ? 'currency_compact' : (config.valueSuffix === '%' ? 'percent' : 'number'), config.valueSuffix)}</span>
                            </div>
                            <div class="kpi-secondary-metrics">
                                ${config.secondaryMetrics.map(sm => `<div class="metric-item"><i class="bi ${sm.icon}"></i><span>${sm.label ? sm.label + ': ' : ''}${Utils.formatMetric(data[sm.dataKey], sm.format, sm.valueSuffix)}</span></div>`).join('')}
                            </div>
                        </div>

                        <div class="kpi-footer">
                            <div class="kpi-chart-container">
                                <canvas id="sparkline-${config.id}"></canvas>
                            </div>
                        </div>
                    </div>
                </div>`;
                        renderSparkline(config.id, data.trend, config.cssVar);
                    });
                }

                function renderSparkline(id, data, colorVarName) {
                    const ctx = document.getElementById(`sparkline-${id}`)?.getContext('2d');
                    if (!ctx) return;
                    const trendColor = getComputedStyle(document.documentElement).getPropertyValue(colorVarName);
                    const trendColorRGB = Utils.hexToRgb(trendColor);
                    if (!trendColorRGB) { console.error(`Invalid color format or CSS variable not found for: ${colorVarName}`); return; }
                    const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
                    gradient.addColorStop(0, `rgba(${trendColorRGB}, 0.3)`);
                    gradient.addColorStop(1, `rgba(${trendColorRGB}, 0)`);
                    if (chartInstances[id]) chartInstances[id].destroy();
                    chartInstances[id] = new Chart(ctx, {
                        type: 'line',
                        data: { labels: data.map(() => ''), datasets: [{ data: data, borderColor: trendColor, borderWidth: 2, fill: true, backgroundColor: gradient, tension: 0.4, pointRadius: 0 }] },
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false }, y: { display: false } }, plugins: { legend: { display: false }, tooltip: { enabled: false } }, layout: { padding: 0 } }
                    });
                }

                const ChartHandler = {
                    render(config) {
                        const container = document.getElementById(`container-${config.id}`);
                        const canvasContainer = container.querySelector('.chart-canvas-container');
                        const feedbackEl = canvasContainer.querySelector('.chart-feedback-overlay');
                        try {
                            const ctx = canvasContainer.querySelector('canvas')?.getContext('2d');
                            if (!ctx) throw new Error(`Canvas with id '${config.id}' not found.`);
                            const rawData = StateManager.getState(config.dataKey);
                            if (!rawData) { return; }
                            const periodIndex = StateManager.getState('selectedPeriodIndex');
                            let transformer;
                            if (typeof config.transformer === 'function') {
                                transformer = config.transformer;
                            } else if (typeof config.transformer === 'string' && SharedTransformers[config.transformer]) {
                                transformer = SharedTransformers[config.transformer];
                            } else {
                                throw new Error(`Transformer '${config.transformer}' is not a valid function or a key in SharedTransformers.`);
                            }
                            const data = transformer(rawData, periodIndex, config);
                            if (chartInstances[config.id]) chartInstances[config.id].destroy();

                            let finalOptions = ChartDefaults.getChartOptions(config);
                            if (config.onClickAction && ActionRegistry[config.onClickAction]) { finalOptions.onClick = ActionRegistry[config.onClickAction]; }
                            if (config.chartType === 'doughnut') {
                                const total = data.datasets[0].data.reduce((a, b) => a + b, 0);
                                if (finalOptions.plugins.centerText) { finalOptions.plugins.centerText.text = Utils.formatMetric(total); }
                                finalOptions.onHover = (event, elements, chart) => { const centerText = chart.config.options.plugins.centerText; if (elements.length > 0) { const index = elements[0].index; centerText.text = Utils.formatMetric(chart.data.datasets[0].data[index]); centerText.label = chart.data.labels[index]; } else { centerText.text = Utils.formatMetric(total); centerText.label = 'Total'; } chart.update('none'); };
                                if (config.drilldownTarget) { finalOptions.onClick = () => DrilldownHandler.show(config.drilldownTarget); }
                            }
                            if (feedbackEl) feedbackEl.remove();
                            chartInstances[config.id] = new Chart(ctx, { type: config.chartType, data, options: finalOptions });
                        } catch (error) {
                            console.error(`Failed to render chart '${config.id}':`, error);
                            this.renderErrorState(canvasContainer, error);
                        }
                    },
                    renderErrorState(container, error) {
                        container.innerHTML = `<div class="chart-feedback-overlay"><i class="bi bi-exclamation-triangle-fill"></i><strong>Chart Failed to Load</strong><small class="mt-1">${error.message}</small></div>`;
                    }
                };

                const GridHandler = {
                    render(config) {
                        const rawData = StateManager.getState(config.dataKey);
                        if (!rawData) return;
                        $(`#grid-container`).dxDataGrid({
                            dataSource: rawData, keyExpr: config.key || undefined, columns: config.columns,
                            showBorders: true, rowAlternationEnabled: true, hoverStateEnabled: true, columnAutoWidth: true, wordWrapEnabled: true, showColumnLines: false, showRowLines: false,
                            allowColumnReordering: true, allowColumnResizing: true, columnResizingMode: "widget",
                            paging: { pageSize: 10 }, pager: { showPageSizeSelector: false, allowedPageSizes: false, showInfo: true, showNavigationButtons: true, visible: true },
                            searchPanel: { visible: true, width: 240, placeholder: "Search..." }, filterRow: { visible: true }, headerFilter: { visible: true }, filterPanel: { visible: false }, groupPanel: { visible: true }, grouping: { autoExpandAll: false },
                            sorting: { mode: "multiple" }, columnChooser: { enabled: true, mode: "select" }, columnFixing: { enabled: true },
                            toolbar: { items: ["searchPanel", "groupPanel", "exportButton", "columnChooserButton", { location: "after", widget: "dxButton", options: { icon: "refresh", hint: "Refresh", onClick: () => $(`#grid-container`).dxDataGrid("instance").refresh() } }, { location: "after", widget: "dxButton", options: { icon: "clear", hint: "Clear Filters", onClick: () => $(`#grid-container`).dxDataGrid("instance").clearFilter() } }] },
                            export: { enabled: true, formats: ["xlsx", "pdf"] },
                            stateStoring: { enabled: true, type: "localStorage", storageKey: `${config.dataKey}-gridState` },
                            scrolling: { mode: "standard" }, loadPanel: { enabled: true, text: "Loading..." },
                            summary: {
                                totalItems: [
                                    { column: config.summaryColumn || "id", summaryType: "count", displayFormat: "Total Rows: {0}" },
                                    { column: config.summaryValueColumn || "amount", summaryType: "sum", valueFormat: { type: 'currency', currency: 'INR', precision: 0 }, displayFormat: "Total: {0}" },
                                    { column: config.summaryValueColumn || "amount", summaryType: "avg", valueFormat: { type: 'currency', currency: 'INR', precision: 0 }, displayFormat: "Avg: {0}" }
                                ],
                                groupItems: [{ column: config.summaryValueColumn || "amount", summaryType: "sum", valueFormat: { type: 'currency', currency: 'INR', precision: 0 }, displayFormat: "Group Total: {0}", alignByColumn: true }]
                            },
                            onRowClick: (e) => config.onRowClick && config.onRowClick(e), onCellPrepared: (e) => config.onCellPrepared && config.onCellPrepared(e)
                        });
                    }
                };

                const DrilldownService = {
                    show(title, config, dataRows) {
                        const { columns, filters, docFormConfig, renderAs } = config;
                        const filterControls = document.getElementById('drilldownFilterControls');
                        const modalBody = document.getElementById('drilldownModalBody');
                        document.getElementById('drilldownModalLabel').textContent = title;
                        modalBody.innerHTML = '';

                        if (docFormConfig) { modalBody.dataset.docFormConfig = JSON.stringify(docFormConfig); } else { delete modalBody.dataset.docFormConfig; }

                        if (filters) {
                            filterControls.innerHTML = filters.map(opt => `<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="drilldownFilter" id="filter_${opt.value}" value="${opt.value}" ${opt.default ? 'checked' : ''}><label class="form-check-label small" for="filter_${opt.value}">${opt.label}</label></div>`).join('');
                        } else {
                            filterControls.innerHTML = '';
                        }

                        if (renderAs === 'grid') {
                            const gridContainer = document.createElement('div');
                            gridContainer.style.height = '60vh';
                            modalBody.appendChild(gridContainer);

                            $(gridContainer).dxDataGrid({
                                dataSource: dataRows,
                                columns: columns,
                                showBorders: true,
                                rowAlternationEnabled: true,
                                hoverStateEnabled: true,
                                filterRow: { visible: true },
                                headerFilter: { visible: true },
                                searchPanel: { visible: true },
                                groupPanel: { visible: true },
                                paging: { pageSize: 15 },
                                pager: { showPageSizeSelector: true, allowedPageSizes: [15, 30, 50], showInfo: true },
                                columnAutoWidth: true,
                                export: { enabled: false } // <--- CHANGED TO FALSE TO FIX W1024
                            });
                        } else {
                            const headers = columns.map(c => `<th>${c.label}</th>`).join('');
                            const rows = dataRows.map(row => `<tr data-doc-id="${row.id}" data-status="${row.status}">${columns.map(col => `<td>${Utils.formatMetric(row[col.key], col.format)}</td>`).join('')}</tr>`).join('');
                            modalBody.innerHTML = `<div class="table-responsive"><table class="table table-hover"><thead id="drilldownThead"><tr>${headers}</tr></thead><tbody id="drilldownTbody">${rows}</tbody></table></div>`;
                        }
                        modals.drilldownModal.show();
                    },
                    showPlaceholder(title, message) { alert(message); }
                };

                function initiateDrilldown(componentId, context = {}) {
                    const config = Utils.getComponentConfig(componentId);
                    if (config.drilldownTarget && !context.dataIndex) { return initiateDrilldown(config.drilldownTarget); }
                    const drilldownConfig = config?.drilldownConfig;
                    if (!drilldownConfig) { return DrilldownService.showPlaceholder(config.label || config.title, `No drilldown configured.`); }
                    const { dataKey, filterMapping } = drilldownConfig;
                    let title = `Detailed View: ${config.label || config.title}`;
                    const rawData = StateManager.getState(dataKey);
                    if (!rawData) { return DrilldownService.showPlaceholder(title, `No detailed data available.`); }
                    let filteredData = [...rawData];
                    if (context.dataIndex !== undefined) {
                        const chart = chartInstances[componentId];
                        if (chart && chart.data.labels[context.dataIndex] !== undefined) {
                            const label = chart.data.labels[context.dataIndex];
                            title += ` (${label})`;
                            if (filterMapping === 'date_month_short') { filteredData = rawData.filter(item => item.date.toLocaleString('default', { month: 'short' }) === label); } else if (filterMapping) { filteredData = rawData.filter(item => item[filterMapping] === label); }
                        }
                    }
                    DrilldownService.show(title, drilldownConfig, filteredData);
                }

                const DocFormHandler = {
                    show(docId, config) {
                        const rawData = StateManager.getState(config.dataKey);
                        const data = rawData.find(item => item.id === docId);
                        if (!data) { alert(`Details for ${docId} not found.`); return; }
                        const bodyHtml = `<div class="row">${config.fields.map(field => `<div class="col-md-6 form-readonly-group"><label>${field.label}</label><input type="text" class="form-control" value="${Utils.formatMetric(data[field.key], field.format)}" readonly></div>`).join('')}</div>`;
                        document.getElementById('docFormModalLabel').textContent = `Details for: ${docId}`;
                        document.getElementById('docFormBody').innerHTML = bodyHtml;
                        modals.drilldownModal.classList.add('is-blurred');
                        modals.docFormModal.show();
                    }
                };

                const ExpandChartHandler = {
                    show(componentId) {
                        const originalChart = chartInstances[componentId];
                        const config = Utils.getComponentConfig(componentId);
                        if (!originalChart || !config) { alert('Cannot expand: chart instance not found.'); return; }
                        const ctx = document.getElementById('expandedChartCanvas').getContext('2d');
                        const chartData = JSON.parse(JSON.stringify(originalChart.data));
                        const originalOptions = originalChart.config.options;
                        const expansionOverrides = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true }, tooltip: { enabled: true, external: null } } };
                        const finalOptions = Utils.deepMerge(JSON.parse(JSON.stringify(originalOptions)), expansionOverrides);
                        const isKpiCard = dashboardConfig.kpis.some(k => k.id === componentId);
                        if (isKpiCard) {
                            const kpiData = StateManager.getState('kpiData')[config.dataKey];
                            if (kpiData && kpiData.trend_labels) { chartData.labels = kpiData.trend_labels; }
                            chartData.datasets[0].label = config.label;
                            if (config.cssVar) {
                                const trendColor = getComputedStyle(document.documentElement).getPropertyValue(config.cssVar).trim();
                                const trendColorRGB = Utils.hexToRgb(trendColor);
                                if (trendColor && trendColorRGB) { chartData.datasets[0].borderColor = trendColor; chartData.datasets[0].backgroundColor = `rgba(${trendColorRGB}, 0.2)`; chartData.datasets[0].fill = true; chartData.datasets[0].tension = 0.3; }
                            }
                        }
                        document.getElementById('expandChartModalLabel').textContent = `Expanded View: ${config.label || config.title}`;
                        if (chartInstances['expandedChart']) chartInstances['expandedChart'].destroy();
                        chartInstances['expandedChart'] = new Chart(ctx, { type: originalChart.config.type, data: chartData, options: finalOptions });
                        modals.expandChartModal.show();
                    }
                };

                const GuideHandler = { show(kpiConfig) { if (!kpiConfig?.guide) { alert('No guide available for this KPI.'); return; } const { title, definition, interpretation, calculation } = kpiConfig.guide; document.getElementById('kpiGuideModalLabel').textContent = `Guide: ${title}`; document.getElementById('guide-definition').textContent = definition; document.getElementById('guide-interpretation').textContent = interpretation; document.getElementById('guide-calculation').textContent = calculation; modals.kpiGuideModal.show(); } };

                const InteractivityHandler = {
                    init() {
                        const menu = document.getElementById('customContextMenu');
                        const tooltipEl = document.getElementById('custom-tooltip');
                        const drilldownModalEl = document.getElementById('drilldownModal');
                        const hideMenu = () => menu.style.display = 'none';
                        const hideTooltip = () => { if (tooltipEl) { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; } };
                        document.addEventListener('click', hideMenu);
                        document.addEventListener('keydown', e => e.key === 'Escape' && hideMenu());
                        document.body.addEventListener('contextmenu', e => { const target = e.target.closest('.context-menu-target'); if (target) { e.preventDefault(); this.showContextMenu(e, target.dataset.componentId); } });
                        document.body.addEventListener('click', e => { const target = e.target.closest('.kpi-card'); if (target) initiateDrilldown(target.dataset.componentId); });
                        tooltipEl.addEventListener('mouseenter', () => clearTimeout(tooltipHideTimer));
                        tooltipEl.addEventListener('mouseleave', () => { tooltipHideTimer = setTimeout(hideTooltip, 300); });
                        document.getElementById('drilldownFilterControls').addEventListener('change', e => { if (e.target.name === 'drilldownFilter') { const filterValue = e.target.value; document.getElementById('drilldownTbody').querySelectorAll('tr').forEach(row => { row.style.display = (filterValue === 'all' || row.dataset.status === filterValue) ? '' : 'none'; }); } });
                        drilldownModalEl.addEventListener('click', e => { const row = e.target.closest('tr[data-doc-id]'); const configStr = drilldownModalEl.querySelector('.modal-body').dataset.docFormConfig; if (row && configStr) { const config = JSON.parse(configStr); DocFormHandler.show(row.dataset.docId, config); } });
                        drilldownModalEl.addEventListener('hidden.bs.modal', () => {
                            const modalBody = drilldownModalEl.querySelector('.modal-body');
                            if (modalBody.dataset.docFormConfig) {
                                delete modalBody.dataset.docFormConfig;
                            }
                        }); document.getElementById('docFormModal').addEventListener('hidden.bs.modal', () => modals.drilldownModal.classList.remove('is-blurred'));
                        document.getElementById('expandChartModal').addEventListener('hidden.bs.modal', () => { if (chartInstances['expandedChart']) { chartInstances['expandedChart'].destroy(); chartInstances['expandedChart'] = null; } });
                    },
                    showContextMenu(event, componentId) {
                        const config = Utils.getComponentConfig(componentId);
                        const menu = document.getElementById('customContextMenu');
                        const menuList = document.getElementById('contextMenuList');
                        const componentActions = config?.actions || dashboardConfig.contextMenu.actions.map(a => a.id);
                        let actions = dashboardConfig.contextMenu.actions.filter(a => componentActions.includes(a.id) || a.type === 'separator');
                        const renderItems = items => items.map(a => a.type === 'separator' ? '<li class="context-menu-separator"></li>' : `<li class="context-menu-item" data-action="${a.id}"><i class="bi ${a.icon}"></i><span>${a.label}</span>${a.submenu ? `<i class="bi bi-chevron-right"></i><ul class="context-menu-sublist">${renderItems(a.submenu)}</ul>` : ''}</li>`).join('');
                        menuList.innerHTML = renderItems(actions);
                        menu.querySelectorAll('.context-menu-item').forEach(item => { if (!item.querySelector('.context-menu-sublist')) item.addEventListener('click', () => this.handleContextMenuAction(item.dataset.action, componentId)); });
                        menu.style.visibility = 'hidden'; menu.style.display = 'block';
                        const { offsetWidth: menuW, offsetHeight: menuH } = menu;
                        const { clientX: mouseX, clientY: mouseY } = event;
                        const { innerWidth: viewportW, innerHeight: viewportH } = window;
                        const padding = 5;
                        let finalLeft = mouseX; if ((mouseX + menuW + padding) > viewportW) { finalLeft = mouseX - menuW; }
                        let finalTop = mouseY; if ((mouseY + menuH + padding) > viewportH) { finalTop = mouseY - menuH; }
                        menu.style.left = `${finalLeft + window.scrollX}px`; menu.style.top = `${finalTop + window.scrollY}px`; menu.style.visibility = 'visible';
                    },
                    handleContextMenuAction(action, componentId) {
                        const config = Utils.getComponentConfig(componentId);
                        switch (action) {
                            case 'drilldown': initiateDrilldown(componentId); break;
                            case 'refresh': refreshDashboardData(); break;
                            case 'expand': ExpandChartHandler.show(componentId); break;
                            case 'guide': if (config.guide) GuideHandler.show(config); break;
                            case 'share': window.location.href = `mailto:?subject=Dashboard Insight: ${config.label || config.title}&body=Review data for ${config.label || config.title}.`; break;
                            case 'export-png': const chart = chartInstances[componentId]; if (chart) { const a = document.createElement('a'); a.href = chart.toBase64Image(); a.download = `${componentId}.png`; a.click(); } break;
                            default: alert(`Action '${action}' is not yet implemented.`);
                        }
                    },
                    customTooltip(context) {
                        const { chart, tooltip } = context;
                        const tooltipEl = document.getElementById('custom-tooltip');
                        clearTimeout(tooltipHideTimer);
                        if (tooltip.opacity === 0) { tooltipHideTimer = setTimeout(() => { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; }, 300); return; }
                        const titleEl = tooltipEl.querySelector('.tooltip-main-title');
                        const headerEl = tooltipEl.querySelector('.tooltip-header');
                        const valueEl = tooltipEl.querySelector('.tooltip-value');
                        const seriesTitleEl = tooltipEl.querySelector('.tooltip-title');
                        const deltaEl = tooltipEl.querySelector('.tooltip-delta');
                        const footerEl = tooltipEl.querySelector('.tooltip-footer');
                        headerEl.style.display = 'flex'; deltaEl.style.display = 'none'; footerEl.style.display = 'none';
                        if (chart.canvas.id.startsWith('loss-analysis')) {
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            headerEl.style.display = 'none';
                            valueEl.textContent = '';
                            const footerContent = tooltip.dataPoints.map(dp => {
                                const isPercentage = dp.dataset.label.includes('%');
                                const value = isPercentage ? `${dp.raw.toFixed(1)}%` : Utils.formatMetric(dp.raw);
                                return `<div class="footer-row"><span>${dp.dataset.label}</span><span>${value}</span></div>`;
                            }).join('');
                            footerEl.innerHTML = footerContent;
                            footerEl.style.display = 'flex';
                        } else {
                            const dp = tooltip.dataPoints[0];
                            if (!dp) return;
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            seriesTitleEl.textContent = dp.dataset.label || '';
                            valueEl.textContent = Utils.formatMetric(dp.raw);
                            const prev = dp.dataIndex > 0 ? chart.data.datasets[dp.datasetIndex].data[dp.dataIndex - 1] : null;
                            if (prev !== null && prev !== 0 && typeof dp.raw === 'number') { const change = ((dp.raw - prev) / prev) * 100, isPos = change >= 0; deltaEl.className = `tooltip-delta ${isPos ? 'positive' : 'negative'}`; deltaEl.innerHTML = `<i class="bi ${isPos ? 'bi-arrow-up' : 'bi-arrow-down'}"></i> ${Math.abs(change).toFixed(1)}%`; deltaEl.style.display = 'flex'; }
                            const footerContent = chart.data.datasets.map((ds, i) => i !== dp.datasetIndex && ds.data[dp.dataIndex] !== undefined ? `<div class="footer-row"><span>${ds.label}</span><span>${Utils.formatMetric(ds.data[dp.dataIndex])}</span></div>` : null).filter(Boolean);
                            if (footerContent.length > 0) { footerEl.innerHTML = footerContent.join(''); footerEl.style.display = 'flex'; }
                        }
                        tooltipEl.querySelector('.drilldown-btn').onclick = () => initiateDrilldown(chart.canvas.id, { dataIndex: tooltip.dataPoints[0].dataIndex });
                        const canvasRect = chart.canvas.getBoundingClientRect();
                        tooltipEl.style.opacity = 1; tooltipEl.style.pointerEvents = 'all';
                        tooltipEl.style.left = (canvasRect.left + window.scrollX + tooltip.caretX) + 'px';
                        tooltipEl.style.top = (canvasRect.top + window.scrollY + tooltip.caretY) + 'px';
                    }
                };
                const FilterHandler = {
                    init() {
                        const { filters } = dashboardConfig;
                        const now = new Date();
                        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                        const defaultFilters = { startDate: startOfMonth, endDate: now, region: filters.region.defaultValue, sales_category: filters.sales_category.defaultValue, client_type: filters.client_type.defaultValue };
                        StateManager.setState('filters', defaultFilters);
                    },
                };

                const ConfigValidator = {
                    validate(config) {
                        if (!config.title) throw new Error("`title` is missing.");
                        if (!Array.isArray(config.kpis)) throw new Error("`kpis` must be an array.");
                        if (!Array.isArray(config.layout)) throw new Error("`layout` must be an array.");
                        config.kpis.forEach((kpi, i) => { if (!kpi.id || !kpi.dataKey || !kpi.label) throw new Error(`KPI at index ${i} is missing required keys (id, dataKey, label).`); });
                        config.layout.forEach((item, i) => {
                            if (!item.type || !item.width || !item.config) throw new Error(`Layout item at index ${i} is missing required keys (type, width, config).`);
                            const chartConfig = item.config;
                            if (chartConfig.drilldownConfig && !Array.isArray(chartConfig.drilldownConfig.columns)) { throw new Error(`Drilldown config for chart '${chartConfig.id}' is missing a 'columns' array.`); }
                            if (typeof chartConfig.transformer !== 'function' && !SharedTransformers[chartConfig.transformer]) { throw new Error(`Transformer for chart '${chartConfig.id}' must be a function or a key in SharedTransformers.`); }
                        });
                    }
                };

                return { init };
            })();

            APP_CORE.init();
        })();
    </script>
</body>

<html lang="en">

<body>

    <div id="main-dashboard-content" class="container-fluid py-4 modal-body">

            <div class="d-flex align-items-center ms-auto">
                <!-- 1. Job/Value Toggle -->
                <!--<div class="btn-group otif-toggle-group me-2" id="jobValueToggle" role="group">
                    <input type="radio" class="btn-check" name="jobValueType" id="jobType" checked>
                    <label class="btn" for="jobType">Job</label>
                    <input type="radio" class="btn-check" name="jobValueType" id="valueType">
                    <label class="btn" for="valueType">Value</label>
                </div> -->

                <!-- 2. Moving Average Dropdown -->

    <div class="modal fade" id="docFormModal" tabindex="-1">

                    <h5 class="modal-title" id="docFormModalLabel"></h5><button type="button" class="btn-close"

    <!-- UI ELEMENTS -->

    <div id="filter-popup-panel" class="d-none">

            <h6 class="otif-filter-panel-title mb-0 m-auto">Filters</h6>
            <button type="button" class="btn-close position-absolute end-0 top-50 translate-middle-y me-2"

        <div class="flex-grow-1" style="overflow-y: auto;">
            <div class="p-2">
                <div class="filter-section" id="dropdown-filters-section"></div>
                <div class="filter-section">
                    <div id="calendar-container">
                        <div id="calendar-view">
                            <div class="calendar-header">
                                <button type="button" class="btn btn-today" id="today-btn">Today</button>
                                <div class="d-flex align-items-center">
                                    <button id="prev-month-btn" class="btn btn-icon" type="button"><i
                                            class="bi bi-chevron-left"></i></button>
                                    <div id="month-year-selector" class="month-year-selector-btn">
                                        <span id="month-year-display" class="month-year-text"></span>
                                    </div>
                                    <button id="next-month-btn" class="btn btn-icon" type="button"><i
                                            class="bi bi-chevron-right"></i></button>
                                </div>
                            </div>
                            <div class="calendar-grid day-names">
                                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                            </div>
                            <div id="calendar-grid" class="calendar-grid"></div>
                        </div>
                        <!-- Month/Year Picker Overlay (Hidden by default) -->
                        <div id="month-year-picker-overlay" class="d-none">
                            <div class="picker-header">
                                <span>Select Date</span>
                                <button type="button" class="btn btn-apply btn-sm" id="picker-done-btn">Done</button>
                            </div>
                            <div class="picker-body">
                                <div class="picker-column" id="picker-month-column">
                                    <div class="picker-column-header">Month</div>
                                    <!-- Months will be rendered by JS -->
                                </div>
                                <div class="picker-column" id="picker-year-column">
                                    <div class="picker-column-header">Year</div>
                                    <!-- Years will be rendered by JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="date-range-display" class="date-range-box">
                        <div class="date-range-item"><label>From</label><span id="selected-from-date">--</span></div>
                        <div class="date-range-item"><label>To</label><span id="selected-to-date">--</span></div>
                    </div>
                    <div class="p-2 d-flex gap-2">
                        <button type="button" class="btn btn-reset w-100" id="reset-filters-btn-new">Reset</button>
                        <button type="button" class="btn btn-apply w-100" id="apply-filters-btn-new">Apply</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard-filters.js"></script>
    <script>

        const dashboardApp = (function () {

            const Utils = {
                formatMetric(value, format, suffix = '') {
                    if (value === null || value === undefined) return 'N/A';

                    if (format === 'currency_compact') {
                        if (Math.abs(value) >= 10000000) { // Crore
                            return (value / 10000000).toFixed(2) + ' Cr';
                        }
                        if (Math.abs(value) >= 100000) { // Lakh
                            return (value / 100000).toFixed(2) + ' L';
                        }
                        if (Math.abs(value) >= 1000) { // Thousand
                            return (value / 1000).toFixed(1) + ' K';
                        }
                        return value.toLocaleString('en-US');
                    }

                    if (format === 'currency') return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(value);
                    if (format === 'date') return new Date(value).toLocaleString('en-GB');
                    if (typeof value === 'number') return value.toLocaleString('en-US');
                    return `${value}${suffix}`;
                }, hexToRgb(hex) {
                    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex.trim());
                    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
                },
                getComponentConfig: (id, dashboardConfig) => dashboardConfig.kpis.find(c => c.id === id) || dashboardConfig.layout.find(c => c.config.id === id)?.config,

                // --- ADDED: Shared deepMerge utility ---
                deepMerge(target, source) {
                    const isObject = (obj) => obj && typeof obj === 'object' && !Array.isArray(obj);
                    let output = { ...target };
                    if (isObject(target) && isObject(source)) {
                        Object.keys(source).forEach(key => {
                            if (isObject(source[key])) {
                                if (key in target) {
                                    output[key] = this.deepMerge(target[key], source[key]);
                                } else {
                                    Object.assign(output, { [key]: source[key] });
                                }
                            } else {
                                Object.assign(output, { [key]: source[key] });
                            }
                        });
                    }
                    return output;
                }
            };
            // ========================================================================================================
            // SECTION 1: CONFIGURATION (THE ONLY PART TO EDIT FOR A NEW DASHBOARD)
            // This section simulates `config.js`.
            // ========================================================================================================

            const SharedTransformers = {
                transformForPareto: (data) => {
                    const sortedData = [...data].sort((a, b) => b.count - a.count);
                    const labels = sortedData.map(d => d.reason);
                    const counts = sortedData.map(d => d.count);
                    const total = counts.reduce((sum, val) => sum + val, 0);
                    let cumulative = 0;
                    const cumulativePercentage = counts.map(count => { cumulative += count; return total > 0 ? (cumulative / total) * 100 : 0; });
                    const primaryColor = '#003366';
                    const secondaryColor = '#9E9E9E';
                    let eightyPercentReached = false;
                    const backgroundColors = cumulativePercentage.map(p => {
                        if (eightyPercentReached) return secondaryColor;
                        if (p >= 80) eightyPercentReached = true;
                        return primaryColor;
                    });
                    return {
                        labels,
                        datasets: [
                            { type: 'bar', label: 'Value', data: counts, backgroundColor: backgroundColors, yAxisID: 'y', order: 2 },
                            { type: 'line', label: 'Cumulative %', data: cumulativePercentage, borderColor: '#EF4444', tension: 0.4, yAxisID: 'y1', order: 1, pointBackgroundColor: '#EF4444' }
                        ]
                    };
                }
            };
            const CONFIGURATION = (() => {
                /**
                 * HOW TO USE THIS TEMPLATE:
                 * 1.  Update `dashboardTitle` with the title for your dashboard.
                 * 2.  Define your Key Performance Indicators (KPIs) in the `kpiConfig` array.
                 * 3.  Define your chart layout and configurations in the `layoutConfig` array.
                 * 4.  Update the `DATA_PROVIDER` section to connect to your live backend API.
                 * 5.  Ensure your data provider returns data objects with keys that match the `dataKey` properties defined here.
                 */
                const kpiConfig = [
                    {
                        id: 'kpi-1', dataKey: 'net_fg', label: 'Net FG', cssVar: '--glow-green',
                        secondaryMetrics: [{ icon: 'bi-box-seam', dataKey: 'delivered', label: 'Delivered' }, { icon: 'bi-hourglass-split', dataKey: 'undelivered', label: 'Undelivered' }],
                        guide: { title: 'Net Finished Goods', definition: 'The total quantity of finished goods that have been produced and are either delivered or pending delivery.', interpretation: 'Represents the total output of production available to fulfill orders.', calculation: 'Delivered Quantity + Undelivered Quantity' },
                        drilldownConfig: {
                            dataKey: 'net_fg_details',
                            columns: [
                                { key: 'product_sku', label: 'Product SKU' }, { key: 'description', label: 'Description' },
                                { key: 'status', label: 'Status' }, { key: 'quantity', label: 'Quantity' }, { key: 'location', label: 'Location' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-2', dataKey: 'schedule_adherence', label: 'Schedule Adherence', valueSuffix: ' Jobs', cssVar: '--glow-orange',
                        secondaryMetrics: [{ icon: 'bi-exclamation-triangle', dataKey: 'critical', label: 'Critical' }, { icon: 'bi-clock-history', dataKey: 'delayed', label: 'Delayed' }],
                        guide: { title: 'Schedule Adherence', definition: 'The total count of dispatch jobs, categorized by their status relative to the schedule.', interpretation: 'Provides a snapshot of operational performance against planned timelines.', calculation: 'Sum of jobs in all status categories.' },
                        drilldownConfig: {
                            dataKey: 'schedule_adherence_details',
                            columns: [
                                { key: 'order_id', label: 'Order ID' }, { key: 'client', label: 'Client' }, { key: 'status', label: 'Status' },
                                { key: 'scheduled_date', label: 'Scheduled', format: 'date' }, { key: 'actual_date', label: 'Actual', format: 'date' }
                            ],
                            filters: [{ label: 'All', value: 'all', default: true }, { label: 'On Time', value: 'On Time' }, { label: 'Delayed', value: 'Delayed' }, { label: 'Critical', value: 'Critical' }, { label: 'Early', value: 'Early' }]
                        }
                    },
                    {
                        id: 'kpi-3', dataKey: 'on_time_percent', label: 'On Time %', valueSuffix: '%', cssVar: '--glow-lightblue',
                        secondaryMetrics: [{ icon: 'bi-calendar-check', dataKey: 'on_time_orders', label: 'On-Time' }, { icon: 'bi-box-seam', dataKey: 'total_orders', label: 'Total' }],
                        guide: { title: 'On Time Percentage', definition: 'The percentage of orders dispatched on or before the scheduled date.', interpretation: 'A primary measure of logistical reliability.', calculation: '(On-Time Orders / Total Orders) * 100' },
                        drilldownConfig: {
                            dataKey: 'on_time_details',
                            columns: [
                                { key: 'order_id', label: 'Order ID' }, { key: 'client', label: 'Client' },
                                { key: 'scheduled_dod', label: 'Scheduled DOD', format: 'date' }, { key: 'actual_dispatch', label: 'Actual Dispatch', format: 'date' }, { key: 'variance_days', label: 'Variance (Days)' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-4', dataKey: 'in_full_percent', label: 'In Full %', valueSuffix: '%', cssVar: '--glow-red',
                        secondaryMetrics: [{ icon: 'bi-check-all', dataKey: 'in_full_orders', label: 'In-Full' }, { icon: 'bi-box-seam', dataKey: 'total_orders', label: 'Total' }],
                        guide: { title: 'In Full Percentage', definition: 'The percentage of orders delivered with the complete quantity requested by the customer.', interpretation: 'Measures order accuracy and inventory management effectiveness.', calculation: '(Orders Delivered In Full / Total Orders) * 100' },
                        drilldownConfig: {
                            dataKey: 'in_full_details',
                            columns: [
                                { key: 'order_id', label: 'Order ID' }, { key: 'client', label: 'Client' }, { key: 'status', label: 'Status' },
                                { key: 'ordered_qty', label: 'Ordered Qty' }, { key: 'shipped_qty', label: 'Shipped Qty' }
                            ]
                        }
                    },
                    {
                        id: 'kpi-5', dataKey: 'invoicing_percent', label: 'Invoicing %', valueSuffix: '%', cssVar: '--glow-purple',
                        secondaryMetrics: [{ icon: 'bi-receipt', dataKey: 'invoiced_orders', label: 'Invoiced' }, { icon: 'bi-truck', dataKey: 'delivered_orders', label: 'Delivered' }],
                        guide: { title: 'Invoicing Percentage', definition: 'The percentage of delivered orders for which an invoice has been successfully generated and sent.', interpretation: 'Tracks the efficiency of the order-to-cash cycle.', calculation: '(Invoiced Orders / Total Delivered Orders) * 100' },
                        drilldownConfig: {
                            dataKey: 'invoicing_details',
                            columns: [
                                { key: 'order_id', label: 'Order ID' }, { key: 'client', label: 'Client' },
                                { key: 'delivery_date', label: 'Delivery Date', format: 'date' }, { key: 'invoice_status', label: 'Invoice Status' }, { key: 'invoice_date', label: 'Invoice Date', format: 'date' }
                            ]
                        }
                    }
                ];

                const layoutConfig = [
                    {
                        type: 'chart', width: 'col-lg-6',
                        config: {
                            id: 'scheduled-vs-actual-dispatch', chartType: 'line', title: 'Scheduled vs. Actual Dispatch (Weekly)',
                            dataKey: 'dispatch_timeseries_data',
                            transformer: (data) => ({
                                labels: data.map(d => d.week_label),
                                datasets: [
                                    {
                                        label: 'Actual Dispatch',
                                        data: data.map(d => d.actual),
                                        borderColor: '#003366',
                                        backgroundColor: '#003366',
                                        fill: false,
                                        tension: 0.3,
                                        type: 'line'
                                    },
                                    {
                                        label: 'Scheduled Dispatch',
                                        data: data.map(d => d.scheduled),
                                        backgroundColor: '#54ACBF',
                                        type: 'bar'
                                    }
                                ]
                            }),
                            options: {
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        title: { display: true, text: 'Value (INR)' },
                                        ticks: {
                                            callback: function (value) {
                                                if (value >= 10000000) return (value / 10000000).toFixed(1) + 'Cr';
                                                if (value >= 100000) return (value / 100000).toFixed(1) + 'L';
                                                return value;
                                            }
                                        }
                                    },
                                    x: { grid: { display: false }, title: { display: true, text: 'Week' } }
                                }
                            },
                            drilldownConfig: {
                                dataKey: 'dispatch_timeseries_details',
                                columns: [
                                    { key: 'order_id', label: 'Order ID' }, { key: 'client', label: 'Client' },
                                    { key: 'scheduled_date', label: 'Scheduled', format: 'date' }, { key: 'actual_date', label: 'Actual', format: 'date' },
                                    { key: 'value', label: 'Value', format: 'currency' }, { key: 'status', label: 'Status' }
                                ],
                                filters: [{ label: 'All', value: 'all', default: true }, { label: 'On Time', value: 'On Time' }, { label: 'Delayed', value: 'Delayed' }]
                            }
                        }
                    },
                    {
                        type: 'chart', width: 'col-lg-6',
                        config: {
                            id: 'dispatch-delay-reasons', chartType: 'bar', title: 'Top 5 Reasons for Dispatch Delay',
                            dataKey: 'dispatch_delay_reasons_data',
                            transformer: (data) => {
                                const sortedData = [...data].sort((a, b) => b.count - a.count);
                                return {
                                    labels: sortedData.map(d => d.reason),
                                    datasets: [{
                                        label: 'Number of Incidents', data: sortedData.map(d => d.count),
                                        backgroundColor: '#023859'
                                    }]
                                };
                            },
                            options: {
                                indexAxis: 'y',
                                plugins: { legend: { display: false } },
                                scales: {
                                    x: { beginAtZero: true, title: { display: true, text: 'Number of Incidents' } },
                                    y: {
                                        grid: { display: false },
                                        ticks: {
                                            autoSkip: false,
                                            callback: function (value) {
                                                const label = this.getLabelForValue(value);
                                                return label.length > 15 ? label.substring(0, 15) + '...' : label;
                                            }
                                        }
                                    }
                                }
                            },
                            drilldownConfig: {
                                dataKey: 'dispatch_delay_details',
                                columns: [
                                    { key: 'incident_id', label: 'Incident ID' }, { key: 'reason', label: 'Reason' },
                                    { key: 'department', label: 'Department' }, { key: 'impact_days', label: 'Delay (Days)' },
                                    { key: 'status', label: 'Status' }
                                ],
                                filterMapping: 'reason' // Filter drilldown data by the clicked reason
                            }
                        }
                    },
                    {
                        type: 'chart', width: 'col-lg-6',
                        config: {
                            id: 'dispatch-funnel', chartType: 'bar', title: 'Dispatch Funnel',
                            dataKey: 'dispatch_funnel_data',
                            transformer: (data) => ({
                                labels: data.map(d => d.stage),
                                datasets: [{
                                    label: 'Volume', data: data.map(d => d.value),
                                    backgroundColor: ['#26658C', '#54ACBF', '#023859', '#A7EBF2']
                                }]
                            }),
                            options: {
                                indexAxis: 'y',
                                plugins: { legend: { display: false } },
                                scales: {
                                    x: { beginAtZero: true, title: { display: true, text: 'Volume' } },
                                    y: { grid: { display: false } }
                                }
                            },
                            drilldownConfig: {
                                dataKey: 'dispatch_funnel_details',
                                columns: [
                                    { key: 'order_id', label: 'Order ID' }, { key: 'client', label: 'Client' },
                                    { key: 'stage', label: 'Stage' }, { key: 'value', label: 'Value', format: 'currency' },
                                    { key: 'last_updated', label: 'Last Updated', format: 'date' }
                                ],
                                filterMapping: 'stage' // Filter drilldown data by the clicked stage

                                if (config.drilldownTarget) { finalOptions.onClick = () => initiateDrilldown(config.drilldownTarget); }

                // --- ADDED: New orchestrator function for all drilldown actions ---
                function initiateDrilldown(componentId, context = {}) {
                    const config = Utils.getComponentConfig(componentId, dashboardConfig);

                    if (config.drilldownTarget && !context.dataIndex) {
                        return initiateDrilldown(config.drilldownTarget);
                    }

                    const drilldownConfig = config?.drilldownConfig;
                    if (!drilldownConfig) {
                        alert(`No drilldown configured.`);
                        return; // Added return to prevent further execution
                    }

                    const { dataKey, columns, filters, docFormConfig, filterMapping } = drilldownConfig;
                    let title = `Detailed View: ${config.label || config.title}`;
                    const rawData = StateManager.getState(dataKey);

                    if (!rawData) {
                        alert(`No detailed data available.`);
                        return; // Added return 
                    }

                    let filteredData = [...rawData];

                    // --- NEW: Chart Filtering Logic (Matches Pre-Press logic) ---
                    if (context.dataIndex !== undefined) {
                        const chart = chartInstances[componentId];
                        if (chart && chart.data.labels[context.dataIndex] !== undefined) {
                            const label = chart.data.labels[context.dataIndex];
                            title += ` (${label})`; // Add context to the title

                            // Special handling for monthly filtering
                            if (filterMapping === 'date_month_short') {
                                filteredData = rawData.filter(item => {
                                    // Check if item has a date property, handle both string and Date objects
                                    const dateVal = item.date || item.scheduled_date || item.actual_date; // Heuristic fallback
                                    if (!dateVal) return false;
                                    const d = new Date(dateVal);
                                    return d.toLocaleString('default', { month: 'short' }) === label;
                                });
                            }
                            // Generic property filtering
                            else if (filterMapping) {
                                // Handles nested properties if needed, but simple key access is standard
                                // Also handles "Reason" maps where the label is the reason
                                filteredData = rawData.filter(item => {
                                    const itemValue = item[filterMapping];
                                    // String comparison (trim to be safe)
                                    return String(itemValue).trim() === String(label).trim();
                                });

                                // Regex Fallback for complex labels (e.g. "PFP Done (15)") -> matches "PFP Done"
                                if (filteredData.length === 0 && typeof label === 'string') {
                                    // Try to match start of string
                                    filteredData = rawData.filter(item => label.startsWith(item[filterMapping]));
                                }
                            }
                        }
                    }

                    // --- NEW: Column Normalizer ---
                    // DevExtreme Grid expects `dataField` and `caption`. We support `key` and `label` for backward compat.
                    const normalizedColumns = columns.map(col => ({
                        ...col,
                        dataField: col.dataField || col.key,
                        caption: col.caption || col.label,
                        // Infer data type from format if missing
                        dataType: col.dataType || (col.format === 'date' ? 'date' : (col.format === 'currency' || col.format === 'number' ? 'number' : undefined)),
                        // Carry over formatting for grid (simple currency/date)
                        format: col.format === 'currency' ? { type: 'currency', currency: 'USD', precision: 0 } : (col.format === 'date' ? 'dd-MMM-yyyy' : undefined)
                    }));

                    const finalDrilldownConfig = {
                        ...drilldownConfig,
                        columns: normalizedColumns,
                        // Default to grid render unless specified otherwise
                        renderAs: drilldownConfig.renderAs || 'grid'
                    };

                    DrilldownService.show(title, finalDrilldownConfig, filteredData);
                }

                const DocFormHandler = {
                    show(docId, config) {
                        const data = rawData.find(item => item.id === docId);
                        if (!data) { alert(`Details for ${docId} not found.`); return; }
                        const bodyHtml = `<div class="row">${config.fields.map(field => `<div class="col-md-6 form-readonly-group"><label>${field.label}</label><input type="text" class="form-control" value="${Utils.formatMetric(data[field.key], field.format)}" readonly></div>`).join('')}</div>`;
                        document.getElementById('docFormModalLabel').textContent = `Details for: ${docId}`;

                        modals.docFormModal.show();

                };

                const ExpandChartHandler = {

                        const ctx = document.getElementById('expandedChartCanvas').getContext('2d');
                        const chartData = JSON.parse(JSON.stringify(originalChart.data));

                        const originalOptions = originalChart.config.options;
                        const expansionOverrides = {

                            maintainAspectRatio: false,

                                legend: { display: true },

                            }

                        const finalOptions = Utils.deepMerge(JSON.parse(JSON.stringify(originalOptions)), expansionOverrides);

                        const isKpiCard = dashboardConfig.kpis.some(k => k.id === componentId);
                        if (isKpiCard) {
                            const kpiData = StateManager.getState('kpiData')[config.dataKey];
                            if (kpiData && kpiData.trend_labels) {

                        }

                        document.getElementById('expandChartModalLabel').textContent = `Expanded View: ${config.label || config.title}`;

                        if (chartInstances['expandedChart']) chartInstances['expandedChart'].destroy();
                        chartInstances['expandedChart'] = new Chart(ctx, { type: originalChart.config.type, data: chartData, options: finalOptions });
                        modals.expandChartModal.show();
                    }
                };

                const GuideHandler = { show(kpiConfig) { if (!kpiConfig?.guide) { alert('No guide available for this KPI.'); return; } const { title, definition, interpretation, calculation } = kpiConfig.guide; document.getElementById('kpiGuideModalLabel').textContent = `Guide: ${title}`; document.getElementById('guide-definition').textContent = definition; document.getElementById('guide-interpretation').textContent = interpretation; document.getElementById('guide-calculation').textContent = calculation; modals.kpiGuideModal.show(); } };

                const InteractivityHandler = {
                    init() {
                        const mainContent = document.getElementById('main-dashboard-content');
                        const modalIds = ['drilldownModal', 'expandChartModal', 'kpiGuideModal', 'docFormModal'];

                        modalIds.forEach(id => {

                        });
                        const menu = document.getElementById('customContextMenu');
                        const tooltipEl = document.getElementById('custom-tooltip');
                        const drilldownModalEl = document.getElementById('drilldownModal');
                        const hideMenu = () => menu.style.display = 'none';
                        const hideTooltip = () => { if (tooltipEl) { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; } };
                        document.addEventListener('click', hideMenu);
                        document.addEventListener('keydown', e => e.key === 'Escape' && hideMenu());
                        document.body.addEventListener('contextmenu', e => { const target = e.target.closest('.context-menu-target'); if (target) { e.preventDefault(); this.showContextMenu(e, target.dataset.componentId); } });
                        document.body.addEventListener('click', e => {

                        tooltipEl.addEventListener('mouseenter', () => clearTimeout(tooltipHideTimer));

                        document.getElementById('drilldownFilterControls').addEventListener('change', e => { if (e.target.name === 'drilldownFilter') { const filterValue = e.target.value; document.getElementById('drilldownTbody').querySelectorAll('tr').forEach(row => { row.style.display = (filterValue === 'all' || row.dataset.status === filterValue) ? '' : 'none'; }); } });

                        // --- FIX: Add delegated event listener for drilldown table rows ---
                        drilldownModalEl.addEventListener('click', e => {
                            const row = e.target.closest('tr[data-doc-id]');
                            const configStr = drilldownModalEl.querySelector('.modal-body').dataset.docFormConfig;
                            if (row && configStr) {
                                const config = JSON.parse(configStr);
                                DocFormHandler.show(row.dataset.docId, config);
                            }
                        });

                        drilldownModalEl.addEventListener('hidden.bs.modal', () => {
                            const modalBody = drilldownModalEl.querySelector('.modal-body');
                            if (modalBody.dataset.docFormConfig) {
                                delete modalBody.dataset.docFormConfig;
                            }
                        });

                        document.getElementById('docFormModal').addEventListener('hidden.bs.modal', () => modals.drilldownModal.classList.remove('is-blurred'));
                        document.getElementById('expandChartModal').addEventListener('hidden.bs.modal', () => {
                            if (chartInstances['expandedChart']) {
                                chartInstances['expandedChart'].destroy();
                                chartInstances['expandedChart'] = null;
                            }
                        });
                    },
                    showContextMenu(event, componentId) {
                        const config = Utils.getComponentConfig(componentId, dashboardConfig);
                        const menu = document.getElementById('customContextMenu');
                        const menuList = document.getElementById('contextMenuList');
                        const componentActions = config?.actions || dashboardConfig.contextMenu.actions.map(a => a.id);
                        let actions = dashboardConfig.contextMenu.actions.filter(a => componentActions.includes(a.id) || a.type === 'separator');

                        const renderItems = items => items.map(a =>
                            a.type === 'separator' ? '<li class="context-menu-separator"></li>' :
                                `<li class="context-menu-item" data-action="${a.id}">
                                <i class="bi ${a.icon}"></i>
                                <span>${a.label}</span>
                                ${a.submenu ? `<i class="bi bi-chevron-right"></i><ul class="context-menu-sublist">${renderItems(a.submenu)}</ul>` : ''}
                            </li>`
                        ).join('');

                        menuList.innerHTML = renderItems(actions);

                        // Add click listeners to items
                        menu.querySelectorAll('.context-menu-item').forEach(item => {
                            if (!item.querySelector('.context-menu-sublist')) {
                                item.addEventListener('click', () => {
                                    this.handleContextMenuAction(item.dataset.action, componentId);
                                    menu.style.display = 'none'; // Close menu after action
                                });
                            }
                        });

                        menu.style.visibility = 'hidden';
                        menu.style.display = 'block';

                        const { offsetWidth: menuW, offsetHeight: menuH } = menu;
                        const { clientX: mouseX, clientY: mouseY } = event;
                        const { innerWidth: viewportW, innerHeight: viewportH } = window;

                        // Positioning logic to keep menu on screen
                        let finalLeft = mouseX;
                        if ((mouseX + menuW) > viewportW) {
                            finalLeft = mouseX - menuW;
                        }

                        let finalTop = mouseY;
                        if ((mouseY + menuH) > viewportH) {
                            finalTop = mouseY - menuH;
                        }

                        menu.style.left = `${finalLeft + window.scrollX}px`;
                        menu.style.top = `${finalTop + window.scrollY}px`;
                        menu.style.visibility = 'visible';
                    },
                    handleContextMenuAction(action, componentId) {
                        const config = Utils.getComponentConfig(componentId, dashboardConfig);
                        const chart = chartInstances[componentId];
                        switch (action) {
                            case 'drilldown': initiateDrilldown(componentId); break;
                            case 'refresh': initialDataFetch(); break;
                            case 'expand': ExpandChartHandler.show(componentId); break;
                            case 'guide': if (config.guide) GuideHandler.show(config); break;
                            case 'share': window.location.href = `mailto:?subject=Dashboard Insight: ${config.label || config.title}&body=Review data for ${config.label || config.title}.`; break;
                            case 'export-png': if (chart) { const a = document.createElement('a'); a.href = chart.toBase64Image(); a.download = `${componentId}.png`; a.click(); } break;
                            case 'export-pdf': alert(`PDF Export triggered for ${componentId}. (Requires jsPDF integration)`); break;
                            case 'ai-insight': alert(`AI analyzing trends for ${config.label || config.title}...`); break;
                            default: console.warn(`Action '${action}' not handled.`);
                        }
                    },

                    customTooltip(context) {
                        const { chart, tooltip } = context;
                        const tooltipEl = document.getElementById('custom-tooltip');
                        clearTimeout(tooltipHideTimer);
                        if (tooltip.opacity === 0) { tooltipHideTimer = setTimeout(() => { tooltipEl.style.opacity = 0; tooltipEl.style.pointerEvents = 'none'; }, 500); return; }

                        const titleEl = tooltipEl.querySelector('.tooltip-main-title');
                        const headerEl = tooltipEl.querySelector('.tooltip-header');
                        const valueEl = tooltipEl.querySelector('.tooltip-value');
                        const seriesTitleEl = tooltipEl.querySelector('.tooltip-title');
                        const deltaEl = tooltipEl.querySelector('.tooltip-delta');
                        const footerEl = tooltipEl.querySelector('.tooltip-footer');

                        headerEl.style.display = 'flex';
                        deltaEl.style.display = 'none';
                        footerEl.innerHTML = '';
                        footerEl.style.display = 'none';

                        const isPareto = chart.data.datasets.some(ds => ds.type === 'line') && chart.data.datasets.some(ds => ds.type === 'bar');

                        if (isPareto) {
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            headerEl.style.display = 'none';
                            valueEl.textContent = '';

                            const footerContent = tooltip.dataPoints.map(dp => {
                                const isPercentage = dp.dataset.label.includes('%');
                                const value = isPercentage ? `${dp.raw.toFixed(1)}%` : Utils.formatMetric(dp.raw, 'currency');
                                return `<div class="footer-row"><span>${dp.dataset.label}</span><span>${value}</span></div>`;
                            }).join('');
                            footerEl.innerHTML = footerContent;

                            if (chart.canvas.id === 'client-billing-delay-pareto') {
                                const clientName = tooltip.title[0];
                                const rawData = StateManager.getState('client_billing_delay_data');
                                const clientData = rawData.find(d => d.client === clientName);
                                if (clientData) {
                                    footerEl.innerHTML += `<div class="footer-row"><span>Avg. Delay</span><span>${clientData.avg_delay_days} Days</span></div>`;
                                }
                            }
                            footerEl.style.display = 'flex';
                        } else {
                            const dp = tooltip.dataPoints[0];
                            if (!dp) return;
                            titleEl.textContent = tooltip.title.join(' ') || '';
                            seriesTitleEl.textContent = dp.dataset.label || '';
                            valueEl.textContent = Utils.formatMetric(dp.raw);
                            const prev = dp.dataIndex > 0 ? chart.data.datasets[dp.datasetIndex].data[dp.dataIndex - 1] : null;
                            if (prev !== null && prev !== 0 && typeof dp.raw === 'number') { const change = ((dp.raw - prev) / prev) * 100, isPos = change >= 0; deltaEl.className = `tooltip-delta ${isPos ? 'positive' : 'negative'}`; deltaEl.innerHTML = `<i class="bi ${isPos ? 'bi-arrow-up' : 'bi-arrow-down'}"></i> ${Math.abs(change).toFixed(1)}%`; deltaEl.style.display = 'flex'; }
                            const footerContent = chart.data.datasets.map((ds, i) => i !== dp.datasetIndex && ds.data[dp.dataIndex] !== undefined ? `<div class="footer-row"><span>${ds.label}</span><span>${Utils.formatMetric(ds.data[dp.dataIndex])}</span></div>` : null).filter(Boolean);
                            if (footerContent.length > 0) { footerEl.innerHTML = footerContent.join(''); footerEl.style.display = 'flex'; }
                        }

                        tooltipEl.querySelector('.drilldown-btn').onclick = () => initiateDrilldown(chart.canvas.id, { dataIndex: tooltip.dataPoints[0].dataIndex });
                        const canvasRect = chart.canvas.getBoundingClientRect();
                        tooltipEl.style.opacity = 1;
                        tooltipEl.style.pointerEvents = 'all';
                        tooltipEl.style.left = `${canvasRect.left + window.scrollX + tooltip.caretX}px`;
                        // Modified top position to be slightly higher (closer to cursor) to bridge the gap
                        tooltipEl.style.top = `${canvasRect.top + window.scrollY + tooltip.caretY - 10}px`;
                    }
                };


                const ConfigValidator = {
                    validate(config) {
                        if (!config.title) throw new Error("`title` is missing.");
                        if (!Array.isArray(config.kpis)) throw new Error("`kpis` must be an array.");
                        if (!Array.isArray(config.layout)) throw new Error("`layout` must be an array.");
                        config.kpis.forEach((kpi, i) => {
                            if (!kpi.id || !kpi.dataKey || !kpi.label) throw new Error(`KPI at index ${i} is missing required keys (id, dataKey, label).`);
                        });
                        config.layout.forEach((item, i) => {
                            if (!item.type || !item.width || !item.config) throw new Error(`Layout item at index ${i} is missing required keys (type, width, config).`);
                            const chartConfig = item.config;
                            if (chartConfig.drilldownConfig && !Array.isArray(chartConfig.drilldownConfig.columns)) {
                                throw new Error(`Drilldown config for chart '${chartConfig.id}' is missing a 'columns' array.`);
                            }
                            if (typeof chartConfig.transformer !== 'function' && !SharedTransformers[chartConfig.transformer]) {
                                throw new Error(`Transformer for chart '${chartConfig.id}' must be a function or a key in SharedTransformers.`);
                            }
                        });
                    }
                };

                return {
                    init,
                    refresh: initialDataFetch
                };
            })();

            // Initialize the application
            APP_CORE.init();

            // Initialize Dashboard Filters (Moved outside init for standardization)
            if (typeof DashboardFilters !== 'undefined') {
                DashboardFilters.init({
                    container: '#main-dashboard-content',
                    movingAverage: {
                        enabled: true,
                        dropdownSelector: '#ma-dropdown-container',
                        buttonTextSelector: '#maButtonText',
                        weekOptionsContainer: '#maWeekOptions',
                        period: 13,
                        maxWeeks: 52
                    },
                    timeFilters: {
                        enabled: true,
                        containerSelector: '#timeFilterContainer'
                    },
                    customFilters: {
                        enabled: true,
                        filters: [
                            { id: 'salesCategory', label: 'Sales Category', dataSource: ['Domestic', 'Export'], type: 'select' },
                            { id: 'productionUnit', label: 'Production Unit', dataSource: ['Faridabad – DTA', 'Faridabad – EOU', 'C-35 Noida', 'HCBF', 'Thomson Press (ISD)'], type: 'select' }
                        ]
                    },
                    filterPanel: {
                        enabled: true,
                        toggleButtonSelector: '#toggle-filter-panel-btn'
                    },
                    onFilterChange: (filters) => {
                        console.log('Filters Changed:', filters);
                        APP_CORE.refresh(filters);
                    }
                });
            }
        })();
    </script>
</body>

</html>

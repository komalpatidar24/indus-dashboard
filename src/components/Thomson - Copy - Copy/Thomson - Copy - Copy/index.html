<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Dashboards Platform</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --app-primary-color: #003366;
            --sidebar-width: 260px;
            --header-height: 60px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Hide main scroll, let iframe scroll */
        }

        #app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar Styles */
        #sidebar {
            width: var(--sidebar-width);
            background-color: #ffffff;
            border-right: 1px solid #E5E7EB;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            border-bottom: 1px solid #E5E7EB;
            background-color: var(--app-primary-color);
            color: white;
        }

        .sidebar-header h5 {
            margin: 0;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }

        .sidebar-menu {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .menu-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #9CA3AF;
            padding: 0.5rem 1.5rem;
            margin-top: 0.5rem;
            letter-spacing: 0.05em;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            color: #4B5563;
            text-decoration: none;
            transition: all 0.2s ease;
            gap: 0.75rem;
            cursor: pointer;
            border-left: 4px solid transparent;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .menu-item:hover {
            background-color: #F3F4F6;
            color: var(--app-primary-color);
        }

        .menu-item.active {
            background-color: #E0F2FE;
            color: var(--app-primary-color);
            border-left-color: var(--app-primary-color);
            font-weight: 600;
        }

        .menu-item i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        /* Main Content Styles */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #F8FAFC;
        }

        .top-header {
            height: var(--header-height);
            background-color: #ffffff;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
            z-index: 5;
        }

        .top-header h4 {
            margin: 0;
            color: var(--app-primary-color);
            font-weight: 700;
            font-size: 1.25rem;
        }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 100;
        }

        .iframe-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - var(--header-height));
        }

        #dashboard-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
            display: block;
        }
    </style>
</head>

<body>

    <div id="app-container">
        <!-- Sidebar Navigation -->
        <div id="sidebar">
            <div class="sidebar-header">
                <h5><i class="bi bi-grid-fill me-2"></i> Control Cockpit</h5>
            </div>
            <div class="sidebar-menu" id="sidebar-menu">

                <div class="menu-label">Operations</div>

                <a class="menu-item active" data-src="Sales and CRM - Domestic.html" data-title="Sales and CRM">
                    <i class="bi bi-graph-up-arrow"></i> Sales and CRM
                </a>
                <a class="menu-item" data-src="Quotation Dashboard.html" data-title="Quotation Dashboard">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Quotation Dashboard
                </a>
                <a class="menu-item" data-src="Production Dashboard.html" data-title="Production Dashboard">
                    <i class="bi bi-gear-fill"></i> Production Dashboard
                </a>
                <a class="menu-item" data-src="Store and Inventory Dashboard.html" data-title="Store & Inventory">
                    <i class="bi bi-box-seam"></i> Store & Inventory
                </a>
                <a class="menu-item" data-src="Purchase Dashboard.html" data-title="Purchase Dashboard">
                    <i class="bi bi-cart-check-fill"></i> Purchase
                </a>
                <a class="menu-item" data-src="Dispatch Dashboard.html" data-title="Dispatch Dashboard">
                    <i class="bi bi-truck"></i> Dispatch
                </a>

                <div class="menu-label">Finance & Performance</div>

                <a class="menu-item" data-src="Costing Dashboard.html" data-title="Costing Dashboard">
                    <i class="bi bi-currency-dollar"></i> Costing
                </a>
                <a class="menu-item" data-src="Final OTIF code.html" data-title="Final OTIF">
                    <i class="bi bi-clock-history"></i> Final OTIF
                </a>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="main-content">
            <div class="top-header">
                <h4 id="current-dashboard-title">Sales and CRM</h4>
                <div class="d-flex align-items-center">
                    <div class="text-muted small me-4 fw-medium"><i class="bi bi-calendar3 me-1"></i> <span
                            id="current-time"></span></div>
                    <div class="dropdown">
                        <button
                            class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center"
                            type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false"
                            style="width: 38px; height: 38px;">
                            <i class="bi bi-person-fill text-primary" style="font-size: 1.2rem;"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userMenu">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item text-danger" href="#"><i
                                        class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="iframe-container">
                <div id="loader" class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <!-- Default iframe source set to the first dashboard -->
                <iframe id="dashboard-frame" src="Sales and CRM - Domestic.html" title="Dashboard Content"></iframe>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const menuItems = document.querySelectorAll('.menu-item');
            const iframe = document.getElementById('dashboard-frame');
            const titleDisplay = document.getElementById('current-dashboard-title');
            const loader = document.getElementById('loader');

            // Show loader when iframe starts loading
            iframe.addEventListener('load', function () {
                loader.style.display = 'none';
                iframe.style.opacity = '1';
            });

            menuItems.forEach(item => {
                item.addEventListener('click', function (e) {
                    e.preventDefault();

                    const targetSrc = this.getAttribute('data-src');

                    // Skip if already active
                    if (this.classList.contains('active')) return;

                    // Remove active class from all
                    menuItems.forEach(mi => mi.classList.remove('active'));

                    // Add active class to clicked
                    this.classList.add('active');

                    // Show loader and hide iframe content briefly
                    loader.style.display = 'block';
                    iframe.style.opacity = '0.5';

                    // Update iframe src
                    iframe.src = targetSrc;

                    // Update Title
                    const title = this.getAttribute('data-title');
                    titleDisplay.textContent = title;
                });
            });

            // Update time
            function updateTime() {
                const now = new Date();
                const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                document.getElementById('current-time').textContent = now.toLocaleDateString('en-US', options);
            }
            setInterval(updateTime, 60000); // UI updates every minute
            updateTime();
        });
    </script>
</body>

</html>
